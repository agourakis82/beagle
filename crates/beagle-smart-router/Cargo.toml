[package]
name = "beagle-smart-router"
version = "0.1.0"
edition = "2021"
description = "Smart LLM Router - thin compatibility layer delegating to beagle-llm's unified TieredRouter"
license = "MIT"

[dependencies]
tracing = "0.1"
anyhow = "1.0"
once_cell = "1.19"
beagle-llm = { path = "../beagle-llm" }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
