[package]
name = "beagle-rag-update"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
config.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

blake3 = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
walkdir = "2.5"
beagle-search = { path = "../beagle-search" }

[[bin]]
name = "darwin-incremental-indexer"
path = "src/bin/incremental_indexer.rs"

[[bin]]
name = "darwin-knowledge-manager"
path = "src/bin/knowledge_manager.rs"

# darwin-research-harvester excluded on main: depends on beagle_search::{CrossrefClient,
# EuropePmcClient, OpenAlexClient} which are not present in main's beagle-search (API drift on the
# stale feature branch). Re-enable once those clients are reconciled into beagle-search.

[[bin]]
name = "darwin-web-harvester"
path = "src/bin/web_harvester.rs"

[[bin]]
name = "darwin-eval"
path = "src/bin/eval.rs"
