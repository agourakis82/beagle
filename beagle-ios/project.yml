name: BeagleSuite
options:
  bundleIdPrefix: dev.sounio
  xcodeVersion: "26.4"
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
    visionOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: 50
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

packages:
  BeagleSuite:
    path: BeagleSuite
  MetalSplatter:
    url: https://github.com/scier/MetalSplatter
    branch: main

targets:

  # ── BeagleCockpit (iOS + iPadOS + macOS) ──────────────────────
  BeagleCockpit:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: BeagleSuite/Sources/BeagleCockpit
      - path: Assets.xcassets
    dependencies:
      - package: BeagleSuite
        product: BeagleCore
      - package: BeagleSuite
        product: BeagleWorkbenchKit
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
      - package: MetalSplatter
        product: SampleBoxRenderer
      - target: BeagleWidgets
        platformFilter: iOS
      - target: BeagleShare
        platformFilter: iOS
    info:
      path: BeagleCockpit-Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleDisplayName: BeagleCockpit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Para você falar com o companion em vez de digitar. O áudio é transcrito no próprio aparelho e descartado — nada de áudio bruto sai do iPhone."
        NSHealthShareUsageDescription: "Beagle reads recovery signals like HRV, sleep, and workouts so the exocortex can adapt to your actual state."
        NSHealthUpdateUsageDescription: "Beagle records cognitive state snapshots alongside your thoughts so the exocortex can correlate insights with your physiological state."
        NSLocationWhenInUseUsageDescription: "Beagle records the weather (temperature, atmospheric pressure, humidity) at your current location so the exocortex can correlate your environment with how you feel."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Beagle keeps the weather at your location current in the background so environmental shifts (pressure fronts, heat) line up with your physiological signals over time."
        NSMotionUsageDescription: "Beagle reads the device barometer to record the exact local atmospheric pressure where you are."
        NSSpeechRecognitionUsageDescription: "Para transformar a sua fala em texto aqui no aparelho, sem enviar áudio para nenhum servidor."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - beagle
            CFBundleURLName: dev.sounio.cockpit
        NSUserActivityTypes:
          - dev.sounio.cockpit.viewProject
          - dev.sounio.cockpit.viewAgent
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            tail21cbc4.ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            100.111.39.149:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sounio.cockpit
        CODE_SIGN_ENTITLEMENTS: Entitlements/BeagleCockpit.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S9DPGW22A8
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Entitlements/BeagleCockpit.entitlements
      properties:
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.dev.sounio.cockpit
        com.apple.developer.kernel.increased-memory-limit: true

  # ── BeagleWidgets (Widget Extension for BeagleCockpit) ────────
  BeagleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BeagleSuite/Sources/BeagleWidgets
    dependencies:
      - package: BeagleSuite
        product: BeagleCore
    info:
      path: BeagleWidgets-Info.plist
      properties:
        CFBundleDisplayName: BeagleWidgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sounio.cockpit.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S9DPGW22A8
        GENERATE_INFOPLIST_FILE: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Entitlements/BeagleWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.sounio.cockpit

  # ── BeagleShare (Share Extension — capture from any app) ──────
  BeagleShare:
    type: app-extension
    platform: iOS
    sources:
      - path: BeagleSuite/Sources/BeagleShare
    dependencies:
      - package: BeagleSuite
        product: BeagleCore
    info:
      path: BeagleShare-Info.plist
      properties:
        CFBundleDisplayName: Beagle Capture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sounio.cockpit.share
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S9DPGW22A8
        GENERATE_INFOPLIST_FILE: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Entitlements/BeagleShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.sounio.cockpit

  # ── BeagleVisionOS (spatial cockpit) ──────────────────────────
  BeagleVisionOS:
    type: application
    platform: visionOS
    sources:
      - path: BeagleSuite/Sources/BeagleVisionOS
      - path: Assets.xcassets
    dependencies:
      - package: BeagleSuite
        product: BeagleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sounio.cockpit.vision
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S9DPGW22A8
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: BeagleVisionOS
        ITSAppUsesNonExemptEncryption: false

  # ── BeagleWatch (cluster glance) ──────────────────────────────
  BeagleWatch:
    type: application
    platform: watchOS
    sources:
      - path: BeagleSuite/Sources/BeagleWatch
      - path: Assets.xcassets
    dependencies:
      - package: BeagleSuite
        product: BeagleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sounio.cockpit.watch
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S9DPGW22A8
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: BeagleWatchAppIcon
        INFOPLIST_KEY_CFBundleDisplayName: BeagleWatch
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Beagle monitors HRV to suggest flow-state focus modes."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Entitlements/BeagleWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records

# Explicit scheme for the iPhone app so xcodegen always emits it (auto-scheme
# generation was inconsistent). This is the scheme to build/archive/install.
schemes:
  BeagleCockpit:
    build:
      targets:
        BeagleCockpit: all
    run:
      config: Debug
    archive:
      config: Release
