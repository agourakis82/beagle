[package]
name = "beagle-monorepo"
version = "0.1.0"
edition = "2021"
authors = ["Dr. Demetrios Agourakis <contact@darwin-cluster.ai>"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "beagle-monorepo"
path = "src/main.rs"

[[bin]]
name = "pipeline"
path = "src/bin/pipeline.rs"

[[bin]]
name = "core_server"
path = "src/bin/core_server.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
beagle-smart-router = { path = "../../crates/beagle-smart-router" }
beagle-darwin = { path = "../../crates/beagle-darwin" }
beagle-hermes = { path = "../../crates/beagle-hermes" }
beagle-workspace = { path = "../../crates/beagle-workspace" }
beagle-whisper = { path = "../../crates/beagle-whisper" }
beagle-config = { path = "../../crates/beagle-config" }
beagle-health = { path = "../../crates/beagle-health" }
beagle-observability = { path = "../../crates/beagle-observability" }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1.10", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { workspace = true }
beagle-core = { path = "../../crates/beagle-core" }
beagle-feedback = { path = "../../crates/beagle-feedback" }
beagle-triad = { path = "../../crates/beagle-triad" }
beagle-llm = { path = "../../crates/beagle-llm" }
beagle-observer = { path = "../../crates/beagle-observer" }
beagle-serendipity = { path = "../../crates/beagle-serendipity" }
beagle-quantum = { path = "../../crates/beagle-quantum" }
beagle-memory = { path = "../../crates/beagle-memory" }
beagle-search = { path = "../../crates/beagle-search" }
beagle-latex = { path = "../../crates/beagle-latex" }
beagle-exocortex = { path = "../../crates/beagle-exocortex" }
beagle-checkpoint = { path = "../../crates/beagle-checkpoint" }
beagle-agents = { path = "../../crates/beagle-agents" }
# beagle-void e beagle-ontic - HABILITADOS para VoidNavigator completo
beagle-void = { path = "../../crates/beagle-void", optional = true }
beagle-ontic = { path = "../../crates/beagle-ontic", optional = true }
beagle-metrics = { path = "../../crates/beagle-metrics" }
axum = { version = "0.7", features = ["macros", "query"] }
tower-http = { workspace = true }
tempfile = "3.8"
async-trait = "0.1"
# `sync` feature enables BroadcastStream for the cognitive SSE endpoint.
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
# ndarray for the IIT Φ MIP search (crates/beagle-void already depends on it).
ndarray = { version = "0.16", default-features = false, features = ["std"] }
# once_cell::Lazy for process-lifetime clients (EmbeddingClient in
# http_exocortex + http_deep_think).
once_cell = "1.19"

[features]
# Void is default now — the real tensor-math navigator at
# crates/beagle-void/src/navigator.rs:400-514 (eigendecomposition,
# epistemic/aleatoric variance) must ship in the default cluster binary,
# not hide behind a build flag. Ontic stays optional for now.
default = ["void"]
memory = ["beagle-core/memory"]
ontic = ["dep:beagle-ontic"]
void = ["dep:beagle-void"]
full = ["memory", "ontic", "void"]

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
