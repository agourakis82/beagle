apiVersion: v1
kind: Service
metadata:
  name: gpu-chat-tailnet
  namespace: beagle
  annotations:
    tailscale.com/hostname: gpu-chat
    tailscale.com/proxy-class: sounio-workspace-proxy
    tailscale.com/tags: tag:k8s
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: gpu-chat
  ports:
    - name: http
      port: 8090
      targetPort: 8090
