apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-chat
  namespace: beagle
  labels:
    app.kubernetes.io/name: gpu-chat
    app.kubernetes.io/part-of: beagle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-chat
  template:
    metadata:
      labels:
        app: gpu-chat
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: gpu-chat
          # Placeholder tag — the deploy pipeline should pin a real image tag
          # (matching the git-sha scheme other beagle apps use, e.g.
          # project-cockpit:l2tune-503cbb6f) before this ships to prod.
          image: 192.168.3.207:5003/gpu-chat:latest
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: LITELLM_BASE_URL
              value: http://litellm:4000
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gpu-chat-data
