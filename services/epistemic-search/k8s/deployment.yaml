# services/epistemic-search/k8s/deployment.yaml
#
# Mirrors services/sounio-inference/k8s/deployment.yaml's node-pool,
# toleration, and security-context conventions -- both services run
# Sounio-compiled native binaries and need the same seccomp/AppArmor
# exemption on this cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epistemic-search
  namespace: beagle
  labels:
    app: epistemic-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epistemic-search
  template:
    metadata:
      labels:
        app: epistemic-search
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      nodeSelector:
        sounio.dev/runtime-role: cluster-core
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - r770-proxmox
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
      containers:
        - name: epistemic-search
          image: 192.168.3.207:5003/epistemic-search:v6
          imagePullPolicy: Always
          ports:
            - containerPort: 8800
          env:
            - name: SEARXNG_HOST
              value: "10.96.250.10"
            - name: BEAGLE_CORE_HOST
              value: "10.96.250.20"
            # beagle-core's auth impersonates the beagle-operator identity
            # (see search/memory_context.sio's AUTH comment in the sibling
            # conclave-search repo -- its ConsumerId enum has no path to
            # register conclave-search as its own consumer). Sourced from
            # the existing, live beagle-core-tokens Secret -- never
            # hardcode this value in a manifest.
            - name: BEAGLE_OPERATOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beagle-core-tokens
                  key: operator-token
          securityContext:
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
            seccompProfile:
              type: Unconfined
          livenessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 10Gi
          # Memory raised from sounio-inference's mirrored defaults
          # (256Mi/512Mi): a real conclave-search run OOMKilled (exit 137)
          # at 512Mi during live testing. Raised to 4Gi next, which
          # instead produced "madaros: arena full" (exit 181) -- Madaros's
          # TLS runtime reserves an 8GiB mmap arena per process (raised
          # from 2GiB earlier this project specifically to survive
          # multiple real TLS handshakes per process), and a 4Gi cgroup
          # memory.max appears to block that reservation outright rather
          # than letting it stay uncommitted virtual memory. 10Gi gives
          # headroom above the full 8GiB reservation.
---
apiVersion: v1
kind: Service
metadata:
  name: epistemic-search
  namespace: beagle
  labels:
    app: epistemic-search
spec:
  type: ClusterIP
  selector:
    app: epistemic-search
  ports:
    - port: 80
      targetPort: 8800
      protocol: TCP
