type: object
required:
  - context_adequacy_version
  - manuscript_context_adequacy_id
  - manuscript_trajectory_quality_id
  - manuscript_promotion_gate_id
  - source_trajectory_eval_id
  - source_execution_reflection_id
  - source_plan_id
  - workstream_id
  - workspace_id
  - session_id
  - rollout_stage
  - task_family
  - selected_subagent_id
  - expected_subagent_id
  - active_retrieval_query_type
  - active_retrieval_mode
  - compiled_context_sufficient
  - context_sufficiency
  - retrieval_lane_fit
  - graphrag_mode_fit
  - truth_view_fit
  - compiler_profile_fit
  - task_profile_fit
  - subagent_fit
  - handoff_quality
