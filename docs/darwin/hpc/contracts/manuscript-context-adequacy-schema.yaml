      - insufficient
  retrieval_lane_fit:
    type: string
    enum:
      - good-fit
      - partial-fit
      - poor-fit
  graphrag_mode_fit:
    type: string
    enum:
      - good-fit
      - partial-fit
      - poor-fit
  truth_view_fit:
    type: string
    enum:
      - good-fit
      - partial-fit
      - poor-fit
  compiler_profile_fit:
    type: string
    enum:
      - good-fit
      - partial-fit
      - poor-fit
  task_profile_fit:
    type: string
    enum:
      - good-fit
      - partial-fit
      - poor-fit
  subagent_fit:
    type: string
    enum:
      - good-fit
      - partial-fit
      - poor-fit
  handoff_quality:
    type: string
    enum:
      - good-fit
      - partial-fit
      - poor-fit
  editorial_acceptance_fit:
    type: string
    enum:
      - good-fit
      - partial-fit
      - poor-fit
  same_beagle_owned_identity:
    type: boolean
  note:
    type: string
