      - implementation-and-analysis-canary-live-manuscript-quality-uplift
  task_family:
    type: string
  selected_subagent_id:
    type: string
  expected_subagent_id:
    type: string
  suggested_subagent_id:
    type: [string, "null"]
  suggested_work_mode:
    type: [string, "null"]
  active_retrieval_query_type:
    type: string
  active_retrieval_mode:
    type: string
  compiled_context_retrieval_query_type:
    type: [string, "null"]
  compiled_context_task_profile:
    type: [string, "null"]
  compiled_context_budget_profile_id:
    type: [string, "null"]
  active_graphrag_query_mode:
    type: [string, "null"]
  compiled_context_graphrag_query_mode:
    type: [string, "null"]
  temporal_truth_view:
