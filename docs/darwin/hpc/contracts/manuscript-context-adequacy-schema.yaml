properties:
  context_adequacy_version:
    type: string
    enum:
      - beagle-manuscript-context-adequacy-v1
  manuscript_context_adequacy_id:
    type: string
  manuscript_trajectory_quality_id:
    type: string
  manuscript_promotion_gate_id:
    type: string
  source_trajectory_eval_id:
    type: string
  source_execution_reflection_id:
    type: string
  source_plan_id:
    type: string
  workstream_id:
    type: string
  workspace_id:
    type: string
  session_id:
    type: string
  generated_at:
    type: string
  rollout_stage:
    type: string
