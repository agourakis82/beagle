version: beagle-workbench-session-v1
kind: workbench-session
type: object
required:
  - phase
  - contract_kind
  - contract_version
  - workstream_id
  - workspace_id
  - session_id
  - same_beagle_owned_identity
  - workspace_identity_owner
  - workspace_tenancy_state
  - stable_workspace_alias
  - workspace_root
  - default_dev_plane
  - active_dev_plane
  - governance_state
  - fallback_active
  - workspace_tenancy_path
  - workspace_subagents_path
  - workspace_subagent_route_path
  - context_packet_path
  - plan_execution_path
  - client_access
  - subagent_roles
  - memory_context
