  workspace_identity_owner:
    type: string
  workspace_tenancy_state:
    type: string
  stable_workspace_alias:
    type: string
  workspace_root:
    type: string
  default_dev_plane:
    type: string
  active_dev_plane:
    type: string
  governance_state:
    type: string
  fallback_active:
    type: boolean
  workspace_tenancy_path:
    type: string
  workspace_subagents_path:
    type: string
  workspace_subagent_route_path:
    type: string
  context_packet_path:
    type: string
  plan_execution_path:
    type: string
  client_access:
    type: array
  subagent_roles:
    type: array
  recommended_subagent_id:
    type: [string, "null"]
  live_selected_subagent_id:
    type: [string, "null"]
  live_execution_state:
    type: [string, "null"]
  memory_context:
    type: object
  note:
    type: string
