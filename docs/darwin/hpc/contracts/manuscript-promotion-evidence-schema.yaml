      - supports-stage-manuscript-canary
      - keep-shadow
      - rollback-shadow
  same_beagle_owned_identity:
    type: boolean
  note:
    type: string
    description: B24.16/B24.17 bounded rationale describing whether explicit manuscript promotion evidence is merely labeled or has been refreshed with acquired alignment signals.
