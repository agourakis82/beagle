    type: integer
    minimum: 0
  execution_outcome_alignment_aligned_count:
    type: integer
    minimum: 0
  execution_outcome_alignment_misaligned_count:
    type: integer
    minimum: 0
  execution_outcome_alignment_insufficient_evidence_count:
    type: integer
    minimum: 0
  review_quality_operator_ready_count:
    type: integer
    minimum: 0
