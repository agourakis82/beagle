type: object
required:
  - phase
  - contract_kind
  - contract_version
  - workstream_id
  - workspace_id
  - session_id
  - same_beagle_owned_identity
  - selected_subagent_id
  - workspace_root
  - run_label
  - submitted_job_id
  - repo_accessible
  - capture_kind
  - dirty_state
properties:
  phase:
    type: string
    const: B25.6
  contract_kind:
    type: string
    const: workspace-snapshot
  contract_version:
    type: string
  workstream_id:
    type: string
  workspace_id:
    type: string
  session_id:
    type: string
  same_beagle_owned_identity:
    type: boolean
  selected_subagent_id:
    type: string
  workspace_root:
    type: string
  run_label:
    type: string
  submitted_job_id:
    type: integer
  repo_root:
    type: [string, "null"]
  repo_accessible:
    type: boolean
  capture_kind:
    type: string
  branch:
    type: [string, "null"]
  commit:
    type: [string, "null"]
  tree_ish:
    type: [string, "null"]
  dirty_state:
    type: string
    enum: [clean, dirty, unknown]
  patch_ref:
    type: [string, "null"]
  captured_at:
    type: string
  note:
    type: string
