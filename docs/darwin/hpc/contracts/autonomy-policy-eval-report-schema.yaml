type: object
required:
  - report_version
  - report_id
  - dataset_id
  - policy_id
  - workstream_id
  - workspace_id
  - session_id
  - generated_at
  - stage_state
  - evaluated_sample_count
  - replay_sample_count
  - shadow_sample_count
  - false_auto_continue_rate_basis_points
  - false_review_required_rate_basis_points
  - false_blocked_rate_basis_points
  - operator_alignment_rate_basis_points
  - execution_alignment_rate_basis_points
  - policy_posture
  - decision_class_coverage
  - task_family_summaries
  - signal_importance
  - note
properties:
  report_version:
    type: string
    const: beagle-autonomy-policy-eval-report-v1
  report_id:
    type: string
  dataset_id:
    type: string
  policy_id:
    type: string
  workstream_id:
    type: string
  workspace_id:
    type: string
  session_id:
    type: string
  generated_at:
    type: string
  stage_state:
    type: string
    const: shadow-only
  evaluated_sample_count:
    type: integer
  replay_sample_count:
    type: integer
  shadow_sample_count:
    type: integer
  false_auto_continue_rate_basis_points:
    type: integer
  false_review_required_rate_basis_points:
    type: integer
  false_blocked_rate_basis_points:
    type: integer
  operator_alignment_rate_basis_points:
    type: integer
  execution_alignment_rate_basis_points:
    type: integer
  policy_posture:
    type: string
    enum:
      - too-permissive
      - too-conservative
      - correctly-calibrated
  decision_class_coverage:
    type: array
    items:
      type: string
      enum:
        - auto-continue
        - review-required
        - blocked
  task_family_summaries:
    type: array
    items:
      type: object
      required:
        - task_family
        - sample_count
        - predicted_auto_continue_count
        - predicted_review_required_count
        - predicted_blocked_count
        - expected_auto_continue_count
        - expected_review_required_count
        - expected_blocked_count
        - false_auto_continue_rate_basis_points
        - false_review_required_rate_basis_points
        - false_blocked_rate_basis_points
        - calibration_posture
        - note
      properties:
        task_family:
          type: string
        sample_count:
          type: integer
        predicted_auto_continue_count:
          type: integer
        predicted_review_required_count:
          type: integer
        predicted_blocked_count:
          type: integer
        expected_auto_continue_count:
          type: integer
        expected_review_required_count:
          type: integer
        expected_blocked_count:
          type: integer
        false_auto_continue_rate_basis_points:
          type: integer
        false_review_required_rate_basis_points:
          type: integer
        false_blocked_rate_basis_points:
          type: integer
        calibration_posture:
          type: string
        note:
          type: string
  signal_importance:
    type: array
    items:
      type: object
      required:
        - signal_id
        - matched_count
        - risk_count
        - auto_continue_count
        - review_required_count
        - blocked_count
        - impact_level
        - note
      properties:
        signal_id:
          type: string
        matched_count:
          type: integer
        risk_count:
          type: integer
        auto_continue_count:
          type: integer
        review_required_count:
          type: integer
        blocked_count:
          type: integer
        impact_level:
          type: string
        note:
          type: string
  note:
    type: string
