  - study_decision_id
  - baseline_run_id
  - latest_run_id
  - registry_run_count
  - sweep_variant_count
  - compared_run_count
  - successful_run_count
  - failed_run_count
  - latest_run_diff_categories
  - changed_categories_union
  - best_run_id
  - best_variant_id
  - best_run_label
  - best_variant_label
