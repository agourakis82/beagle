    type: integer
  successful_run_count:
    type: integer
  failed_run_count:
    type: integer
  latest_run_diff_categories:
    type: array
    items:
      type: string
  changed_categories_union:
    type: array
    items:
      type: string
  best_run_id:
    type: string
  best_variant_id:
    type: string
  best_run_label:
    type: string
  best_variant_label:
    type: string
  best_run_score:
    type: integer
  best_run_reason:
    type: string
