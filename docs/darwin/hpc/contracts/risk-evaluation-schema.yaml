type: object
required:
  - risk_evaluation_version
  - risk_evaluation_id
  - autonomy_policy_id
  - source_execution_id
  - source_plan_id
  - review_inbox_item_id
  - review_decision_id
  - follow_on_plan_id
  - workstream_id
  - workspace_id
  - session_id
  - task_family
  - selected_subagent_id
  - retrieval_query_type
  - compiler_profile_id
  - graphrag_query_mode
  - temporal_truth_view
  - trajectory_quality
  - overall_quality_score
  - replan_required
  - requested_operator_action
  - review_action
  - matched_policy_signals
  - risk_signals
  - risk_score
  - risk_level
  - recommended_decision_class
  - note
properties:
  risk_evaluation_version:
    type: string
    const: beagle-risk-evaluation-v1
  risk_evaluation_id:
    type: string
  autonomy_policy_id:
    type: string
  source_execution_id:
    type: string
  source_plan_id:
    type: string
  review_inbox_item_id:
    type: string
  review_decision_id:
    type: string
  follow_on_plan_id:
    type: string
  workstream_id:
    type: string
  workspace_id:
    type: string
  session_id:
    type: string
  task_family:
    type: string
  selected_subagent_id:
    type: string
  retrieval_query_type:
    type: string
  compiler_profile_id:
    type: string
  graphrag_query_mode:
    type: string
  temporal_truth_view:
    type: string
  trajectory_quality:
    type: string
  overall_quality_score:
    type: integer
  replan_required:
    type: boolean
  requested_operator_action:
    type: string
  review_action:
    type: string
  matched_policy_signals:
    type: array
    items:
      type: string
  risk_signals:
    type: array
    items:
      type: object
      required:
        - signal_id
        - severity
        - policy_effect
        - observed_value
        - note
      properties:
        signal_id:
          type: string
        severity:
          type: string
        policy_effect:
          type: string
        observed_value:
          type: string
        note:
          type: string
  risk_score:
    type: integer
  risk_level:
    type: string
    enum:
      - low
      - moderate
      - high
  recommended_decision_class:
    type: string
    enum:
      - auto-continue
      - review-required
      - blocked
  note:
    type: string
