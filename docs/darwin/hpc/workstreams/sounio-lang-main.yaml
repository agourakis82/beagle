id: sounio-lang-main
repo: sounio-lang/sounio
default_branch: main
branch_lineage: main
scope: sounio-lang-compiler-mainline
default_dev_plane: beagle-cluster
vm_fallback_role: fallback-only

compute_profiles:
  default: cpu-short-v1
  batch: cpu-batch-v1
  advanced: gpu-single-v1

result_plane:
  publication: object-backed
  retrieval: object-backed
  retention_policy: active

consumer_policy:
  operator: full
  darwin_research: bounded

recovery_policy:
  handoff_required: true
  recovery_required: true

recipes:
  registry_root: docs/darwin/hpc/workstreams/recipes
  validation_state: canonical-live
  repo_native_dev_loop: docs/darwin/hpc/workstreams/recipes/sounio-lang-main.repo_native_dev_loop.yaml
  operator_cpu_loop: docs/darwin/hpc/workstreams/recipes/sounio-lang-main.operator_cpu_loop.yaml
  operator_gpu_loop: docs/darwin/hpc/workstreams/recipes/sounio-lang-main.operator_gpu_loop.yaml
  recovery_resume_loop: docs/darwin/hpc/workstreams/recipes/sounio-lang-main.recovery_resume_loop.yaml
  latest_validation_phase: B26.7
  latest_validation_workspace_id: sounio-cluster-pilot
  latest_validation_session_id: ws-cluster-sounio-habitat

promotion_state:
  state: canonical
  last_transition: resume
  allowed_states:
    - staged
    - pilot
    - canonical
    - held
    - rollback
    - recovery
  allowed_transitions:
    - name: promote
      from: staged
      to: pilot
    - name: promote
      from: pilot
      to: canonical
    - name: hold
      from: canonical
      to: held
    - name: resume
      from: held
      to: canonical
    - name: rollback
      from: canonical
      to: rollback
    - name: recover
      from: rollback
      to: recovery
    - name: resume
      from: recovery
      to: canonical
  source_phase: B26.7
  canonical_workspace_id: sounio-cluster-pilot
  canonical_session_id: ws-cluster-sounio-habitat
  latest_validation_phase: B26.7
  latest_validation_workspace_id: sounio-cluster-pilot
  latest_validation_session_id: ws-cluster-sounio-habitat
