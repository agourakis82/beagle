apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sounio-workspace-control
  labels:
    app.kubernetes.io/name: sounio-workspace-control
    app.kubernetes.io/part-of: beagle
spec:
  serviceName: sounio-workspace-control-internal
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: sounio-workspace-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sounio-workspace-control
        app.kubernetes.io/part-of: beagle
      annotations:
        sounio.dev/control-workspace-purpose: "single persistent human-agent surface; no GPU"
    spec:
      serviceAccountName: sounio-workspace-admin
      priorityClassName: sounio-workspace-critical
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Unconfined
      initContainers:
        - name: normalize-permissions
          image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260425-zellij1:stable
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - >
              set -euo pipefail;
              mkdir -p /workspace/.beagle /workspace/.home/openvscode-server;
              chown 1000:1000 /workspace /workspace/.beagle /workspace/.home /workspace/.home/openvscode-server || true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
      containers:
        - name: workspace-ide
          image: 192.168.3.207:5003/sounio-lab-sounio-workspace-ide-20260424070010-slurmnative6:stable
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - /opt/sounio-workspace/bootstrap-workspace.sh
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BEAGLE_WORKSPACE_ID
              value: sounio-control-workspace
            - name: BEAGLE_SESSION_ID
              value: sounio-dev-control
            - name: BEAGLE_WORKSPACE_BROWSER_URL
              value: http://sounio-workspace.beagle.svc.cluster.local:8080
            - name: HOME
              value: /workspace/.home/openvscode-server
            - name: USER
              value: openvscode-server
            - name: LOGNAME
              value: openvscode-server
            - name: SHELL
              value: /usr/bin/zsh
            - name: NODE_OPTIONS
              value: --max-old-space-size=8192
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-config
              mountPath: /opt/sounio-workspace
              readOnly: true
            - name: slurm-runtime
              mountPath: /run/slurm
            - name: workspace-slurm-auth
              mountPath: /etc/slurm
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 12Gi
        - name: workspace-ssh
          image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260425-zellij1:stable
          imagePullPolicy: IfNotPresent
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - -lc
            - >
              passwd -d openvscode-server >/dev/null 2>&1 || true;
              exec /usr/local/bin/ssh-entrypoint.sh
          ports:
            - name: ssh
              containerPort: 2222
          env:
            - name: BEAGLE_WORKSPACE_ID
              value: sounio-control-workspace
            - name: BEAGLE_SESSION_ID
              value: sounio-dev-control
            - name: BEAGLE_WORKSPACE_BROWSER_URL
              value: http://sounio-workspace.beagle.svc.cluster.local:8080
            - name: HOME
              value: /workspace/.home/openvscode-server
            - name: USER
              value: openvscode-server
            - name: LOGNAME
              value: openvscode-server
            - name: SHELL
              value: /usr/bin/zsh
            - name: LANG
              value: C.UTF-8
            - name: LC_ALL
              value: C.UTF-8
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-config
              mountPath: /opt/sounio-workspace
              readOnly: true
            - name: workspace-ssh-authorized-keys
              mountPath: /var/run/beagle-workspace-ssh
              readOnly: true
            - name: slurm-runtime
              mountPath: /run/slurm
            - name: workspace-slurm-auth
              mountPath: /etc/slurm
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 64Gi
        - name: beagle-pty-supervisor
          image: 192.168.3.207:5003/beagle-workspace-agent:sounio-workday-mvp-c63a309
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - node
            - /app/src/pty-supervisor.mjs
          env:
            - name: BEAGLE_WORKSPACE_SLUG
              value: sounio
            - name: PROJECT_SLUG
              value: sounio
            - name: BEAGLE_WORKSPACE_ROOT
              value: /workspace/sounio
            - name: PROJECT_WORKSPACE_ROOT
              value: /workspace/sounio
            - name: BEAGLE_PTY_SUPERVISOR_HOST
              value: 127.0.0.1
            - name: BEAGLE_PTY_SUPERVISOR_PORT
              value: "4372"
            - name: SHELL
              value: /bin/bash
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - node -e "fetch('http://127.0.0.1:4372/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - node -e "fetch('http://127.0.0.1:4372/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
        - name: beagle-workspace-agent
          image: 192.168.3.207:5003/beagle-workspace-agent:memory-spine-surface-fold-202605080146-bbf2506
          imagePullPolicy: Always
          command:
            - node
            - /app/src/server.mjs
          ports:
            - name: workbench
              containerPort: 4371
          env:
            - name: BEAGLE_WORKSPACE_SLUG
              value: sounio
            - name: PROJECT_SLUG
              value: sounio
            - name: BEAGLE_WORKSPACE_ROOT
              value: /workspace/sounio
            - name: PROJECT_WORKSPACE_ROOT
              value: /workspace/sounio
            - name: BEAGLE_WORKBENCH_DIR
              value: /workspace/.beagle/workbench
            - name: BEAGLE_WORKSPACE_AGENT_PORT
              value: "4371"
            - name: BEAGLE_PTY_SUPERVISOR_URL
              value: http://127.0.0.1:4372
            - name: BEAGLE_CORE_URL
              value: http://beagle-core.beagle.svc.cluster.local:8080
          envFrom:
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - node -e "fetch('http://127.0.0.1:4371/v1/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - node -e "fetch('http://127.0.0.1:4371/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: workspace-data-sounio-workspace-habitat-0
        - name: workspace-config
          configMap:
            name: sounio-workspace-config
            defaultMode: 0755
        - name: workspace-ssh-authorized-keys
          secret:
            secretName: sounio-workspace-ssh-authorized-keys
            optional: true
            defaultMode: 0600
        - name: slurm-runtime
          emptyDir:
            medium: Memory
        - name: workspace-slurm-auth
          secret:
            secretName: sounio-workspace-slurm-auth
            defaultMode: 0440
