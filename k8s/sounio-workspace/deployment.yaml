apiVersion: apps/v1
kind: Deployment
metadata:
  name: sounio-workspace
  namespace: beagle
spec:
  # Legacy pre-habitat deployment kept scaled down so future applies do not
  # resurrect the stale workspace surface. The active front door is the
  # StatefulSet-backed habitat behind the stable `sounio-workspace` service.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sounio-workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sounio-workspace
        app.kubernetes.io/part-of: beagle
    spec:
      serviceAccountName: sounio-workspace-admin
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      containers:
        - name: workspace-ide
          image: 192.168.3.207:5003/sounio-lab-sounio-workspace-ide-20260424070010-slurmnative6:stable
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - /opt/sounio-workspace/bootstrap-workspace.sh
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-config
              mountPath: /opt/sounio-workspace/bootstrap-workspace.sh
              subPath: bootstrap-workspace.sh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
        - name: workspace-ssh
          image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260424065320-slurmnative5:stable
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - -lc
            - passwd -d openvscode-server >/dev/null 2>&1 || true; exec /usr/local/bin/ssh-entrypoint.sh
          ports:
            - name: ssh
              containerPort: 2222
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-ssh-authorized-keys
              mountPath: /var/run/beagle-workspace-ssh
              readOnly: true
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: sounio-workspace-data
        - name: workspace-config
          configMap:
            name: sounio-workspace-config
            defaultMode: 0755
        - name: workspace-ssh-authorized-keys
          secret:
            secretName: sounio-workspace-ssh-authorized-keys
            optional: true
            defaultMode: 0600
