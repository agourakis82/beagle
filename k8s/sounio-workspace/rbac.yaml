apiVersion: v1
kind: ServiceAccount
metadata:
  name: sounio-workspace-admin
  namespace: beagle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sounio-workspace-admin-cluster-admin
subjects:
  - kind: ServiceAccount
    name: sounio-workspace-admin
    namespace: beagle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
