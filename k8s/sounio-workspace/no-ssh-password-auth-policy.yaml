# Guardrail — block SSH password auth on beagle workspace/agent pods.
#
# Context: incident 2026-08-07/08 (see /home/devsounio/.claude/projects/-home-devsounio/memory/
# project_grok_esporo_backdoor_incident.md). The `brother-gpu-workspace` StatefulSet had
# BEAGLE_WORKSPACE_SSH_ENABLE_PASSWORD_AUTH=true + seccomp/AppArmor Unconfined + nodeAffinity
# preferring t560 (control-plane) — that combination was the vector used to escape the
# container to node root and plant the "esporo" worm. Password auth is opt-in per workspace
# (a `<name>-ssh-password` Secret is created and mounted); every other workspace in the
# cluster is key-only. This policy makes that the enforced default instead of a convention
# someone has to remember.
#
# Uses native Kubernetes ValidatingAdmissionPolicy (built into the apiserver, k8s >=1.28,
# GA in 1.30+; this cluster runs 1.35) — no Kyverno/Gatekeeper install required.
#
# STAGED ROLLOUT — apply in this order:
#   1. kubectl apply -f no-ssh-password-auth-policy.yaml
#      (ships with validationActions: [Warn], failurePolicy: Ignore — logs/warns only,
#       never blocks anything, safe to apply to the live beagle namespace immediately)
#   2. Watch for a while: kubectl get events -n beagle --field-selector reason=FailedValidation
#      or check apiserver audit logs for policy=block-workspace-ssh-password-*
#   3. Once confident there are no false positives, flip BOTH bindings below to
#      validationActions: [Deny] and failurePolicy: Fail to actually enforce.
#
# Rollback:
#   kubectl delete -f no-ssh-password-auth-policy.yaml
#   (No effect on already-running pods/secrets — this only gates future create/update.)

---
# Blocks creation of any Secret in the beagle namespace named "*-ssh-password"
# (the exact pattern used to opt a workspace into password-based SSH auth).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: block-workspace-ssh-password-secret
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  validations:
    - expression: "!object.metadata.name.endsWith('-ssh-password')"
      message: >-
        SSH password secrets are blocked for workspace pods — key-only auth is required.
        See incident 2026-08-07 (brother-gpu-workspace / esporo worm). If this secret is
        genuinely needed, get sign-off first, then flip this policy's failurePolicy/
        validationActions back to permissive, apply the secret, and re-enable enforcement.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: block-workspace-ssh-password-secret-binding
spec:
  policyName: block-workspace-ssh-password-secret
  validationActions: ["Warn"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: beagle

---
# Blocks StatefulSets/Deployments in the beagle namespace whose pod template sets
# BEAGLE_WORKSPACE_SSH_ENABLE_PASSWORD_AUTH=true on any container.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: block-workspace-ssh-password-env
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets", "deployments"]
  validations:
    - expression: >-
        !object.spec.template.spec.containers.exists(c,
          has(c.env) && c.env.exists(e,
            e.name == 'BEAGLE_WORKSPACE_SSH_ENABLE_PASSWORD_AUTH' && e.value == 'true'))
      message: >-
        BEAGLE_WORKSPACE_SSH_ENABLE_PASSWORD_AUTH=true is blocked — workspaces must use
        key-only SSH auth. See incident 2026-08-07 (brother-gpu-workspace / esporo worm).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: block-workspace-ssh-password-env-binding
spec:
  policyName: block-workspace-ssh-password-env
  validationActions: ["Warn"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: beagle
