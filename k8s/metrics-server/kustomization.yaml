apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.1/components.yaml
patches:
  - path: metrics-server-lab-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: metrics-server
      namespace: kube-system
