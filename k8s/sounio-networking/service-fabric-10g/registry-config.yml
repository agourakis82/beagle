version: 0.1

log:
  level: info
  formatter: text

storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true

http:
  addr: :5000
  headers:
    X-Content-Type-Options:
      - nosniff

proxy:
  remoteurl: https://registry-1.docker.io
  ttl: 168h

health:
  storagedriver:
    enabled: true
    interval: 30s
    threshold: 3
