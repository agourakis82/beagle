version: 0.1

log:
  level: info

storage:
  filesystem:
    rootdirectory: /var/lib/registry
  cache:
    blobdescriptor: inmemory

delete:
  enabled: true

http:
  addr: :5000
  headers:
    X-Content-Type-Options:
      - nosniff

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3

proxy:
  remoteurl: https://registry-1.docker.io
  ttl: 168h
