auto vmbr30
iface vmbr30 inet static
	address 10.30.0.1/24
	bridge-ports nic0
	bridge-stp off
	bridge-fd 0
	mtu 9000
	post-up ip link set dev nic0 mtu 9000 || true
	post-up iptables -t nat -C POSTROUTING -s 10.30.0.0/24 -o vmbr0 -j MASQUERADE || iptables -t nat -A POSTROUTING -s 10.30.0.0/24 -o vmbr0 -j MASQUERADE
	post-down iptables -t nat -D POSTROUTING -s 10.30.0.0/24 -o vmbr0 -j MASQUERADE || true
