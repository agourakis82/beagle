dns:
  kubernetes_zone: cluster.local
  lab_zone: lab.sounio
  tailnet_mode: magicdns
  records:
    - name: t560.lab.sounio
      ip: 10.100.100.2
      role: control-plane
    - name: r770.lab.sounio
      ip: 10.100.100.1
      role: gpu-node
    - name: r740.lab.sounio
      ip: 10.100.100.4
      role: gpu-node
    - name: pve-5860.lab.sounio
      ip: 10.100.100.3
      role: gpu-node
    - name: workspace.lab.sounio
      target: sounio-workspace.beagle.svc.cluster.local
      role: stable-workspace-entry

