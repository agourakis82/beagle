gpu_fabric:
  preferred_name: gpufabric0
  current_host_interfaces:
    t560-proxmox:
      current_name: nic7
      altname: enp153s0f1np1
      ip: 10.200.0.2
    r770-proxmox:
      current_name: nic3
      altname: enP1s3f0np0
      ip: 10.200.0.1
    r740-proxmox:
      current_name: nic4
      altname: enp59s0f0np0
      ip: 10.200.0.4
    5860-proxmox:
      current_name: ens5f1np1
      altname: enp16s0f1np1
      ip: 10.200.0.3
  policy:
    phase1: use-10-200-for-rdma-pilot
    phase2: carve-vlan-210-and-move-rdma

service_fabric:
  edge_node: 5860-proxmox
  preferred_future_edge_node: t560-proxmox
  switch:
    management_ip: 192.168.3.229
    interface: Ethernet33
    preferred_future_interface: Ethernet34
    vlan: 130
    svi: 10.30.0.254/24
  host:
    interface: nic0
    bridge: vmbr30
    bridge_ip: 10.30.0.1/24
    upstream: vmbr0
    nat: masquerade-10.30.0.0/24-out-vmbr0
    dns:
      bind: 10.30.0.1
      upstream:
        - 192.168.3.1
      conditional:
        lab.sounio: 10.96.80.85
    dhcp:
      range: 10.30.0.100-10.30.0.199
  validation:
    link_state: connected-10g
    host_ping_to_svi: pass
    svi_ping_to_host: pass

