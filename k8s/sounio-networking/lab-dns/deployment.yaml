apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-dns
    spec:
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: coredns
          image: coredns/coredns:1.12.1
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: lab-dns-config
