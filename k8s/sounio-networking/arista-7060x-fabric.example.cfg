! Sounio lab fabric blueprint for the Arista 7060X pair.
! This is an example skeleton, not a blindly safe live config.

vlan 3
   name MGMT
vlan 100
   name K8S_UNDERLAY
vlan 200
   name STORAGE_MIGRATION
vlan 210
   name GPU_RDMA

interface Vlan3
   description MGMT gateway
   ip address 192.168.3.254/24

interface Vlan100
   description Kubernetes underlay gateway
   mtu 9000
   ip address 10.100.100.254/24

interface Vlan200
   description Storage and migration gateway
   mtu 9000
   ip address 10.200.0.254/24

interface Vlan210
   description GPU RDMA fabric gateway
   mtu 9000
   ip address 10.210.0.254/24

! Example uplinks. Replace the Ethernet members with the real switch ports.
!
!interface Port-Channel10
!   description t560-proxmox-100g
!   switchport trunk allowed vlan 100,200,210
!   switchport mode trunk
!   mtu 9214
!
!interface Ethernet1/1
!   channel-group 10 mode active
!interface Ethernet1/2
!   channel-group 10 mode active

! RoCE / RDMA posture:
! - enable lossless behavior only on VLAN 210
! - keep VLAN 100 boring and deterministic
! - keep VLAN 200 tuned for jumbo storage/migration but without RDMA QoS
!
! The exact ECN/PFC syntax depends on the EOS release and global QoS model in use.
! Treat this file as the source of desired intent, then adapt it to the exact
! Arista software train before applying live.
