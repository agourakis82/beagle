# kaniko build of the memory-pg custom Postgres image
# (ParadeDB 0.24.1-pg16 + pgvector 0.8.3, keeps pg_search).
#
# Pattern mirrors k8s/beagle-memory-lab/build-job-hardening.yaml:
#   initContainer git-clones branch feat/memory-pg into an emptyDir,
#   kaniko builds k8s/memory-pg/Dockerfile with --context=dir:///workspace.
#
# The branch MUST be pushed to origin before applying this job.
# Destination: 192.168.3.207:5003/memory-pg-postgres:pgvector083-pg16
apiVersion: batch/v1
kind: Job
metadata:
  name: memory-pg-image-build
  namespace: beagle
  labels:
    app: memory-pg
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: memory-pg
    spec:
      nodeSelector:
        sounio.dev/runtime-role: cluster-core
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: Unconfined
      restartPolicy: Never
      initContainers:
        - name: clone
          image: alpine/git:latest
          env:
            - name: BEAGLE_GIT_BRANCH
              value: feat/memory-pg
          command:
            - /bin/sh
            - -lc
            - git clone --depth=1 --branch="${BEAGLE_GIT_BRANCH:-main}" https://github.com/agourakis82/beagle.git /workspace
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - "--dockerfile=/workspace/k8s/memory-pg/Dockerfile"
            - "--context=dir:///workspace"
            - "--destination=192.168.3.207:5003/memory-pg-postgres:pgvector083-pg16"
            - "--insecure-registry=192.168.3.207:5003"
            - "--cache=false"
            - "--snapshot-mode=redo"
            - "--verbosity=info"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 12Gi
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
