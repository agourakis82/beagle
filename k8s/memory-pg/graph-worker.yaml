# Phase 4.3 going-forward graph trickle worker — r1-distill-70b over pending_graph
# (new memories enqueued by captureRecord when MEMORY_PG_GRAPH_ENABLED). Low volume,
# high quality. Separate tier from the qwen historical backfill.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-pg-graph-worker
  namespace: beagle
  labels: { app: memory-pg, component: graph-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: memory-pg, component: graph-worker }
  template:
    metadata:
      labels: { app: memory-pg, component: graph-worker }
    spec:
      # dl380 fora: pods nesse no nao alcancam a rede — nem o Postgres do Spark
      # (192.168.3.24:5433), nem ClusterIP interno. Medido 02-ago-2026: o HOST
      # alcanca, o POD nao. O no entrou no cluster depois e a rede de pods dele
      # nunca ficou completa. Sem isto o Deployment cai la e falha em silencio —
      # foi exatamente o que aconteceu quando o serve foi reagendado.
      # NAO troque por nodeSelector t560: isso recria o SPOF P0 no t560. A
      # exclusao deixa 4 nos elegiveis.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["dl380-proxmox"]
      tolerations:
        - { key: sounio.dev/compute, operator: Equal, value: heavy, effect: NoSchedule }
        - { key: sounio.dev/pool, operator: Equal, value: gpu-batch, effect: NoSchedule }
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      securityContext:
        seccompProfile: { type: Unconfined }
      containers:
        - name: graph-worker
          image: 192.168.3.207:5003/memory-pg-embed-worker:p2-ffbb9d6a
          command: ["node", "bin/graph-worker.mjs"]
          env:
            - name: MEMORY_PG_DSN
              valueFrom: { secretKeyRef: { name: memory-pg, key: DATABASE_URL } }
            - name: GRAPH_LLM_URL
              value: http://router.llm-router.svc.cluster.local:4000
            - name: GRAPH_MODEL
              value: r1-distill-70b
            - name: BEAGLE_TEI_EMBED_URL
              value: http://192.168.3.43:8080/embed
            - name: GRAPH_BATCH
              value: "2"
          resources:
            requests: { cpu: "200m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
