# Faixa BULK da extração de grafo — todo registro que NÃO é fala do sujeito.
#
# O desenho tem duas faixas, particionadas por `prov_actor` e disjuntas por negação (ver
# `graph-worker-voz.yaml`): `voice` é o que ele disse, e vai no modelo caro; `bulk` é todo o
# resto, e vai no modelo de volume. A partição é por negação e não por enumeração de propósito —
# um `prov_actor` novo cai automaticamente em `bulk`, nunca no vão entre as duas.
#
# ⚠️ Este arquivo esteve 180° defasado do cluster: dizia 1 réplica no `r1-distill-70b` via
# roteador, enquanto o vivo rodava 3 réplicas no `qwen2.5:14b` do Spark. Aplicá-lo teria
# revertido a faixa inteira. Reconciliado com o vivo em 18-ago-2026, no mesmo passo em que a
# extração mudou de backend. Antes de aplicar: `kubectl get deploy ... -o json` e comparar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-pg-graph-worker
  namespace: beagle
  labels: { app: memory-pg, component: graph-worker }
spec:
  # 3 réplicas, e cada uma processa seu lote SERIALMENTE (`for ... await` em
  # `runGraphOnce`). A concorrência real contra o servidor de LLM é 3, não 3×GRAPH_BATCH —
  # `GRAPH_BATCH` é quantas linhas a réplica reivindica por rodada, não quantas dispara juntas.
  # Isso é o que faz as 3 caberem nos 4 slots do llama.cpp sem fila, sobrando um para o chat.
  replicas: 3
  selector:
    matchLabels: { app: memory-pg, component: graph-worker }
  template:
    metadata:
      labels: { app: memory-pg, component: graph-worker }
    spec:
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      # HISTÓRICO — não remova esta nota junto com o código que ela explica.
      # Em 02-ago-2026 pods no dl380 não alcançavam NADA: nem ClusterIP, nem o
      # próprio host, nem a rede externa. O HOST alcançava; o POD não. Um rollout
      # reagendou o memory-pg-serve para lá e o recall inteiro do companion parou,
      # sem nada indicar a causa.
      #
      # Causa raiz: /usr/lib/sysctl.d/pve-firewall.conf (vendor Proxmox) define
      # net.ipv4.conf.all.rp_filter=2 e, por ordem alfabética, é aplicado DEPOIS de
      # 99-cilium-*.conf (ASCII: "9" < "p"). O valor do vendor vencia e o reverse
      # path filtering matava o datapath do Cilium. Os outros nós já sombreavam o
      # arquivo do vendor com /etc/sysctl.d/pve-firewall.conf; o dl380 não.
      #
      # CONSERTADO no nó (sombreamento instalado, sobrevive a restart do
      # pve-firewall e a sysctl --system). A exclusão por nodeAffinity que existia
      # aqui foi REMOVIDA depois de o companion-health passar rodando no dl380.
      # Se um pod voltar a falhar em rede, verifique primeiro:
      #     sysctl -n net.ipv4.conf.all.rp_filter    # tem que ser 0
      tolerations:
        - { key: sounio.dev/compute, operator: Equal, value: heavy, effect: NoSchedule }
        - { key: sounio.dev/pool, operator: Equal, value: gpu-batch, effect: NoSchedule }
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      securityContext:
        seccompProfile: { type: Unconfined }
      containers:
        - name: graph-worker
          image: 192.168.3.207:5003/memory-pg-embed-worker:p33-oversized-68278863
          command: ["node", "bin/graph-worker.mjs"]
          env:
            - name: MEMORY_PG_DSN
              valueFrom: { secretKeyRef: { name: memory-pg, key: DATABASE_URL } }
            # 18-ago-2026: saiu do Ollama do Spark (192.168.3.24:11434) para o llama.cpp na L4
            # do r770 (`llamacpp-l4-r770.yaml`). Mesma família de modelo de propósito — trocar
            # família junto com hardware misturaria duas variáveis, e eu já errei uma vez
            # concluindo qualidade a partir de vazão.
            #
            # O que motivou: o alarme da frota mediu `qwen2.5:14b` no Spark em 35,4 s para UM
            # token, contra 0,1 s na L4. O Spark é memória unificada disputada; a L4 é uma placa
            # com batching contínuo.
            #
            # Linha de base ANTES da troca, para a comparação não atravessar a fronteira do
            # rollout: ~1.000 fatos/hora, 100% com `statement`, estável por 8 h.
            - name: GRAPH_LLM_URL
              value: http://llamacpp-l4.beagle.svc.cluster.local:8000
            # O nome NÃO é cosmético: `applyExtraction` grava-o em
            # `provenance->'extracted_by'->>'model'` de cada fato. Chamar o backend novo de
            # `qwen2.5-14b-l4` faz a época da troca ficar legível no próprio dado, sem depender
            # de cruzar `recorded_at` com a data dos ReplicaSets — que é como eu já medi errado
            # três vezes, atravessando a fronteira de um rollout.
            - name: GRAPH_MODEL
              value: qwen2.5-14b-l4
            - name: BEAGLE_TEI_EMBED_URL
              value: http://beagle-sovereign-embeddings.beagle.svc.cluster.local:80/embed
            - name: GRAPH_BATCH
              value: "2"
            - name: GRAPH_LLM_TIMEOUT_MS
              value: "300000"
            # A faixa. Sem isto o worker pegaria TUDO, inclusive a fala do sujeito que
            # pertence ao modelo caro.
            - name: GRAPH_TIER
              value: bulk
          resources:
            requests: { cpu: "200m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
