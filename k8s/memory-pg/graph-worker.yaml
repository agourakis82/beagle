# Phase 4.3 going-forward graph trickle worker — r1-distill-70b over pending_graph
# (new memories enqueued by captureRecord when MEMORY_PG_GRAPH_ENABLED). Low volume,
# high quality. Separate tier from the qwen historical backfill.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-pg-graph-worker
  namespace: beagle
  labels: { app: memory-pg, component: graph-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: memory-pg, component: graph-worker }
  template:
    metadata:
      labels: { app: memory-pg, component: graph-worker }
    spec:
      # HISTÓRICO — não remova esta nota junto com o código que ela explica.
      # Em 02-ago-2026 pods no dl380 não alcançavam NADA: nem ClusterIP, nem o
      # próprio host, nem a rede externa. O HOST alcançava; o POD não. Um rollout
      # reagendou o memory-pg-serve para lá e o recall inteiro do companion parou,
      # sem nada indicar a causa.
      #
      # Causa raiz: /usr/lib/sysctl.d/pve-firewall.conf (vendor Proxmox) define
      # net.ipv4.conf.all.rp_filter=2 e, por ordem alfabética, é aplicado DEPOIS de
      # 99-cilium-*.conf (ASCII: "9" < "p"). O valor do vendor vencia e o reverse
      # path filtering matava o datapath do Cilium. Os outros nós já sombreavam o
      # arquivo do vendor com /etc/sysctl.d/pve-firewall.conf; o dl380 não.
      #
      # CONSERTADO no nó (sombreamento instalado, sobrevive a restart do
      # pve-firewall e a sysctl --system). A exclusão por nodeAffinity que existia
      # aqui foi REMOVIDA depois de o companion-health passar rodando no dl380.
      # Se um pod voltar a falhar em rede, verifique primeiro:
      #     sysctl -n net.ipv4.conf.all.rp_filter    # tem que ser 0
      tolerations:
        - { key: sounio.dev/compute, operator: Equal, value: heavy, effect: NoSchedule }
        - { key: sounio.dev/pool, operator: Equal, value: gpu-batch, effect: NoSchedule }
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      securityContext:
        seccompProfile: { type: Unconfined }
      containers:
        - name: graph-worker
          image: 192.168.3.207:5003/memory-pg-embed-worker:p2-ffbb9d6a
          command: ["node", "bin/graph-worker.mjs"]
          env:
            - name: MEMORY_PG_DSN
              valueFrom: { secretKeyRef: { name: memory-pg, key: DATABASE_URL } }
            - name: GRAPH_LLM_URL
              value: http://router.llm-router.svc.cluster.local:4000
            - name: GRAPH_MODEL
              value: r1-distill-70b
            - name: BEAGLE_TEI_EMBED_URL
              value: http://192.168.3.43:8080/embed
            - name: GRAPH_BATCH
              value: "2"
          resources:
            requests: { cpu: "200m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
