# Companion heartbeat — a sonda que faltava em 02-ago-2026.
#
# Naquele dia DUAS falhas rodaram em silêncio ao mesmo tempo, por dias:
#
#   1. O reranker-gpu estava escalado a 0, então /query devolvia 500 em TODA
#      chamada de recall. O chat trata "sem memórias" como caso normal — seguiu
#      respondendo, sem memória nenhuma.
#   2. O LiteLLM não conhecia nenhum modelo Claude, então a voz levava HTTP 400,
#      virava 503, e o CHÃO respondia com presença enlatada.
#
# Nenhum alarme disparou. O único sensor foi o usuário dizendo "o chat tá frio".
# Ambos os componentes pareciam saudáveis: pods Running, endpoints com IP, health
# checks verdes. A falha só era visível NA EXPERIÊNCIA.
#
# Por isso esta sonda não olha componente — ela faz o que o usuário faz, e falha
# o Job (visível em `kubectl -n beagle get jobs`) quando o companion perde a
# memória OU perde a voz.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: companion-health
  namespace: beagle
  labels:
    app: memory-pg
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      # Um companion mudo é alerta determinístico, não falha transitória de execução.
      # Não crie pods falhos redundantes até o deadline expirar.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          # HISTÓRICO — não remova esta nota junto com o código que ela explica.
          # Em 02-ago-2026 pods no dl380 não alcançavam NADA: nem ClusterIP, nem o
          # próprio host, nem a rede externa. O HOST alcançava; o POD não. Um rollout
          # reagendou o memory-pg-serve para lá e o recall inteiro do companion parou,
          # sem nada indicar a causa.
          #
          # Causa raiz: /usr/lib/sysctl.d/pve-firewall.conf (vendor Proxmox) define
          # net.ipv4.conf.all.rp_filter=2 e, por ordem alfabética, é aplicado DEPOIS de
          # 99-cilium-*.conf (ASCII: "9" < "p"). O valor do vendor vencia e o reverse
          # path filtering matava o datapath do Cilium. Os outros nós já sombreavam o
          # arquivo do vendor com /etc/sysctl.d/pve-firewall.conf; o dl380 não.
          #
          # CONSERTADO no nó (sombreamento instalado, sobrevive a restart do
          # pve-firewall e a sysctl --system). A exclusão por nodeAffinity que existia
          # aqui foi REMOVIDA depois de o companion-health passar rodando no dl380.
          # Se um pod voltar a falhar em rede, verifique primeiro:
          #     sysctl -n net.ipv4.conf.all.rp_filter    # tem que ser 0
          tolerations:
            - { effect: NoSchedule, key: sounio.dev/compute, operator: Equal, value: heavy }
            - { effect: NoSchedule, key: sounio.dev/pool, operator: Equal, value: gpu-batch }
          # RuntimeDefault, não Unconfined: com o ntfy em casa esta sonda não fala
          # mais com nada fora do cluster, então não há motivo medido para
          # afrouxar seccomp. Afrouxar "por doutrina", sem necessidade, é
          # regressão de segurança — apontado na revisão do commit anterior.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: companion-health
              image: 192.168.3.207:5003/memory-pg-embed-worker:p13-rerankbatch-e66f10fd
              env:
                - name: MEMORY_PG_QUERY_TOKEN
                  valueFrom:
                    secretKeyRef: { name: memory-pg, key: QUERY_TOKEN, optional: true }
                - name: OPERATOR_TOKEN
                  valueFrom:
                    secretKeyRef: { name: beagle-core-tokens, key: operator-token }
                # ntfy PRÓPRIO, no cluster. Antes era o ntfy.sh público, e o dedup
                # lia de um mural que qualquer um podia escrever: bastava saber o
                # topic para postar a marca e calar o alarme para sempre. Aqui
                # publicar exige credencial.
                - name: NTFY_URL
                  value: "http://ntfy.beagle.svc.cluster.local"
                - name: NTFY_TOPIC
                  valueFrom:
                    secretKeyRef: { name: ntfy-auth, key: topic, optional: true }
                - name: NTFY_USER
                  valueFrom:
                    secretKeyRef: { name: ntfy-auth, key: user, optional: true }
                - name: NTFY_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: ntfy-auth, key: password, optional: true }
              command: ["node", "-e"]
              args:
                - |
                  const QUERY = "http://memory-pg-serve.beagle.svc.cluster.local/query";
                  const CHAT  = "http://project-cockpit.beagle.svc.cluster.local/api/mobile/v1/chat";
                  const falhas = [];

                  async function checaMemoria() {
                    const tok = process.env.MEMORY_PG_QUERY_TOKEN || "";
                    const r = await fetch(QUERY, {
                      method: "POST",
                      headers: { "content-type": "application/json", ...(tok ? { authorization: "Bearer " + tok } : {}) },
                      body: JSON.stringify({ query: "o que me angustia", k: 8, trusted_only: false }),
                      signal: AbortSignal.timeout(60000),
                    });
                    if (!r.ok) return falhas.push(`MEMORIA MORTA: /query HTTP ${r.status} — o companion responde sem lembrar de nada`);
                    const j = await r.json();
                    const n = (j.results || []).length;
                    if (n === 0) return falhas.push("MEMORIA VAZIA: /query devolveu 0 átomos para uma pergunta que sempre teve resposta");
                    if (j.reranked === false) console.warn(`[aviso] recall degradado (reranker fora), ${n} átomos pela ordem de primeiro estágio`);
                    console.log(`memoria OK: ${n} átomos`);
                  }

                  async function checaVoz() {
                    const tok = process.env.OPERATOR_TOKEN;
                    const r = await fetch(CHAT, {
                      method: "POST",
                      headers: { "content-type": "application/json", "x-cockpit-token": tok, authorization: "Bearer " + tok },
                      body: JSON.stringify({ space: "personal", prompt: "Está me ouvindo?" }),
                      signal: AbortSignal.timeout(200000),
                    });
                    if (!r.ok) return falhas.push(`VOZ MORTA: chat HTTP ${r.status}`);
                    const d = (await r.json()).data || {};
                    // O CHÃO é o modo de falha silenciosa: HTTP 200, texto acolhedor,
                    // nenhum modelo por trás. É o que fez "está funcionando" parecer verdade.
                    if (d.model === "floor" || d.source === "floor" || d.degraded === true) {
                      return falhas.push(`VOZ NO CHAO: model=${d.model} degraded=${d.degraded} — presença enlatada, nenhum LLM respondendo`);
                    }
                    if (d.grounded === false) falhas.push("VOZ SEM GROUNDING: respondeu, mas sem a biografia dele");
                    console.log(`voz OK: model=${d.model} grounded=${d.grounded}`);
                  }

                  // O ALARME PRECISA ALCANÇAR ALGUÉM.
                  //
                  // Esta sonda falhava corretamente desde 02-ago e ninguém soube: um Job
                  // falho só é visível para quem já foi olhar `kubectl get jobs`. E o
                  // Alertmanager do cluster roda há 140 dias com o receptor chamado
                  // literalmente `null`. Alarme que grita no vazio não é alarme.
                  //
                  // Vai direto para o telefone dele, via ntfy.
                  const TOPIC = process.env.NTFY_TOPIC;
                  const NTFY  = process.env.NTFY_URL || "http://ntfy.beagle.svc.cluster.local";
                  const AUTH  = process.env.NTFY_USER
                    ? "Basic " + Buffer.from(`${process.env.NTFY_USER}:${process.env.NTFY_PASSWORD || ""}`).toString("base64")
                    : null;
                  const QUEBROU = "[companion-quebrou]";
                  const VOLTOU  = "[companion-voltou]";

                  // O canal É o estado. Sem dedup, uma queda de madrugada viraria 30
                  // notificações e ele aprenderia a ignorá-las — que é como um alarme
                  // morre de verdade. A janela de 6h faz o lembrete voltar se seguir
                  // quebrado, em vez de silenciar para sempre.
                  async function recentes() {
                    if (!TOPIC) return [];
                    try {
                      const r = await fetch(`${NTFY}/${TOPIC}/json?poll=1&since=6h`, {
                        headers: AUTH ? { Authorization: AUTH } : {},
                        signal: AbortSignal.timeout(15000),
                      });
                      return (await r.text()).trim().split("\n").filter(Boolean)
                        .map((l) => { try { return JSON.parse(l); } catch { return {}; } });
                    } catch (e) { console.error("[aviso] nao consegui ler o ntfy: " + e.message); return []; }
                  }

                  async function avisar(titulo, corpo, marca, prioridade, tag) {
                    if (!TOPIC) { console.error("[aviso] NTFY_TOPIC ausente — alarme sem destino"); return; }
                    try {
                      await fetch(`${NTFY}/${TOPIC}`, {
                        method: "POST",
                        headers: { Title: titulo, Priority: prioridade, Tags: tag, ...(AUTH ? { Authorization: AUTH } : {}) },
                        body: `${marca} ${corpo}`,
                        signal: AbortSignal.timeout(15000),
                      });
                    } catch (e) { console.error("[aviso] ntfy falhou: " + e.message); }
                  }

                  (async () => {
                    for (const [nome, fn] of [["memoria", checaMemoria], ["voz", checaVoz]]) {
                      try { await fn(); } catch (e) { falhas.push(`${nome.toUpperCase()}: ${e.message}`); }
                    }

                    const msgs = await recentes();
                    const ultima = (m) => msgs.filter((x) => (x.message || "").includes(m)).pop();
                    const q = ultima(QUEBROU), v = ultima(VOLTOU);
                    const jaAvisado = !!q && (!v || (q.time || 0) > (v.time || 0));

                    if (falhas.length) {
                      console.error("\n=== COMPANION DEGRADADO ===");
                      for (const f of falhas) console.error("  " + f);
                      console.error("\nEle continua respondendo — é justamente por isso que ninguém percebe.");
                      if (!jaAvisado) await avisar("Beagle degradado", falhas.join(" · "), QUEBROU, "high", "rotating_light");
                      process.exit(1);
                    }
                    if (jaAvisado) await avisar("Beagle voltou", "memória e voz respondendo", VOLTOU, "default", "white_check_mark");
                    console.log("companion inteiro: memoria + voz");
                    process.exit(0);
                  })();
