# memory-pg embed worker Deployment.
#
# Phase 1, Task 1.4. The SKIP-LOCKED outbox drainer: polls pending_embeddings,
# embeds chunks via the sovereign TEI bge-m3 service, upserts into embeddings,
# retries with a DLQ. Stateless, single replica (SKIP LOCKED makes it safe to
# scale, but one suffices at single-user scale). Bounded RAM is the no-OOM proof
# that replaces the legacy Python subprocess worker.
#
# Env:
#   MEMORY_PG_DSN         <- secret memory-pg / key DATABASE_URL (DSN; never hardcoded)
#   BEAGLE_TEI_EMBED_URL  -> sovereign bge-m3 embedder (matches beagle-memory-engine)
#
# Cluster conventions: tolerations for the tainted compute/gpu-batch nodes,
# seccompProfile Unconfined (default blocks socketpair -> asyncio/runtime crash).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-pg-embed-worker
  namespace: beagle
  labels:
    app: memory-pg
    component: embed-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-pg
      component: embed-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: memory-pg
        component: embed-worker
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      # HISTÓRICO — não remova esta nota junto com o código que ela explica.
      # Em 02-ago-2026 pods no dl380 não alcançavam NADA: nem ClusterIP, nem o
      # próprio host, nem a rede externa. O HOST alcançava; o POD não. Um rollout
      # reagendou o memory-pg-serve para lá e o recall inteiro do companion parou,
      # sem nada indicar a causa.
      #
      # Causa raiz: /usr/lib/sysctl.d/pve-firewall.conf (vendor Proxmox) define
      # net.ipv4.conf.all.rp_filter=2 e, por ordem alfabética, é aplicado DEPOIS de
      # 99-cilium-*.conf (ASCII: "9" < "p"). O valor do vendor vencia e o reverse
      # path filtering matava o datapath do Cilium. Os outros nós já sombreavam o
      # arquivo do vendor com /etc/sysctl.d/pve-firewall.conf; o dl380 não.
      #
      # CONSERTADO no nó (sombreamento instalado, sobrevive a restart do
      # pve-firewall e a sysctl --system). A exclusão por nodeAffinity que existia
      # aqui foi REMOVIDA depois de o companion-health passar rodando no dl380.
      # Se um pod voltar a falhar em rede, verifique primeiro:
      #     sysctl -n net.ipv4.conf.all.rp_filter    # tem que ser 0
      tolerations:
        - effect: NoSchedule
          key: sounio.dev/compute
          operator: Equal
          value: heavy
        - effect: NoSchedule
          key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: embed-worker
          image: 192.168.3.207:5003/memory-pg-embed-worker:v2
          imagePullPolicy: IfNotPresent
          env:
            # DSN from the out-of-band memory-pg secret (DATABASE_URL key).
            - name: MEMORY_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: memory-pg
                  key: DATABASE_URL
            # Sovereign bge-m3 embedder — same endpoint beagle-memory-engine uses.
            - name: BEAGLE_TEI_EMBED_URL
              value: http://192.168.3.43:8080/embed
          securityContext:
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # node:20-slim's `node` user is uid 1000; specify it numerically so
            # the kubelet can verify runAsNonRoot (a named user can't be checked).
            runAsUser: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
