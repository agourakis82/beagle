apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: sounio-leader-worker-example
  namespace: beagle
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  coordinator:
    replicatedJob: leader
    jobIndex: 0
    podIndex: 0
  replicatedJobs:
    - name: leader
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: leader
                  image: busybox:1.36
                  command:
                    - /bin/sh
                    - -lc
                    - |
                      echo "leader is up"
                      sleep 30
                  startupProbe:
                    exec:
                      command:
                        - /bin/sh
                        - -lc
                        - echo started
                    initialDelaySeconds: 3
    - name: workers
      dependsOn:
        - name: leader
          status: Ready
      template:
        spec:
          completionMode: Indexed
          parallelism: 2
          completions: 2
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command:
                    - /bin/sh
                    - -lc
                    - |
                      echo "worker rank ${JOB_COMPLETION_INDEX:-unknown} sees leader at ${COORDINATOR_ADDR:-unknown}"
                      sleep 10
                  env:
                    - name: JOB_COMPLETION_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    - name: COORDINATOR_ADDR
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['jobset.sigs.k8s.io/coordinator']
