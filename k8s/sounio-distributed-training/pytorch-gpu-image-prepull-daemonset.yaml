apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pytorch-gpu-image-prepull
  namespace: beagle
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pytorch-gpu-image-prepull
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pytorch-gpu-image-prepull
    spec:
      tolerations:
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: sounio.dev/pool
                    operator: In
                    values:
                      - gpu-batch
      containers:
        - name: prepull
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
            - sleep infinity
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
