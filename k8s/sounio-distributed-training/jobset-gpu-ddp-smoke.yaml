apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: sounio-gpu-ddp-smoke
  namespace: beagle
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: kubernetes.io/hostname
  labels:
    kueue.x-k8s.io/queue-name: hpc-training
spec:
  coordinator:
    replicatedJob: workers
    jobIndex: 0
    podIndex: 0
  network:
    enableDNSHostnames: true
    subdomain: sounio-gpu-ddp-smoke
    publishNotReadyAddresses: true
  replicatedJobs:
    - name: workers
      replicas: 2
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                sounio.dev/distributed-group: sounio-gpu-ddp-smoke
            spec:
              priorityClassName: hpc-training
              runtimeClassName: nvidia
              restartPolicy: Never
              securityContext:
                seccompProfile:
                  type: Unconfined
              tolerations:
                - key: sounio.dev/pool
                  operator: Equal
                  value: gpu-batch
                  effect: NoSchedule
                - key: sounio.dev/compute
                  operator: Equal
                  value: heavy
                  effect: NoSchedule
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: sounio.dev/accelerator-class
                            operator: In
                            values:
                              - gpu
                          - key: sounio.dev/compute
                            operator: In
                            values:
                              - heavy
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchExpressions:
                          - key: sounio.dev/distributed-group
                            operator: In
                            values:
                              - sounio-gpu-ddp-smoke
                      topologyKey: kubernetes.io/hostname
              containers:
                - name: ddp-smoke
                  image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    privileged: true
                  env:
                    - name: MASTER_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['jobset.sigs.k8s.io/coordinator']
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: JOBSET_SUBDOMAIN
                      value: sounio-gpu-ddp-smoke
                    - name: MASTER_PORT
                      value: "29500"
                    - name: NODE_RANK
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
                    - name: WORLD_SIZE
                      value: "2"
                    - name: NCCL_SOCKET_IFNAME
                      value: eth0
                    - name: NCCL_DEBUG
                      value: INFO
                    - name: TORCH_DISTRIBUTED_DEBUG
                      value: DETAIL
                    - name: LD_LIBRARY_PATH
                      value: /nvidia-host
                    - name: PYTHONUNBUFFERED
                      value: "1"
                  command:
                    - /bin/bash
                    - -lc
                    - |
                      python - <<'PY'
                      import ctypes
                      try:
                          ctypes.CDLL("libcuda.so.1")
                          print("libcuda_load ok", flush=True)
                      except Exception as exc:
                          print(f"libcuda_load_err {exc!r}", flush=True)
                      PY
                      python - <<'PY'
                      import os
                      import socket
                      import time
                      import torch
                      import torch.distributed as dist

                      master_host = os.environ["MASTER_HOST"]
                      namespace = os.environ["POD_NAMESPACE"]
                      subdomain = os.environ["JOBSET_SUBDOMAIN"]
                      port = os.environ["MASTER_PORT"]
                      rank = int(os.environ["NODE_RANK"])
                      world = int(os.environ["WORLD_SIZE"])
                      backend = "nccl" if torch.cuda.is_available() else "gloo"
                      device = "cuda" if torch.cuda.is_available() else "cpu"

                      def resolve_master(host: str, namespace: str, subdomain: str) -> tuple[str, str]:
                          candidates = []

                          def add(candidate: str) -> None:
                              if candidate and candidate not in candidates:
                                  candidates.append(candidate)

                          add(host)
                          if host.endswith(f".{subdomain}"):
                              add(f"{host}.{namespace}.svc")
                              add(f"{host}.{namespace}.svc.cluster.local")
                          elif "." not in host:
                              add(f"{host}.{subdomain}")
                              add(f"{host}.{subdomain}.{namespace}.svc")
                              add(f"{host}.{subdomain}.{namespace}.svc.cluster.local")
                              add(f"{host}.{namespace}.svc")
                              add(f"{host}.{namespace}.svc.cluster.local")

                          deadline = time.time() + 60
                          last_error = None
                          while time.time() < deadline:
                              for candidate in candidates:
                                  try:
                                      infos = socket.getaddrinfo(
                                          candidate,
                                          int(port),
                                          family=socket.AF_INET,
                                          type=socket.SOCK_STREAM,
                                      )
                                      return candidate, infos[0][4][0]
                                  except OSError as exc:
                                      last_error = exc
                              time.sleep(1)

                          raise RuntimeError(
                              f"unable to resolve coordinator from host={host!r} candidates={candidates!r}"
                          ) from last_error

                      master_name, master_ip = resolve_master(master_host, namespace, subdomain)

                      if torch.cuda.is_available():
                          torch.cuda.set_device(0)

                      print(
                          f"hostname={socket.gethostname()} "
                          f"rank={rank}/{world} "
                          f"master={master_name}:{port} "
                          f"master_ip={master_ip} "
                          f"backend={backend} "
                          f"cuda={torch.cuda.is_available()} "
                          f"gpus={torch.cuda.device_count()}",
                          flush=True,
                      )

                      init_kwargs = {
                          "backend": backend,
                          "init_method": f"tcp://{master_ip}:{port}",
                          "rank": rank,
                          "world_size": world,
                      }
                      if backend == "nccl":
                          init_kwargs["device_id"] = torch.device("cuda", 0)

                      dist.init_process_group(**init_kwargs)

                      try:
                          tensor = torch.tensor([rank + 1], device=device)
                          dist.all_reduce(tensor, op=dist.ReduceOp.SUM)
                          print(
                              f"hostname={socket.gethostname()} "
                              f"rank={rank} "
                              f"allreduce={tensor.item()}",
                              flush=True,
                          )

                          barrier_kwargs = {}
                          if backend == "nccl":
                              barrier_kwargs["device_ids"] = [0]
                          dist.barrier(**barrier_kwargs)
                      finally:
                          if dist.is_initialized():
                              dist.destroy_process_group()
                      PY
                  resources:
                    limits:
                      cpu: "4"
                      memory: 12Gi
                      nvidia.com/gpu: "1"
                  volumeMounts:
                    - name: host-libcuda
                      mountPath: /nvidia-host/libcuda.so.1
                      readOnly: true
                    - name: host-libnvidia-ml
                      mountPath: /nvidia-host/libnvidia-ml.so.1
                      readOnly: true
              volumes:
                - name: host-libcuda
                  hostPath:
                    path: /lib/x86_64-linux-gnu/libcuda.so.1
                    type: File
                - name: host-libnvidia-ml
                  hostPath:
                    path: /lib/x86_64-linux-gnu/libnvidia-ml.so.1
                    type: File
