# project-cockpit Deployment — reconciled from the live cluster state
# (kubectl get deploy project-cockpit -n beagle), pinned to the durable image.
# This is the authoritative IaC source: live == repo.
# Notes:
#  - imagePullPolicy IfNotPresent: in-cluster registry (192.168.3.207:5003) is
#    plain-HTTP. Nodes honor it via /etc/containerd/certs.d once config_path is
#    set under the containerd v2 key io.containerd.cri.v1.images.registry.
#  - project-catalog.json ships baked into the image (single source of truth);
#    the old catalog-override ConfigMap was retired.
#  - project-cockpit-remembered ConfigMap holds runtime state (not in git;
#    volume is optional).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: project-cockpit
    app.kubernetes.io/part-of: beagle
  name: project-cockpit
  namespace: beagle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-cockpit
  strategy:
    # Recreate, not RollingUpdate: the pod mounts a RWO PVC (/var/lib/cockpit).
    # RollingUpdate's surge starts the new pod before the old releases the volume;
    # if it lands on another node → Multi-Attach deadlock. Recreate deletes the old
    # pod first (releasing the PVC), then starts the new one. ~30-60s downtime, 1 replica.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-cockpit
        app.kubernetes.io/part-of: beagle
    spec:
      # Home = t560 (infra-control). It has by far the most disk (286G vs r770's chronically-full
      # 94G), and the cockpit is a light Node proxy (no GPU, proxy-level I/O — unrelated to the
      # souc builds that once starved etcd; the etcd-ioprio/souc-cap protections cover that). Hard
      # role pin (not soft affinity) so the RWO PVC always reattaches on the same node — no
      # Multi-Attach migration. Control-plane toleration + Unconfined (Core Location / kubectl /
      # node-pty spawns need it) mirror the proven live config.
      nodeSelector:
        sounio.dev/runtime-role: infra-control
      tolerations:
      - key: sounio.dev/compute
        operator: Equal
        value: heavy
        effect: NoSchedule
      - key: sounio.dev/pool
        operator: Equal
        value: gpu-batch
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      containers:
      - env:
        - name: PROJECT_COCKPIT_PORT
          value: '4370'
        - name: PROJECT_COCKPIT_ROOT
          value: /app
        - name: PROJECT_COCKPIT_KEEP_ALIVE_TIMEOUT_MS
          value: '610000'
        - name: PROJECT_COCKPIT_FAST_MEMORY_CACHE_TTL_MS
          value: '15000'
        - name: PROJECT_COCKPIT_MEMORY_WARM_INTERVAL_MS
          value: '15000'
        - name: PROJECT_COCKPIT_DISABLE_MEMORY_WARMERS
          value: 'true'
        - name: PROJECT_COCKPIT_REMEMBERED_STATE_CONFIGMAP
          value: project-cockpit-remembered
        - name: PROJECT_COCKPIT_REMEMBERED_STATE_DIR
          value: /var/run/project-cockpit-remembered
        - name: BEAGLE_DATA_DIR
          value: /var/lib/cockpit
        - name: WORKBENCH_CONTEXT_DATA_DIR
          value: /var/lib/cockpit
        - name: WORKBENCH_CONTEXT_HTTP_MCP_REQUIRE_AUTH
          value: 'true'
        - name: WORKBENCH_CONTEXT_WRITE_REQUIRE_AUTH
          value: 'true'
        - name: PROJECT_COCKPIT_SGLANG_ENDPOINT
          value: http://sglang-serving.beagle.svc.cluster.local:30000
        - name: PROJECT_COCKPIT_DYNAMO_ENDPOINT
          value: http://dynamo-control-plane.beagle.svc.cluster.local:8000
        - name: PROJECT_COCKPIT_PROMETHEUS_URL
          value: http://darwin-observability-prometheus.darwin-platform.svc.cluster.local:9090
        - name: PROJECT_COCKPIT_SOUNIO_FOUNDRY_ARTIFACT_ROOT
          value: /orangefs/training/sounio-foundry/runs
        - name: PROJECT_COCKPIT_AGENT_IMAGE
          value: 192.168.3.207:5003/beagle-agent:claude-codex-model-registry-20260523T2301Z
        - name: PROJECT_COCKPIT_KUBECTL
          value: /usr/local/bin/kubectl
        - name: GPU_LEASE_HOST_PROCESS_CHECK
          value: '0'
        - name: PROJECT_COCKPIT_WORKBENCH_AUTHORITY
          value: workspace-agent
        - name: PROJECT_COCKPIT_WORKSPACE_AGENT_TIMEOUT_MS
          value: '12000'
        # Companion (Pessoal) voice: fast, warm, non-reasoning model that streams
        # real content (qwen2.5-14b, warm on DGX Spark). glm-air-companion was a
        # reasoning model → empty stream (503) + 26s latency that broke the cadence.
        # 2026-07-03: companion voice = Claude Opus 4.8 (LiteLLM router → t560:9500 claude proxy
        # → real CLI, $0 on Max). Persona rewritten for his register (elevated peer, not the
        # beagle-dog folksy voice); qwen read flat. Overridable via kubectl set env if needed.
        - name: PROJECT_COCKPIT_PERSONAL_VOICE_MODEL
          value: claude-opus-4-8
        - name: PROJECT_COCKPIT_PERSONAL_MUSE_MODEL
          value: qwen2.5-14b
        # Muse creative pre-pass OFF: it added a full non-streaming call before the
        # voice could stream. Set to 'on' to restore the seed pass.
        - name: PROJECT_COCKPIT_PERSONAL_MUSE
          value: 'off'
        # 2026-07-13: deep-think agentic path (proxyDeepThinkAgentic) → claude proxy on t560:9500.
        # Code default was a TAILSCALE IP (100.103.228.8) that can change on re-auth → silent
        # "fetch failed" 503s. Pinned to the t560 FABRIC node IP (static) for robustness. Set via
        # kubectl set env on 2026-07-13; captured here so an apply keeps it (durable truth).
        - name: PROJECT_COCKPIT_AGENTIC_PROXY_URL
          value: http://10.100.100.2:9500
        # Reconciled from live 2026-07-03 (these were set via kubectl and ABSENT from IaC — an
        # apply would have dropped them). DISCUSSION_LAB/SGLANG point at the sglang glm-5.1
        # backend (currently down — separate cleanup); captured so the manifest is durable truth.
        - name: PROJECT_COCKPIT_LITELLM_ROUTER_URL
          value: http://router.llm-router.svc.cluster.local:4000
        - name: PROJECT_COCKPIT_DYNAMO_MODEL
          value: kimi-k2.7
        - name: PROJECT_COCKPIT_SGLANG_MODEL
          value: glm-5.1
        - name: PROJECT_COCKPIT_DISCUSSION_LAB_MODEL
          value: glm-5.1
        - name: TELEGRAM_VOICE_MODEL
          value: hermes-4
        # Discussão/ensemble fan-out (consult_ensemble + /api/mobile/v1/ensemble).
        # FAST RELIABLE trio, each FINGERPRINT-VERIFIED as the real model (2026-07-03) — NOT
        # a router fallback. Lesson: hermes-4/hunyuan-7b silently fell back to MiniMax-M3
        # (their vLLM pods were gone) → the "resident trio" was really baichuan+2×MiniMax.
        #   baichuan-m2-med  → local vLLM r740 RTX8000 (medical, ~1s)
        #   internlm2.5-7b   → local vLLM r740 (general, ~0.6s)
        #   minimax-m3       → strong general (cloud, real, fast) — the reliable 3rd voice
        # Whole fan-out ~50-60s. Phi-4-reasoning (real, Q4, DGX Spark .24) is DEPLOYED but
        # kept OUT of the always-on set (decision B, 2026-07-03): it is ~9.9 tok/s on the
        # SHARED Spark and drops under contention. It stays an OPT-IN heavy model — the agent
        # calls consult_ensemble with models:["phi4-reasoning"] when the depth is worth ~2-3min.
        # PENDING: dedicate the 2nd Spark (.43) to Phi-4 (decision A, deferred) → then re-add.
        # All three tunable without rebuild via the envs below.
        - name: PROJECT_COCKPIT_ENSEMBLE_MODELS
          value: baichuan-m2-med,internlm2.5-7b,minimax-m3
        - name: PROJECT_COCKPIT_ENSEMBLE_TIMEOUT_MS
          value: '60000'
        - name: PROJECT_COCKPIT_ENSEMBLE_MAX_TOKENS
          value: '900'
        image: 192.168.3.207:5003/project-cockpit:reconcile-a1429496
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -lc
            - curl -fsS http://127.0.0.1:4370/livez >/dev/null
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        name: app
        ports:
        - containerPort: 4370
          name: http
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -lc
            - curl -fsS http://127.0.0.1:4370/healthz >/dev/null
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 4Gi
          requests:
            cpu: 150m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          appArmorProfile:
            type: Unconfined
          runAsGroup: 0
          runAsUser: 0
          seccompProfile:
            type: Unconfined
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/run/project-cockpit-remembered
          name: remembered-state
          readOnly: true
        - mountPath: /var/lib/cockpit
          name: cockpit-data
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: r770-proxmox
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: project-cockpit
      serviceAccountName: project-cockpit
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: sounio.dev/compute
        operator: Equal
        value: heavy
      - effect: NoSchedule
        key: sounio.dev/pool
        operator: Equal
        value: gpu-batch
      volumes:
      - configMap:
          defaultMode: 420
          name: project-cockpit-remembered
        name: remembered-state
      - name: cockpit-data
        persistentVolumeClaim:
          claimName: project-cockpit-data
