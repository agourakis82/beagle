# project-cockpit — o servidor do companion.
#
# REGENERADO do estado VIVO em 06-ago-2026, e o motivo importa: o arquivo
# anterior tinha `nodeSelector`, `tolerations` e `securityContext` DUPLICADOS no
# mesmo nível (alguém colou um dump do cluster por cima do manifesto). Em YAML a
# última ocorrência vence, então todo o bloco de cima — com os comentários de
# intenção — era decorativo. Aplicar este arquivo derrubou o cockpit:
# o pod ficou Pending porque herdou o pin de hostname r770-proxmox e perdeu a
# tolerância de control-plane.
#
# Hoje só o t560 carrega o rótulo runtime-role=infra-control, e o t560 é
# control-plane. Por isso: nodeSelector pelo RÓTULO (não pelo hostname),
# preferência suave pelo r770, e a tolerância de control-plane é OBRIGATÓRIA.
#
# Antes de editar: confira que nenhuma chave aparece duas vezes.
#   python3 -c "import yaml,sys; yaml.safe_load(open('deployment.yaml'))"
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: project-cockpit
    app.kubernetes.io/part-of: beagle
  name: project-cockpit
  namespace: beagle
  annotations:
    kubernetes.io/change-cause: regenerado do estado vivo em 06-ago-2026
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: project-cockpit
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-06T05:43:13-03:00'
      labels:
        app.kubernetes.io/name: project-cockpit
        app.kubernetes.io/part-of: beagle
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r770-proxmox
            weight: 100
      containers:
      - env:
        - name: BEAGLE_MEMORY_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: operator-token
              name: beagle-core-tokens
        - name: PROJECT_COCKPIT_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: PROJECT_COCKPIT_AUTH_TOKEN
              name: cockpit-mobile-auth
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: XAI_API_KEY
              name: beagle-core-secrets
              optional: true
        - name: PROJECT_COCKPIT_INTERNAL_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: operator-token
              name: beagle-core-tokens
        - name: PROJECT_COCKPIT_PORT
          value: '4370'
        - name: PROJECT_COCKPIT_ROOT
          value: /app
        - name: PROJECT_COCKPIT_KEEP_ALIVE_TIMEOUT_MS
          value: '610000'
        - name: PROJECT_COCKPIT_FAST_MEMORY_CACHE_TTL_MS
          value: '15000'
        - name: PROJECT_COCKPIT_MEMORY_WARM_INTERVAL_MS
          value: '15000'
        - name: PROJECT_COCKPIT_DISABLE_MEMORY_WARMERS
          value: 'true'
        - name: PROJECT_COCKPIT_REMEMBERED_STATE_CONFIGMAP
          value: project-cockpit-remembered
        - name: PROJECT_COCKPIT_REMEMBERED_STATE_DIR
          value: /var/run/project-cockpit-remembered
        - name: BEAGLE_DATA_DIR
          value: /var/lib/cockpit
        - name: WORKBENCH_CONTEXT_DATA_DIR
          value: /var/lib/cockpit
        - name: WORKBENCH_CONTEXT_HTTP_MCP_REQUIRE_AUTH
          value: 'true'
        - name: WORKBENCH_CONTEXT_WRITE_REQUIRE_AUTH
          value: 'true'
        - name: PROJECT_COCKPIT_SGLANG_ENDPOINT
          value: http://sglang-serving.beagle.svc.cluster.local:30000
        - name: PROJECT_COCKPIT_DYNAMO_ENDPOINT
          value: http://dynamo-control-plane.beagle.svc.cluster.local:8000
        - name: PROJECT_COCKPIT_PROMETHEUS_URL
          value: http://darwin-observability-prometheus.darwin-platform.svc.cluster.local:9090
        - name: PROJECT_COCKPIT_SOUNIO_FOUNDRY_ARTIFACT_ROOT
          value: /orangefs/training/sounio-foundry/runs
        - name: PROJECT_COCKPIT_AGENT_IMAGE
          value: 192.168.3.207:5003/beagle-agent:claude-codex-model-registry-20260523T2301Z
        - name: PROJECT_COCKPIT_KUBECTL
          value: /usr/local/bin/kubectl
        - name: GPU_LEASE_HOST_PROCESS_CHECK
          value: '0'
        - name: PROJECT_COCKPIT_WORKBENCH_AUTHORITY
          value: workspace-agent
        - name: PROJECT_COCKPIT_WORKSPACE_AGENT_TIMEOUT_MS
          value: '12000'
        - name: PROJECT_COCKPIT_PERSONAL_VOICE_MODEL
          value: claude-opus-5
        - name: PROJECT_COCKPIT_PERSONAL_MUSE_MODEL
          value: qwen2.5-14b
        - name: PROJECT_COCKPIT_PERSONAL_MUSE
          value: 'off'
        - name: PROJECT_COCKPIT_AGENTIC_PROXY_URL
          value: http://10.100.100.2:9500
        - name: PROJECT_COCKPIT_LITELLM_ROUTER_URL
          value: http://router.llm-router.svc.cluster.local:4000
        - name: PROJECT_COCKPIT_DYNAMO_MODEL
          value: kimi-k2.7
        - name: PROJECT_COCKPIT_SGLANG_MODEL
          value: glm-5.1
        - name: PROJECT_COCKPIT_DISCUSSION_LAB_MODEL
          value: glm-5.1
        - name: TELEGRAM_VOICE_MODEL
          value: hermes-4
        - name: PROJECT_COCKPIT_ENSEMBLE_MODELS
          value: baichuan-m2-med,internlm2.5-7b,minimax-m3
        - name: PROJECT_COCKPIT_ENSEMBLE_TIMEOUT_MS
          value: '60000'
        - name: PROJECT_COCKPIT_ENSEMBLE_MAX_TOKENS
          value: '900'
        envFrom:
        - secretRef:
            name: beagle-core-secrets
            optional: true
        - secretRef:
            name: beagle-telegram-secrets
            optional: true
        image: 192.168.3.207:5003/project-cockpit:l2tune-503cbb6f
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -lc
            - curl -fsS http://127.0.0.1:4370/livez >/dev/null
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        name: app
        ports:
        - containerPort: 4370
          name: http
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -lc
            - curl -fsS http://127.0.0.1:4370/healthz >/dev/null
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 4Gi
          requests:
            cpu: 150m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          appArmorProfile:
            type: Unconfined
          runAsGroup: 0
          runAsUser: 0
          seccompProfile:
            type: Unconfined
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/run/project-cockpit-remembered
          name: remembered-state
          readOnly: true
        - mountPath: /var/lib/cockpit
          name: cockpit-data
      dnsPolicy: ClusterFirst
      nodeSelector:
        sounio.dev/runtime-role: infra-control
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        appArmorProfile:
          type: Unconfined
        seccompProfile:
          type: Unconfined
      serviceAccount: project-cockpit
      serviceAccountName: project-cockpit
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: sounio.dev/compute
        operator: Equal
        value: heavy
      - effect: NoSchedule
        key: sounio.dev/pool
        operator: Equal
        value: gpu-batch
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - configMap:
          defaultMode: 420
          name: project-cockpit-remembered
        name: remembered-state
      - name: cockpit-data
        persistentVolumeClaim:
          claimName: project-cockpit-data
