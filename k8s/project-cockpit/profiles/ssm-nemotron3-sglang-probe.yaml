apiVersion: v1
kind: Service
metadata:
  name: ssm-nemotron3-sglang-probe
  namespace: beagle
  labels:
    app.kubernetes.io/name: ssm-nemotron3-sglang-probe
    app.kubernetes.io/part-of: beagle
    sounio.dev/lane: ssm-probe
    sounio.dev/probe-runtime: sglang
spec:
  selector:
    app.kubernetes.io/name: ssm-nemotron3-sglang-probe
  ports:
    - name: http
      port: 8006
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssm-nemotron3-sglang-probe
  namespace: beagle
  labels:
    app.kubernetes.io/name: ssm-nemotron3-sglang-probe
    app.kubernetes.io/part-of: beagle
    sounio.dev/lane: ssm-probe
    sounio.dev/probe-runtime: sglang
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ssm-nemotron3-sglang-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssm-nemotron3-sglang-probe
        app.kubernetes.io/part-of: beagle
        sounio.dev/lane: ssm-probe
        sounio.dev/probe-runtime: sglang
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: 5860-proxmox
        sounio.dev/accelerator-class: gpu
        sounio.dev/gpu-owner: ssm-probe
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
      containers:
        - name: sglang
          image: 192.168.3.207:5003/sounio-sglang-dynamo-runtime:dynamo-1.0.1-sglang-bnb-nodeps-20260522T185445Z
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - sglang.launch_server
          args:
            - --model-path
            - nvidia/NVIDIA-Nemotron-3-Nano-4B-FP8
            - --served-model-name
            - nemotron3-nano-4b-fp8-sglang
            - --host
            - 0.0.0.0
            - --port
            - "30000"
            - --trust-remote-code
            - --dtype
            - bfloat16
            - --context-length
            - "4096"
            - --max-total-tokens
            - "4096"
            - --mem-fraction-static
            - "0.55"
            - --disable-cuda-graph
            - --log-level
            - info
          securityContext:
            privileged: true
            seccompProfile:
              type: Unconfined
          env:
            - name: HF_HOME
              value: /var/cache/huggingface
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LD_LIBRARY_PATH
              value: /nvidia-host
          ports:
            - name: http
              containerPort: 30000
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 160
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 28Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /var/cache/huggingface
            - name: dshm
              mountPath: /dev/shm
            - name: host-libcuda
              mountPath: /nvidia-host/libcuda.so.1
              readOnly: true
            - name: host-libnvidia-ml
              mountPath: /nvidia-host/libnvidia-ml.so.1
              readOnly: true
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: host-libcuda
          hostPath:
            path: /lib/x86_64-linux-gnu/libcuda.so.1
            type: File
        - name: host-libnvidia-ml
          hostPath:
            path: /lib/x86_64-linux-gnu/libnvidia-ml.so.1
            type: File
