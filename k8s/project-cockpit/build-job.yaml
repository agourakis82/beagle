apiVersion: batch/v1
kind: Job
metadata:
  name: project-cockpit-build-instante
  namespace: beagle
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        # 20-ago-2026: era `sounio.dev/runtime-role: infra-control`, que resolve para o t560 —
        # o SPOF do cluster, que saturou por memoria em 18-ago (169/188 GB, swap 0, load 60).
        # Build de Next.js (npm install + build) ali e exatamente a carga que o derruba.
        #
        # r740: 80 CPUs a 41%, 133 GB livres no filesystem de imagens. NAO usar o r770 (19 GB).
        kubernetes.io/hostname: r740-proxmox
      securityContext:
        seccompProfile:
          type: Unconfined
        # node-pty's native build spawns sh/node-gyp; the node's default AppArmor profile
        # blocks that exec (EPERM "rejected by your operating system") even with seccomp
        # Unconfined. Disable AppArmor for the build too.
        appArmorProfile:
          type: Unconfined
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
        # t560 (control-plane) is the only node not thread/process-saturated and with
        # disk; native build (node-pty/node-gyp) needs the headroom. Monitored build.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      restartPolicy: Never
      initContainers:
        - name: clone
          image: alpine/git:latest
          env:
            - name: BEAGLE_GIT_BRANCH
              value: integration/instante-do-estado
            - name: BEAGLE_GIT_REF
              value: "64340e24"
          command:
            - /bin/sh
            - -lc
            - git clone --depth=50 --branch="${BEAGLE_GIT_BRANCH:-main}" https://github.com/agourakis82/beagle.git /workspace && cd /workspace && git checkout "${BEAGLE_GIT_REF:-main}"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          env:
            - name: BEAGLE_IMAGE_TAG
              value: instante-64340e24
          args:
            - "--dockerfile=/workspace/apps/project-cockpit/Dockerfile"
            - "--context=dir:///workspace"
            - "--destination=192.168.3.207:5003/project-cockpit:$(BEAGLE_IMAGE_TAG)"
            - "--insecure-registry=192.168.3.207:5003"
            - "--cache=false"
            - "--snapshot-mode=redo"
            - "--verbosity=info"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
