apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-serving
  namespace: beagle
  labels:
    app.kubernetes.io/name: sglang-serving
    app.kubernetes.io/part-of: beagle
    sounio.dev/state: scaffold
spec:
  replicas: 0
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sglang-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sglang-serving
        app.kubernetes.io/part-of: beagle
        sounio.dev/state: scaffold
    spec:
      serviceAccountName: project-cockpit
      hostNetwork: true
      dnsPolicy: Default
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: r740-proxmox
        sounio.dev/inference-fabric: "true"
        sounio.dev/pool: gpu-batch
        sounio.dev/accelerator-class: gpu
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
      containers:
        - name: sglang
          image: 192.168.3.207:5003/sounio-sglang-dynamo-runtime:dynamo-1.0.1-sglang-lite-20260522T152939Z
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            seccompProfile:
              type: Unconfined
          env:
            - name: DYNAMO_ROLE
              value: worker
            - name: DYNAMO_NAMESPACE
              value: beagle
            - name: DYNAMO_DISCOVERY_BACKEND
              value: kubernetes
            - name: MODEL_PATH
              value: Qwen/Qwen2.5-0.5B-Instruct
            - name: SERVED_MODEL_NAME
              value: qwen2.5-0.5B-Instruct
            - name: SGLANG_HOST
              value: 0.0.0.0
            - name: SGLANG_PORT
              value: "30000"
            - name: SGLANG_MEM_FRACTION_STATIC
              value: "0.18"
            - name: SGLANG_MAX_TOTAL_TOKENS
              value: "8192"
            - name: SGLANG_ATTENTION_BACKEND
              value: "triton"
            - name: SGLANG_DISABLE_CUDA_GRAPH
              value: "1"
            - name: HF_HOME
              value: /var/cache/huggingface
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LD_LIBRARY_PATH
              value: /nvidia-host
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 30000
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import json, os, ssl, sys, urllib.request
                  pod = os.environ["POD_NAME"]
                  ns = os.environ["POD_NAMESPACE"]
                  host = os.environ["KUBERNETES_SERVICE_HOST"]
                  port = os.environ["KUBERNETES_SERVICE_PORT"]
                  token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
                  ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  url = f"https://{host}:{port}/apis/nvidia.com/v1alpha1/namespaces/{ns}/dynamoworkermetadatas/{pod}"
                  req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
                  ctx = ssl.create_default_context(cafile=ca)
                  data = json.load(urllib.request.urlopen(req, context=ctx, timeout=5))
                  cards = ((data.get("spec") or {}).get("data") or {}).get("model_cards") or {}
                  sys.exit(0 if cards else 1)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import json, os, ssl, sys, urllib.request
                  pod = os.environ["POD_NAME"]
                  ns = os.environ["POD_NAMESPACE"]
                  host = os.environ["KUBERNETES_SERVICE_HOST"]
                  port = os.environ["KUBERNETES_SERVICE_PORT"]
                  token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
                  ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  url = f"https://{host}:{port}/apis/nvidia.com/v1alpha1/namespaces/{ns}/dynamoworkermetadatas/{pod}"
                  req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
                  ctx = ssl.create_default_context(cafile=ca)
                  data = json.load(urllib.request.urlopen(req, context=ctx, timeout=5))
                  cards = ((data.get("spec") or {}).get("data") or {}).get("model_cards") or {}
                  sys.exit(0 if cards else 1)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import pathlib, sys
                  cmdline = pathlib.Path("/proc/1/cmdline").read_text(errors="ignore").replace("\x00", " ")
                  sys.exit(0 if "dynamo.sglang" in cmdline else 1)
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /var/cache/huggingface
            - name: host-libcuda
              mountPath: /nvidia-host/libcuda.so.1
              readOnly: true
            - name: host-libnvidia-ml
              mountPath: /nvidia-host/libnvidia-ml.so.1
              readOnly: true
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: host-libcuda
          hostPath:
            path: /lib/x86_64-linux-gnu/libcuda.so.1
            type: File
        - name: host-libnvidia-ml
          hostPath:
            path: /lib/x86_64-linux-gnu/libnvidia-ml.so.1
            type: File
