        const res = await fetch(`${BEAGLE_INTERNAL_URL}${path}`, {
          method,
          headers: {
            Accept: "application/json",
            "content-type": "application/json",
            "X-Beagle-Consumer": "beagle-operator",
            Authorization: `Bearer ${tokenResult.token}`
