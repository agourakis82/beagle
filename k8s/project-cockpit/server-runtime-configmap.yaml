        withEnvelope(async () => {
          const generatedAt = new Date().toISOString();
          return {
            data: {
              status: "ok",
              service: "project-cockpit-mobile",
              version: "v1",
              generatedAt
            },
            meta: buildMeta(generatedAt)
          };
        })
      );

      app.get(
        "/api/mobile/v1/summary",
