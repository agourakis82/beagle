apiVersion: v1
data:
  agent-routes.mjs: |
    // Agent routes — persistent agent pod lifecycle + WebSocket PTY bridge.
    //
    // Endpoints:
    //   GET  /api/projects/:slug/agent/sessions            — list active agent sessions
    //   POST /api/projects/:slug/agent/session/start       — spawn agent pod for kind
    //   POST /api/projects/:slug/agent/session/:kind/pause — scale StatefulSet to 0
    //   POST /api/projects/:slug/agent/session/:kind/stop  — delete StatefulSet + PVC
    //   GET  /api/projects/:slug/agent/session/:kind       — session detail
    //   WS   /ws/projects/:slug/agent/:kind                — stream tmux via kubectl exec
    //
    // Supported kinds: claude-code, codex, local-sglang, custom
    //
    // This module is imported by server/index.mjs. It reuses existing helpers:
    //   - runKubectlJson(args) for pod status
    //   - runKubectlPty(args) for interactive WebSocket bridging
    //
    // ENV:
    //   AGENT_IMAGE    — the default agent container image (default: beagle-agent:latest)
    //   AGENT_NAMESPACE — K8s namespace (default: beagle)

    import { spawn } from "node:child_process";
    import { readFile } from "node:fs/promises";
    import path from "node:path";

    const AGENT_NAMESPACE = process.env.PROJECT_COCKPIT_AGENT_NAMESPACE || "beagle";
    const AGENT_IMAGE = process.env.PROJECT_COCKPIT_AGENT_IMAGE || "beagle-agent:latest";
    const AGENT_KINDS = ["claude-code", "codex", "local-sglang", "custom"];
    const MANIFEST_DIR = process.env.PROJECT_COCKPIT_AGENT_MANIFEST_DIR
      || "/home/devsounio/beagle/k8s/agent-pods";

    const KUBECTL = process.env.PROJECT_COCKPIT_KUBECTL || "/usr/local/bin/kubectl";

    function normKind(kind) {
      if (!AGENT_KINDS.includes(kind)) {
        const err = new Error(`unknown agent kind: ${kind}`);
        err.statusCode = 400;
        throw err;
      }
      return kind;
    }

    function resourceName(slug, kind) {
      return `agent-${slug}-${kind}`;
    }

    async function runKubectl(args, { input, timeoutMs = 15000 } = {}) {
      return new Promise((resolve, reject) => {
        const child = spawn(KUBECTL, args, { stdio: ["pipe", "pipe", "pipe"] });
        let stdout = "";
        let stderr = "";
        const timer = setTimeout(() => {
          child.kill("SIGKILL");
          reject(new Error(`kubectl timeout: ${args.join(" ")}`));
        }, timeoutMs);
        child.stdout.on("data", (d) => { stdout += d.toString(); });
        child.stderr.on("data", (d) => { stderr += d.toString(); });
        child.on("close", (code) => {
          clearTimeout(timer);
          if (code !== 0) {
            reject(new Error(`kubectl exit ${code}: ${stderr || stdout}`));
          } else {
            resolve(stdout);
          }
        });
        child.on("error", (e) => { clearTimeout(timer); reject(e); });
        if (input !== undefined) {
          child.stdin.write(input);
          child.stdin.end();
        }
      });
    }

    async function renderManifest(templatePath, substitutions) {
      let content = await readFile(templatePath, "utf8");
      for (const [key, value] of Object.entries(substitutions)) {
        content = content.replaceAll(`\${${key}}`, value);
      }
      return content;
    }

    // ─── Lifecycle operations ───────────────────────────────────────────

    export async function listAgentSessions(slug) {
      const labelSelector = `app=beagle-agent,project=${slug}`;
      const raw = await runKubectl([
        "-n", AGENT_NAMESPACE,
        "get", "statefulsets",
        "-l", labelSelector,
        "-o", "json"
      ]);
      const parsed = JSON.parse(raw);
      return parsed.items.map((item) => ({
        kind: item.metadata.labels["agent-kind"],
        name: item.metadata.name,
        replicas: item.spec.replicas,
        readyReplicas: item.status.readyReplicas ?? 0,
        createdAt: item.metadata.creationTimestamp,
        status: (item.status.readyReplicas ?? 0) > 0 ? "running"
              : item.spec.replicas === 0 ? "paused"
              : "pending"
      }));
    }

    export async function getAgentSession(slug, kind) {
      normKind(kind);
      const name = resourceName(slug, kind);
      try {
        const raw = await runKubectl([
          "-n", AGENT_NAMESPACE,
          "get", "statefulset", name,
          "-o", "json"
        ]);
        const ss = JSON.parse(raw);
        const podsRaw = await runKubectl([
          "-n", AGENT_NAMESPACE,
          "get", "pods",
          "-l", `app=beagle-agent,project=${slug},agent-kind=${kind}`,
          "-o", "json"
        ]);
        const pods = JSON.parse(podsRaw).items || [];
        return {
          kind,
          name,
          replicas: ss.spec.replicas,
          readyReplicas: ss.status.readyReplicas ?? 0,
          createdAt: ss.metadata.creationTimestamp,
          pods: pods.map(p => ({
            name: p.metadata.name,
            phase: p.status.phase,
            ready: p.status.containerStatuses?.every(c => c.ready) ?? false,
            node: p.spec.nodeName
          })),
          status: (ss.status.readyReplicas ?? 0) > 0 ? "running"
                : ss.spec.replicas === 0 ? "paused"
                : "pending"
        };
      } catch (e) {
        if (e.message.includes("NotFound") || e.message.includes("not found")) {
          return { kind, status: "idle", name: null, pods: [] };
        }
        throw e;
      }
    }

    export async function startAgentSession(slug, kind) {
      normKind(kind);
      const substitutions = {
        PROJECT_SLUG: slug,
        AGENT_KIND: kind,
        AGENT_IMAGE: AGENT_IMAGE
      };

      const ssManifest = await renderManifest(
        path.join(MANIFEST_DIR, "statefulset.yaml"),
        substitutions
      );
      const svcManifest = await renderManifest(
        path.join(MANIFEST_DIR, "service.yaml"),
        substitutions
      );

      await runKubectl(["-n", AGENT_NAMESPACE, "apply", "-f", "-"], { input: ssManifest });
      await runKubectl(["-n", AGENT_NAMESPACE, "apply", "-f", "-"], { input: svcManifest });

      return await getAgentSession(slug, kind);
    }

    export async function pauseAgentSession(slug, kind) {
      normKind(kind);
      const name = resourceName(slug, kind);
      await runKubectl([
        "-n", AGENT_NAMESPACE,
        "scale", "statefulset", name,
        "--replicas=0"
      ]);
      return await getAgentSession(slug, kind);
    }

    export async function resumeAgentSession(slug, kind) {
      normKind(kind);
      const name = resourceName(slug, kind);
      await runKubectl([
        "-n", AGENT_NAMESPACE,
        "scale", "statefulset", name,
        "--replicas=1"
      ]);
      return await getAgentSession(slug, kind);
    }

    export async function stopAgentSession(slug, kind, { deletePVC = false } = {}) {
      normKind(kind);
      const name = resourceName(slug, kind);
      try {
        await runKubectl(["-n", AGENT_NAMESPACE, "delete", "statefulset", name, "--ignore-not-found"]);
        await runKubectl(["-n", AGENT_NAMESPACE, "delete", "service", name, "--ignore-not-found"]);
        if (deletePVC) {
          await runKubectl([
            "-n", AGENT_NAMESPACE,
            "delete", "pvc",
            "-l", `app=beagle-agent,project=${slug},agent-kind=${kind}`,
            "--ignore-not-found"
          ]);
        }
      } catch (e) {
        // Idempotent — ignore NotFound
        if (!e.message.includes("NotFound") && !e.message.includes("not found")) throw e;
      }
      return { kind, status: "idle", name: null, pods: [] };
    }

    // ─── Route registration ─────────────────────────────────────────────

    /**
     * Register agent routes on an existing Express app.
     * @param {import('express').Application} app
     */
    export function registerAgentRoutes(app) {
      app.get("/api/projects/:slug/agent/sessions", async (req, res) => {
        try {
          const sessions = await listAgentSessions(req.params.slug);
          res.json({
            projectSlug: req.params.slug,
            sessions,
            generatedAt: new Date().toISOString(),
            truthMode: "observed"
          });
        } catch (e) {
          res.status(e.statusCode || 500).json({ error: e.message, truthMode: "stale" });
        }
      });

      app.get("/api/projects/:slug/agent/session/:kind", async (req, res) => {
        try {
          const session = await getAgentSession(req.params.slug, req.params.kind);
          res.json({ ...session, truthMode: "observed" });
        } catch (e) {
          res.status(e.statusCode || 500).json({ error: e.message, truthMode: "stale" });
        }
      });

      app.post("/api/projects/:slug/agent/session/start", async (req, res) => {
        try {
          const kind = req.body?.kind || "claude-code";
          const session = await startAgentSession(req.params.slug, kind);
          res.json({ ...session, truthMode: "observed", action: "start" });
        } catch (e) {
          res.status(e.statusCode || 500).json({ error: e.message, truthMode: "stale" });
        }
      });

      app.post("/api/projects/:slug/agent/session/:kind/pause", async (req, res) => {
        try {
          const session = await pauseAgentSession(req.params.slug, req.params.kind);
          res.json({ ...session, truthMode: "observed", action: "pause" });
        } catch (e) {
          res.status(e.statusCode || 500).json({ error: e.message, truthMode: "stale" });
        }
      });

      app.post("/api/projects/:slug/agent/session/:kind/resume", async (req, res) => {
        try {
          const session = await resumeAgentSession(req.params.slug, req.params.kind);
          res.json({ ...session, truthMode: "observed", action: "resume" });
        } catch (e) {
          res.status(e.statusCode || 500).json({ error: e.message, truthMode: "stale" });
        }
      });

      app.post("/api/projects/:slug/agent/session/:kind/stop", async (req, res) => {
        try {
          const deletePVC = req.body?.deletePVC === true;
          const session = await stopAgentSession(req.params.slug, req.params.kind, { deletePVC });
          res.json({ ...session, truthMode: "observed", action: "stop" });
        } catch (e) {
          res.status(e.statusCode || 500).json({ error: e.message, truthMode: "stale" });
        }
      });
    }

    /**
     * WebSocket handler — stream tmux output from agent pod.
     * @param {import('ws').WebSocketServer} wss
     */
    export function registerAgentWebSocket(wss, { urlPattern = /^\/ws\/projects\/([^/]+)\/agent\/([^/]+)/ } = {}) {
      wss.on("connection", (socket, req) => {
        const match = req.url?.match(urlPattern);
        if (!match) return;
        const [, slug, kind] = match;

        const name = resourceName(slug, kind);
        const tmuxSession = `agent-${kind}`;
        const podName = `${name}-0`;  // StatefulSet pod 0

        // kubectl exec into tmux attach
        const kubectl = spawn(KUBECTL, [
          "-n", AGENT_NAMESPACE,
          "exec", "-it", podName,
          "--",
          "tmux", "attach-session", "-t", tmuxSession
        ], { stdio: ["pipe", "pipe", "pipe"] });

        socket.on("message", (data) => {
          try {
            const msg = JSON.parse(data.toString());
            if (msg.type === "input" && kubectl.stdin.writable) {
              kubectl.stdin.write(msg.data);
            } else if (msg.type === "resize") {
              // TTY resize — send SIGWINCH or use resize command
              // (kubectl exec doesn't easily support resize; tmux handles its own)
            }
          } catch {
            // Treat raw data as input
            if (kubectl.stdin.writable) kubectl.stdin.write(data);
          }
        });

        kubectl.stdout.on("data", (d) => {
          socket.send(JSON.stringify({ type: "data", data: d.toString() }));
        });
        kubectl.stderr.on("data", (d) => {
          socket.send(JSON.stringify({ type: "stderr", data: d.toString() }));
        });
        kubectl.on("close", (code) => {
          socket.send(JSON.stringify({ type: "exit", code }));
          socket.close();
        });

        socket.on("close", () => {
          kubectl.kill("SIGTERM");
        });
      });
    }
  auth-bridge.mjs: |
    // auth-bridge.mjs
    //
    // /api/auth/beagle-token — returns the beagle-server consumer token to the
    // caller, identified by Tailnet headers (set by Tailscale operator sidecar).
    //
    // iOS app calls this once on launch (cached in Keychain), uses returned token
    // in subsequent calls to `beagle-core.tail21cbc4.ts.net` with:
    //   X-Beagle-Consumer: beagle-operator
    //   Authorization: Bearer <token>
    //
    // Source of truth for the token: cluster Secret `beagle-core-secrets`,
    // which we read via kubectl on demand (cached 5min).

    import { spawn } from "node:child_process";

    const NAMESPACE = process.env.PROJECT_COCKPIT_AGENT_NAMESPACE || "beagle";
    const KUBECTL = process.env.PROJECT_COCKPIT_KUBECTL || "/usr/local/bin/kubectl";
    const SECRET_NAME = process.env.PROJECT_COCKPIT_BEAGLE_SECRET || "beagle-core-secrets";
    const DARWIN_HPC_ADAPTER_NAMESPACE =
      process.env.PROJECT_COCKPIT_DARWIN_HPC_ADAPTER_NAMESPACE || "darwin-platform";
    const DARWIN_HPC_ADAPTER_SECRET =
      process.env.PROJECT_COCKPIT_DARWIN_HPC_ADAPTER_SECRET || "darwin-hpc-gateway-adapter";
    const DARWIN_HPC_ADAPTER_URL =
      process.env.PROJECT_COCKPIT_DARWIN_HPC_ADAPTER_URL || "http://192.168.3.169:6830";
    const TTL_MS = 5 * 60 * 1000;  // 5 min cache
    const BEAGLE_PUBLIC_URL =
      process.env.PROJECT_COCKPIT_BEAGLE_URL || "http://beagle-core.tail21cbc4.ts.net";
    const BEAGLE_INTERNAL_URL =
      process.env.PROJECT_COCKPIT_BEAGLE_INTERNAL_URL ||
      "http://beagle-core.beagle.svc.cluster.local:8080";
    const DYNAMO_INTERNAL_URL =
      process.env.PROJECT_COCKPIT_DYNAMO_INTERNAL_URL ||
      process.env.PROJECT_COCKPIT_DYNAMO_ENDPOINT ||
      "http://dynamo-control-plane.beagle.svc.cluster.local:8000";
    const DYNAMO_MODEL =
      process.env.PROJECT_COCKPIT_DYNAMO_MODEL ||
      process.env.BEAGLE_DYNAMO_MODEL ||
      "qwen2.5-0.5B-Instruct";
    const BEAGLE_ALLOWED_PROXY_PREFIXES = [
      "/api/v1/cognitive/",
      "/api/exocortex/process",
      "/api/fractal/recurse",
      "/api/deep_think"
    ];

    let tokenCache = null;
    let tokenCachedAt = 0;
    let adapterTokenCache = null;
    let adapterTokenCachedAt = 0;

    function runKubectl(args, { timeoutMs = 8000 } = {}) {
      return new Promise((resolve, reject) => {
        const child = spawn(KUBECTL, args, { stdio: ["ignore", "pipe", "pipe"] });
        let stdout = "", stderr = "";
        const timer = setTimeout(() => { child.kill("SIGKILL"); reject(new Error("kubectl timeout")); }, timeoutMs);
        child.stdout.on("data", d => stdout += d.toString());
        child.stderr.on("data", d => stderr += d.toString());
        child.on("close", code => {
          clearTimeout(timer);
          if (code !== 0) reject(new Error(`kubectl exit ${code}: ${stderr}`));
          else resolve(stdout);
        });
        child.on("error", e => { clearTimeout(timer); reject(e); });
      });
    }

    export async function fetchOperatorToken() {
      const now = Date.now();
      if (tokenCache && (now - tokenCachedAt) < TTL_MS) {
        return { token: tokenCache, source: "cache", age_ms: now - tokenCachedAt };
      }

      // Try a known set of token keys in the secret
      const candidateKeys = ["BEAGLE_OPERATOR_API_TOKEN", "BEAGLE_API_TOKEN", "operator-token"];
      let raw, secret;
      try {
        raw = await runKubectl(["-n", NAMESPACE, "get", "secret", SECRET_NAME, "-o", "json"]);
        secret = JSON.parse(raw);
      } catch (e) {
        return { error: `cannot read secret ${SECRET_NAME}: ${e.message}` };
      }

      const data = secret.data || {};
      let foundKey, foundToken;
      for (const k of candidateKeys) {
        if (data[k]) {
          foundKey = k;
          foundToken = Buffer.from(data[k], "base64").toString("utf8");
          break;
        }
      }

      if (!foundToken) {
        return { error: `no token found in secret ${SECRET_NAME} (tried: ${candidateKeys.join(", ")})` };
      }

      tokenCache = foundToken;
      tokenCachedAt = now;
      return { token: foundToken, source: "fresh", key: foundKey };
    }

    export async function fetchDarwinHpcAdapterConfig() {
      const now = Date.now();
      if (adapterTokenCache && (now - adapterTokenCachedAt) < TTL_MS) {
        return {
          url: DARWIN_HPC_ADAPTER_URL,
          token: adapterTokenCache,
          source: "cache",
          age_ms: now - adapterTokenCachedAt
        };
      }

      const candidateKeys = ["adapterToken", "token", "ADAPTER_TOKEN"];
      let raw, secret;
      try {
        raw = await runKubectl([
          "-n",
          DARWIN_HPC_ADAPTER_NAMESPACE,
          "get",
          "secret",
          DARWIN_HPC_ADAPTER_SECRET,
          "-o",
          "json"
        ]);
        secret = JSON.parse(raw);
      } catch (e) {
        return {
          error: `cannot read secret ${DARWIN_HPC_ADAPTER_NAMESPACE}/${DARWIN_HPC_ADAPTER_SECRET}: ${e.message}`
        };
      }

      const data = secret.data || {};
      let foundKey, foundToken;
      for (const k of candidateKeys) {
        if (data[k]) {
          foundKey = k;
          foundToken = Buffer.from(data[k], "base64").toString("utf8");
          break;
        }
      }

      if (!foundToken) {
        return {
          error: `no token found in secret ${DARWIN_HPC_ADAPTER_NAMESPACE}/${DARWIN_HPC_ADAPTER_SECRET} (tried: ${candidateKeys.join(", ")})`
        };
      }

      adapterTokenCache = foundToken;
      adapterTokenCachedAt = now;
      return {
        url: DARWIN_HPC_ADAPTER_URL,
        token: foundToken,
        source: "fresh",
        key: foundKey
      };
    }

    function deriveCaller(req) {
      // Tailscale operator sidecar injects these on Tailnet routes
      const tsUser = req.header("Tailscale-User-Login")
        || req.header("x-tailscale-user")
        || req.header("X-Auth-Request-User")
        || null;
      const tsName = req.header("Tailscale-User-Name")
        || req.header("x-tailscale-name")
        || null;
      return {
        tailnet_login: tsUser,
        tailnet_name: tsName,
        has_tailnet_identity: !!tsUser
      };
    }

    function parseJsonResponse(raw) {
      if (!raw) {
        return {};
      }
      try {
        return JSON.parse(raw);
      } catch (_err) {
        return { raw };
      }
    }

    function cleanString(value) {
      if (typeof value === "string") {
        const trimmed = value.trim();
        return trimmed ? trimmed : "";
      }
      if (typeof value === "number" || typeof value === "boolean") {
        return String(value).trim();
      }
      return "";
    }

    function inferCompletionSource(payload = {}) {
      const explicit =
        cleanString(payload?.source) ||
        cleanString(payload?.response_source) ||
        cleanString(payload?.provider_source);
      if (explicit) {
        return explicit;
      }
      if (cleanString(payload?.agentKind || payload?.agent_kind || payload?.sessionId || payload?.session_id || payload?.podName || payload?.pod_name)) {
        return "agent";
      }
      return "cluster";
    }

    function cleanObjectString(value, fallback = "") {
      const cleaned = cleanString(value);
      return cleaned || fallback;
    }

    function extractDiscussionLabText(payload = {}) {
      const direct =
        cleanString(payload?.text) ||
        cleanString(payload?.response) ||
        cleanString(payload?.answer);
      if (direct) {
        return direct;
      }
      const choices = Array.isArray(payload?.choices) ? payload.choices : [];
      const firstChoice = choices[0] || {};
      return (
        cleanString(firstChoice?.message?.content) ||
        cleanString(firstChoice?.delta?.content) ||
        cleanString(firstChoice?.text)
      );
    }

    function extractDiscussionLabError(payload = {}) {
      return (
        cleanString(payload?.error?.message) ||
        cleanString(payload?.error) ||
        cleanString(payload?.message)
      );
    }

    function resolveBeagleProxyPath(req) {
      const requestUrl = new URL(req.originalUrl, "http://project-cockpit.local");
      const proxiedPath = requestUrl.pathname.replace(/^\/api\/beagle/, "");
      const normalizedPath = proxiedPath.startsWith("/") ? proxiedPath : `/${proxiedPath}`;
      const allowed = BEAGLE_ALLOWED_PROXY_PREFIXES.some(
        (prefix) => normalizedPath === prefix || normalizedPath.startsWith(prefix)
      );
      if (!allowed) {
        return {
          error: `beagle proxy path is not allowed: ${normalizedPath}`
        };
      }
      return {
        path: `${normalizedPath}${requestUrl.search}`
      };
    }

    async function proxyBeagleRequest(method, req) {
      const target = resolveBeagleProxyPath(req);
      if (target.error) {
        return {
          status: 400,
          payload: {
            error: target.error,
            truthMode: "declared",
            via: "cockpit-beagle-proxy"
          }
        };
      }

      const tokenResult = await fetchOperatorToken();
      if (tokenResult.error || !tokenResult.token) {
        return {
          status: 503,
          payload: {
            error: tokenResult.error || "beagle token unavailable",
            truthMode: "stale",
            via: "cockpit-beagle-proxy",
            proxied_path: target.path
          }
        };
      }

      const timeoutMs = method === "POST" ? 120000 : 15000;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(`${BEAGLE_INTERNAL_URL}${target.path}`, {
          method,
          headers: {
            Accept: "application/json",
            "content-type": "application/json",
            "X-Beagle-Consumer": "beagle-operator",
            Authorization: `Bearer ${tokenResult.token}`
          },
          body: method === "POST" ? JSON.stringify(req.body ?? {}) : undefined,
          signal: ctrl.signal
        });
        const payload = parseJsonResponse(await res.text());
        const body =
          payload && typeof payload === "object" && !Array.isArray(payload)
            ? {
                ...payload,
                via: payload.via || "cockpit-beagle-proxy",
                proxied_path: target.path
              }
            : {
                data: payload,
                via: "cockpit-beagle-proxy",
                proxied_path: target.path
              };
        return {
          status: res.status,
          payload: body
        };
      } catch (err) {
        return {
          status: 503,
          payload: {
            error: err.message,
            truthMode: "stale",
            via: "cockpit-beagle-proxy",
            proxied_path: target.path,
            beagle_url: BEAGLE_INTERNAL_URL
          }
        };
      } finally {
        clearTimeout(timer);
      }
    }

    export async function proxyBeagleCompletion({
      prompt,
      system = "",
      requires_math = false,
      requires_high_quality = false,
      offline_required = false
    }) {
      const promptText = cleanString(prompt);
      const systemText = cleanString(system);
      const completionPrompt = systemText ? `${systemText}\n\n${promptText}` : promptText;
      const messages = [];
      const behavioralPrompt = [];
      if (systemText) {
        messages.push({ role: "system", content: systemText });
      }
      if (requires_math) {
        behavioralPrompt.push("Solve the task carefully and verify any arithmetic.");
      }
      if (requires_high_quality) {
        behavioralPrompt.push("Prioritize accuracy, clarity, and completeness.");
      }
      if (offline_required) {
        behavioralPrompt.push("Answer directly without suggesting external tools or web access.");
      }
      if (behavioralPrompt.length > 0) {
        messages.push({
          role: "system",
          content: behavioralPrompt.join(" ")
        });
      }
      messages.push({ role: "user", content: promptText });

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 120000);
      try {
        const res = await fetch(`${DYNAMO_INTERNAL_URL}/v1/chat/completions`, {
          method: "POST",
          headers: {
            Accept: "application/json",
            "content-type": "application/json"
          },
          body: JSON.stringify({
            model: DYNAMO_MODEL,
            messages,
            temperature: 0.2
          }),
          signal: ctrl.signal
        });

        const payload = parseJsonResponse(await res.text());
        const responseText = cleanString(
          payload?.choices?.[0]?.message?.content ||
            payload?.choices?.[0]?.text ||
            payload?.output_text ||
            payload?.text ||
            payload?.response
        );
        return {
          status: res.status,
          payload: {
            text: responseText,
            response: responseText,
            provider: cleanString(payload?.model || DYNAMO_MODEL || "dynamo"),
            tier: cleanString(payload?.model || DYNAMO_MODEL || "dynamo"),
            source: inferCompletionSource(payload),
            agentKind: cleanString(payload?.agentKind || payload?.agent_kind),
            sessionId: cleanString(payload?.sessionId || payload?.session_id),
            podName: cleanString(payload?.podName || payload?.pod_name),
            usage: payload?.usage || {},
            truthMode: "observed",
            raw: payload
          },
          completionPrompt,
          beagleUrl: DYNAMO_INTERNAL_URL
        };
      } catch (err) {
        return {
          status: 503,
          payload: {
            error: err.message,
            truthMode: "stale",
            via: "cockpit-beagle-completion",
            beagle_url: DYNAMO_INTERNAL_URL
          },
          completionPrompt,
          beagleUrl: DYNAMO_INTERNAL_URL
        };
      } finally {
        clearTimeout(timer);
      }
    }

    export async function proxyDiscussionLabCompletion({
      prompt,
      system = "",
      profile
    }) {
      const promptText = cleanString(prompt);
      const systemText = cleanString(system);
      const endpoint = cleanString(profile?.endpoint);
      const model = cleanObjectString(
        profile?.runtimeModelId,
        profile?.modelId,
        profile?.model,
        cleanString(profile?.id) || "unknown"
      );
      const profileId = cleanString(profile?.id);

      if (!promptText) {
        return {
          status: 400,
          payload: {
            error: "prompt is required",
            truthMode: "declared",
            source: "cluster"
          }
        };
      }

      if (!endpoint) {
        return {
          status: 503,
          payload: {
            error: `discussion lab profile ${profileId || "unknown"} has no endpoint`,
            truthMode: "declared",
            source: "cluster"
          }
        };
      }

      const ctrl = new AbortController();
      const timeoutMs = 90000;
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(`${endpoint}/v1/chat/completions`, {
          method: "POST",
          headers: {
            Accept: "application/json",
            "content-type": "application/json"
          },
          body: JSON.stringify({
            model,
            stream: false,
            messages: [
              ...(systemText ? [{ role: "system", content: systemText }] : []),
              { role: "user", content: promptText }
            ]
          }),
          signal: ctrl.signal
        });
        const payload = parseJsonResponse(await res.text());
        if (!res.ok) {
          return {
            status: res.status,
            payload: {
              error:
                extractDiscussionLabError(payload) ||
                `discussion lab request failed with HTTP ${res.status}`,
              truthMode: "stale",
              source: "cluster",
              beagle_url: endpoint,
              discussion_profile: profileId
            }
          };
        }

        const responseText = extractDiscussionLabText(payload);
        if (!responseText) {
          return {
            status: 502,
            payload: {
              error: "discussion lab returned an empty completion",
              truthMode: "stale",
              source: "cluster",
              beagle_url: endpoint,
              discussion_profile: profileId
            }
          };
        }

        return {
          status: 200,
          payload: {
            response: responseText,
            model: cleanObjectString(payload?.model, model),
            provider: cleanObjectString(payload?.model, model),
            tier: cleanObjectString(profile?.family, profileId || "discussion-lab"),
            source: "cluster",
            usage: payload?.usage || null,
            beagle_url: endpoint,
            discussion_profile: profileId,
            pod_name: cleanString(profile?.node)
          }
        };
      } catch (err) {
        return {
          status: 503,
          payload: {
            error: err.message,
            truthMode: "stale",
            source: "cluster",
            beagle_url: endpoint,
            discussion_profile: profileId
          }
        };
      } finally {
        clearTimeout(timer);
      }
    }

    export function registerAuthBridgeRoutes(app) {
      app.get("/api/auth/beagle-token", async (req, res) => {
        const caller = deriveCaller(req);

        // Personal/closed mode: no Tailnet header required (we trust the network).
        // When multi-tenant: require has_tailnet_identity here.
        const result = await fetchOperatorToken();

        if (result.error) {
          return res.status(503).json({
            error: result.error,
            truthMode: "stale",
            caller
          });
        }

        res.json({
          token: result.token,
          consumer: "beagle-operator",
          auth_header_value: `Bearer ${result.token}`,
          consumer_header_name: "X-Beagle-Consumer",
          consumer_header_value: "beagle-operator",
          beagle_url: BEAGLE_PUBLIC_URL,
          cluster_internal_url: BEAGLE_INTERNAL_URL,
          cached: result.source === "cache",
          cache_ttl_ms: TTL_MS,
          caller,
          truthMode: "observed",
          issued_at: new Date().toISOString()
        });
