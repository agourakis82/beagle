    const HPC_READ_TIMEOUT_MS = Number(process.env.PROJECT_COCKPIT_HPC_READ_TIMEOUT_MS || 15000);
    const HPC_OBJECT_TIMEOUT_MS = Number(process.env.PROJECT_COCKPIT_HPC_OBJECT_TIMEOUT_MS || 60000);
