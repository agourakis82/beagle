    app.post(
      "/api/projects/:slug/cluster/actions/:actionId",
      jsonResponse(async (req) => {
        ensureConfirmed(req, "cluster action");
        const project = await getProjectOrThrow(req.params.slug);
        const actionId = cleanValue(req.params.actionId);
        const workspaceStatefulSetName = inferWorkspaceStatefulSetName(project);

        let args;
        let label;
        let output;

        if (actionId === "restart-workspace") {
          label = `restart-workspace:${workspaceStatefulSetName}`;
          const { stdout } = await runKubectlPty([
            "-n",
            project.namespace,
            "rollout",
            "restart",
            `statefulset/${workspaceStatefulSetName}`
          ]);
          output = stdout;
        } else if (actionId === "restart-cockpit") {
          label = "restart-cockpit:project-cockpit";
          const { stdout } = await runKubectlPty([
            "-n",
            project.namespace,
            "rollout",
            "restart",
            "deployment/project-cockpit"
          ]);
          output = stdout;
        } else if (actionId === "repair-workspace-tailnet-services") {
          label = "repair-workspace-tailnet-services";
          const httpService = {
            apiVersion: "v1",
            kind: "Service",
            metadata: {
              name: `${project.workspaceId}-tailnet-http`,
              namespace: project.namespace,
              annotations: {
                "tailscale.com/proxy-group": "sounio-workspace-ingress",
                "tailscale.com/hostname": project.workspaceId,
                "tailscale.com/tags": "tag:k8s,tag:sounio-workspace"
              }
            },
            spec: {
              type: "LoadBalancer",
              loadBalancerClass: "tailscale",
              selector: {
                "app.kubernetes.io/name": "sounio-workspace-habitat"
              },
              ports: [{ name: "http", port: 8080, targetPort: "http", protocol: "TCP" }]
            }
          };
          const sshService = {
            apiVersion: "v1",
            kind: "Service",
            metadata: {
              name: `${project.workspaceId}-tailnet-ssh`,
              namespace: project.namespace,
              annotations: {
                "tailscale.com/proxy-group": "sounio-workspace-ingress",
                "tailscale.com/hostname": `${project.workspaceId}-ssh`,
                "tailscale.com/tags": "tag:k8s,tag:sounio-workspace"
              }
            },
            spec: {
              type: "LoadBalancer",
              loadBalancerClass: "tailscale",
              selector: {
                "app.kubernetes.io/name": "sounio-workspace-habitat"
              },
              ports: [{ name: "ssh", port: 2222, targetPort: "ssh", protocol: "TCP" }]
            }
          };
          await runKubectlJson(["-n", project.namespace, "get", "statefulset", workspaceStatefulSetName]);
          await runKubectlJson(["get", "proxygroup", "sounio-workspace-ingress"]);
          await runKubectlPty([
            "-n",
            project.namespace,
            "delete",
            "service",
            `${project.workspaceId}-tailnet-http`,
            `${project.workspaceId}-tailnet-ssh`,
            "--ignore-not-found=true",
            "--wait=true"
          ], { timeoutMs: 30000 });
          for (const name of [`${project.workspaceId}-tailnet-http`, `${project.workspaceId}-tailnet-ssh`]) {
            for (let attempt = 0; attempt < 20; attempt += 1) {
              try {
                await runKubectlJson(["-n", project.namespace, "get", "service", name]);
                await new Promise((resolve) => setTimeout(resolve, 500));
              } catch (error) {
                if (
                  error.code === 1 &&
                  String(error.stdout || error.message || "").includes(`services \"${name}\" not found`)
                ) {
                  break;
                }
                throw error;
              }
            }
          }
          const manifestJson = shellQuote(JSON.stringify({ apiVersion: "v1", kind: "List", items: [httpService, sshService] }));
          const applyResult = await runPtyCommand(
            "/bin/sh",
            ["-lc", `printf '%s\n' ${manifestJson} | ${[kubectlBin, ...buildKubectlCliArgs(["apply", "-f", "-"])].map(shellQuote).join(" ")}`],
            { timeoutMs: 30000 }
          );
          output = JSON.stringify(
            {
              recreated: [`${project.workspaceId}-tailnet-http`, `${project.workspaceId}-tailnet-ssh`],
              applyOutput: sanitizePtyOutput(applyResult.stdout)
            },
            null,
            2
          );
        } else {
          const error = new Error(`unknown cluster action: ${actionId}`);
          error.statusCode = 404;
          throw error;
        }

        const clientSessionId = cleanValue(req.body?.clientSessionId);
        if (clientSessionId) {
          await touchSession(project.projectSlug, clientSessionId, deriveViewer(req, req.body?.alias), {
            currentAction: "cluster-mutation-from-cockpit",
            lastMutationAt: new Date().toISOString(),
            lastMutationLabel: label
          });
        }

        return {
          ok: true,
          actionId,
          output,
          actions: await readClusterActionPreview(project),
          cluster: await readClusterSummary(project)
        };
      })
    );

    app.get(
      "/api/projects/:slug/git/status",
      jsonResponse(async (req) => {
        const project = await getProjectOrThrow(req.params.slug);
        return { project, git: await withTimeout(readGitStatus(project), "git status", 20000) };
      })
    );

    app.get(
      "/api/projects/:slug/toolchain",
      jsonResponse(async (req) => {
        const project = await getProjectOrThrow(req.params.slug);
        return { project, tools: await withTimeout(readToolchainStatus(project), "toolchain status", 20000) };
      })
    );

    app.get(
      "/api/projects/:slug/git/diff",
      jsonResponse(async (req) => {
        const project = await getProjectOrThrow(req.params.slug);
        return { project, diff: await withTimeout(readDiffPreview(project), "git diff preview", 20000) };
      })
    );

    app.get(
      "/api/projects/:slug/git/pr/preview",
      jsonResponse(async (req) => {
        const project = await getProjectOrThrow(req.params.slug);
        const base = String(req.query.base || project.preferredPrBase || "main").trim();
        return { project, preview: await withTimeout(readPrPreview(project, base), "git PR preview", 20000) };
      })
    );

    app.get(
      "/api/projects/:slug/git/guardrails",
      jsonResponse(async (req) => {
        const project = await getProjectOrThrow(req.params.slug);
        const base = String(req.query.base || project.preferredPrBase || "main").trim();
        return {
          project,
          guardrails: await withTimeout(readGitGuardrails(project, base), "git guardrails", 25000)
        };
      })
    );

    app.post(
      "/api/projects/:slug/git/topic-branch",
      jsonResponse(async (req) => {
        ensureConfirmed(req, "start topic branch");
        const project = await getProjectOrThrow(req.params.slug);
        const base = String(req.body?.base || project.preferredPrBase || "main").trim();
        const branch = normalizeBranchName(req.body?.branch);

        if (!branch) {
          const error = new Error("topic branch name is required");
          error.statusCode = 400;
          throw error;
        }

        if (!/^[A-Za-z0-9._/-]+$/.test(branch)) {
          const error = new Error("topic branch name may only use letters, numbers, ., _, /, and -");
          error.statusCode = 400;
          throw error;
        }

        const guardrails = await readGitGuardrails(project, base);
        if (guardrails.publishableDirtyCount > 0) {
          const error = new Error(
            "cannot start a topic branch while the habitat working tree is dirty; review or commit the pending changes first"
          );
          error.statusCode = 409;
          throw error;
        }

        const { stdout } = await withTimeout(
          runWorkspaceShell(
            project,
            {
              WORKSPACE_ROOT: project.workspaceRoot,
              PR_BASE: base,
              TOPIC_BRANCH: branch
            },
            'cd "$WORKSPACE_ROOT" && git fetch origin "$PR_BASE" >/dev/null 2>&1 || true && if git show-ref --verify --quiet "refs/heads/$TOPIC_BRANCH"; then git switch "$TOPIC_BRANCH"; else git switch -c "$TOPIC_BRANCH" "$PR_BASE"; fi'
          ),
          "git topic branch mutation",
          30000
        );

        const clientSessionId = cleanValue(req.body?.clientSessionId);
        if (clientSessionId) {
          await touchSession(project.projectSlug, clientSessionId, deriveViewer(req, req.body?.alias), {
            currentAction: "started-topic-branch-from-cockpit",
            lastMutationAt: new Date().toISOString(),
            lastMutationLabel: `topic-branch: ${branch} <- ${base}`,
            publicationStage: "working"
          });
        }

        return {
          ok: true,
          branch,
          base,
          output: stdout,
          git: await readGitStatus(project),
          diff: await readDiffPreview(project),
          preview: await readPrPreview(project, base),
          guardrails: await readGitGuardrails(project, base)
        };
      })
    );

    app.post(
      "/api/projects/:slug/git/commit",
      jsonResponse(async (req) => {
        ensureConfirmed(req, "commit");
        const project = await getProjectOrThrow(req.params.slug);
        const message = String(req.body?.message || "").trim();
        if (!message) {
          const error = new Error("commit message is required");
          error.statusCode = 400;
          throw error;
        }
        const guardrails = await readGitGuardrails(project, project.preferredPrBase || "main");
        if (!guardrails.canCommit) {
          const error = new Error("git guardrails block commit because there is nothing new to commit");
          error.statusCode = 409;
          throw error;
        }

        const { stdout } = await withTimeout(
          runWorkspaceShell(
            project,
            {
              WORKSPACE_ROOT: project.workspaceRoot,
              COMMIT_MESSAGE: message
            },
            'cd "$WORKSPACE_ROOT" && git add -A && (git reset -q HEAD -- .beagle >/dev/null 2>&1 || true) && git commit -m "$COMMIT_MESSAGE"'
          ),
          "git commit mutation",
          30000
        );
        const commitSha = extractCommitSha(stdout);

        const clientSessionId = cleanValue(req.body?.clientSessionId);
        if (clientSessionId) {
          await touchSession(project.projectSlug, clientSessionId, deriveViewer(req, req.body?.alias), {
            currentAction: "committed-from-cockpit",
            lastMutationAt: new Date().toISOString(),
            lastMutationLabel: `commit: ${message}`,
            lastCommitSha: commitSha,
            lastCommitMessage: message,
            lastCommitAt: new Date().toISOString(),
            publicationStage: "working"
          });
        }

        return {
          ok: true,
          output: stdout,
          git: await readGitStatus(project),
          diff: await readDiffPreview(project),
          guardrails: await readGitGuardrails(project, project.preferredPrBase || "main")
        };
      })
    );

    app.post(
      "/api/projects/:slug/git/push",
      jsonResponse(async (req) => {
        ensureConfirmed(req, "push");
        const project = await getProjectOrThrow(req.params.slug);
        const guardrails = await readGitGuardrails(project, project.preferredPrBase || "main");
        const branch = guardrails.branch;
        if (!branch) {
          const error = new Error("could not determine current branch");
          error.statusCode = 400;
          throw error;
        }
        if (!guardrails.canPush) {
          const error = new Error("git guardrails block push; inspect cautions before retrying");
          error.statusCode = 409;
          throw error;
        }

        const { stdout } = await withTimeout(
          runWorkspaceShell(
            project,
            {
              WORKSPACE_ROOT: project.workspaceRoot,
              CURRENT_BRANCH: branch
            },
            'cd "$WORKSPACE_ROOT" && git push -u origin "$CURRENT_BRANCH"'
          ),
          "git push mutation",
          30000
        );

        const clientSessionId = cleanValue(req.body?.clientSessionId);
        if (clientSessionId) {
          await touchSession(project.projectSlug, clientSessionId, deriveViewer(req, req.body?.alias), {
            currentAction: "pushed-from-cockpit",
            lastMutationAt: new Date().toISOString(),
            lastMutationLabel: `push: ${branch}`,
            lastPushBranch: branch,
            lastPushAt: new Date().toISOString(),
            lastMergeReadiness: "pushed-awaiting-pr",
            publicationStage: "published"
          });
        }

        return {
          ok: true,
          branch,
          output: stdout,
          git: await readGitStatus(project),
          guardrails: await readGitGuardrails(project, project.preferredPrBase || "main")
        };
      })
    );

    app.post(
      "/api/projects/:slug/git/pr",
      jsonResponse(async (req) => {
        ensureConfirmed(req, "draft PR");
        const project = await getProjectOrThrow(req.params.slug);
        const base = String(req.body?.base || project.preferredPrBase || "main").trim();
        const title = String(req.body?.title || "").trim();
        const body = String(req.body?.body || "").trim();
        const guardrails = await readGitGuardrails(project, base);
        const branch = guardrails.branch;

        if (!branch) {
          const error = new Error("could not determine current branch");
          error.statusCode = 400;
          throw error;
        }
        if (!guardrails.canPr) {
          const error = new Error("git guardrails block draft PR creation; inspect cautions and PR preview before retrying");
          error.statusCode = 409;
          throw error;
        }

        const command =
          title || body
            ? 'cd "$WORKSPACE_ROOT" && gh pr create --draft --base "$PR_BASE" --head "$CURRENT_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"'
            : 'cd "$WORKSPACE_ROOT" && gh pr create --draft --fill --base "$PR_BASE" --head "$CURRENT_BRANCH"';

        const { stdout } = await withTimeout(
          runWorkspaceShell(
            project,
            {
              WORKSPACE_ROOT: project.workspaceRoot,
              PR_BASE: base,
              CURRENT_BRANCH: branch,
              PR_TITLE: title,
              PR_BODY: body
            },
            command
          ),
          "git draft PR mutation",
          30000
        );

        const url = stdout
          .trim()
          .split("\n")
          .find((line) => line.startsWith("http")) || "";

        const clientSessionId = cleanValue(req.body?.clientSessionId);
        if (clientSessionId) {
          const normalizedTitle = title || firstNonEmptyLine(stdout);
          await touchSession(project.projectSlug, clientSessionId, deriveViewer(req, req.body?.alias), {
            currentAction: "opened-draft-pr-from-cockpit",
            lastMutationAt: new Date().toISOString(),
            lastMutationLabel: `draft-pr: ${branch} -> ${base}`,
            lastPrUrl: url,
            lastPrAt: new Date().toISOString(),
            lastPrTitle: normalizedTitle,
            lastPrBase: base,
            lastPrHead: branch,
            lastReviewStep: "draft-pr-opened",
            lastReviewStepAt: new Date().toISOString(),
            lastReviewUrl: url,
            lastMergeReadiness: "draft",
            publicationStage: "under-review"
          });
        }

        return {
          ok: true,
          branch,
          base,
          url,
          output: stdout,
          preview: await readPrPreview(project, base),
          guardrails: await readGitGuardrails(project, base)
        };
      })
    );

    if (existsSync(distDir)) {
      app.use(express.static(distDir));

      app.get("*", (req, res, next) => {
        if (req.path.startsWith("/api/")) {
          next();
          return;
        }
        res.sendFile(path.join(distDir, "index.html"));
      });
    }

    // Serve the OpenAPI spec at a stable, well-known path so ChatGPT Custom
    // GPT Actions / Swagger UI / any OAI-consuming client can discover it
    // without depending on the SolidJS build output. Lives in public/ so
    // Vite copies it into dist/ too; this direct route is defensive.
    app.get(["/openapi.yaml", "/.well-known/openapi.yaml"], (_req, res) => {
      const specPath = path.join(rootDir, "public", "openapi.yaml");
      if (!existsSync(specPath)) {
        return res.status(404).type("text/plain").send("openapi.yaml missing in build");
      }
      res.type("application/yaml").sendFile(specPath);
    });

    // ─── MCP Manifest (published contract for external MCP clients) ─────────
    registerManifestRoutes(app);

    // ─── Mobile v1 routes (stable iOS/macOS-facing contract boundary) ────────
    registerMobileRoutes(app, {
      getProjectOrThrow,
      readCatalog: loadCatalog,
      readCachedCatalogExecutiveState,
      buildMissionControlResponse,
      buildClusterLaneTruthResponse,
      buildResearchOperationsResponse,
      buildInferenceRuntimeResponse,
      buildViewerRuntimeResponse,
      buildGoWorkNowResponse,
      deriveViewer,
      touchSession,
      listProjectSessions,
      runGoWorkNowAction
    });

    // ─── Agent routes (persistent agent pods — Claude Code, Codex, etc.) ────
    registerAgentRoutes(app);

    // ─── Agent scratchpad — shared notepad between agent + iOS ──────────────
    registerScratchpadRoutes(app);

    // ─── Job routes (cluster batch jobs — canonical escalation path) ───────
    registerJobRoutes(app);

    // ─── Queue routes (unified K8s + Slurm + Kueue view) ────────────────────
    registerQueueRoutes(app);

    // ─── Auth bridge to beagle-server (iOS gets token via cockpit) ──────────
    registerAuthBridgeRoutes(app);

    const server = http.createServer(app);

    // Keep upstream HTTP connections alive long enough for proxy/tunnel reuse.
    // Node's default 5s origin keepalive is short enough to cause intermittent
    // ECONNRESET/502s behind persistent proxy layers like cloudflared.
    const keepAliveTimeoutMs = Number.parseInt(
      process.env.PROJECT_COCKPIT_KEEP_ALIVE_TIMEOUT_MS || "75000",
      10
    );
    if (Number.isFinite(keepAliveTimeoutMs) && keepAliveTimeoutMs > 0) {
      server.keepAliveTimeout = keepAliveTimeoutMs;
      server.headersTimeout = keepAliveTimeoutMs + 5000;
    }

    // Both WSS use noServer: true and we route via a single upgrade handler.
    const wss = new WebSocketServer({ noServer: true });
    const agentWss = new WebSocketServer({ noServer: true });
    attachAgentWebSocket(agentWss);

    server.on("upgrade", (req, socket, head) => {
      const urlPath = (req.url || "").split("?")[0];
      if (urlPath === "/ws/terminal") {
        wss.handleUpgrade(req, socket, head, (ws) => wss.emit("connection", ws, req));
        return;
      }
      if (/^\/ws\/projects\/[^/]+\/agent\/[^/]+$/.test(urlPath)) {
        agentWss.handleUpgrade(req, socket, head, (ws) => agentWss.emit("connection", ws, req));
        return;
      }
      socket.destroy();
    });

    wss.on("connection", async (ws, req) => {
      const url = new URL(req.url, `http://${req.headers.host}`);
      const slug = url.searchParams.get("project") || "sounio";
      const clientSessionId = cleanValue(url.searchParams.get("sessionId"));
      const alias = cleanValue(url.searchParams.get("alias"));

      let project;
      try {
        project = await getProjectOrThrow(slug);
      } catch (error) {
        ws.send(JSON.stringify({ type: "error", data: error.message }));
        ws.close();
        return;
      }

      if (clientSessionId) {
        await touchSession(project.projectSlug, clientSessionId, deriveViewer(req, alias), {
          route: `/projects/${project.projectSlug}`,
          currentAction: "terminal-attached",
          lastTerminalAttachAt: new Date().toISOString()
        });
      }

      const shellCommand =
        'cd "$WORKSPACE_ROOT" && tmux attach -t "$TMUX_SESSION" || tmux new -s "$TMUX_SESSION"';

      const proc = pty.spawn(
        "kubectl",
        kubectlArgs(
          project,
          [
            "env",
            `WORKSPACE_ROOT=${project.workspaceRoot}`,
            `TMUX_SESSION=${project.tmuxSession}`,
            "sh",
            "-lc",
            shellCommand
          ],
          { tty: true }
        ),
        {
          name: "xterm-256color",
          cols: 120,
          rows: 34,
          cwd: process.cwd(),
          env: process.env
        }
      );

      proc.onData((data) => {
        if (ws.readyState === ws.OPEN) {
          ws.send(JSON.stringify({ type: "data", data }));
        }
      });

      proc.onExit(({ exitCode }) => {
        if (ws.readyState === ws.OPEN) {
          ws.send(JSON.stringify({ type: "exit", data: `terminal exited (${exitCode})` }));
          ws.close();
        }
      });

      ws.send(JSON.stringify({ type: "ready", data: { projectSlug: project.projectSlug } }));

      ws.on("message", (payload) => {
        try {
          const message = JSON.parse(String(payload));
          if (message.type === "input") {
            proc.write(message.data);
          }
          if (message.type === "resize") {
            proc.resize(Number(message.cols || 120), Number(message.rows || 34));
          }
        } catch {
          proc.write(String(payload));
        }
      });

      ws.on("close", () => {
        proc.kill();
      });
    });

    server.listen(port, host, () => {
      console.log(`Project cockpit server listening on http://${host}:${port}`);
      startJobReconciler();
      if (disableMemoryWarmers) {
        startupWarmState = {
          ...startupWarmState,
          status: "ready",
          lastReadyAt: new Date().toISOString(),
          lastError: "memory warmers disabled"
        };
        console.warn("[cockpit] memory warmers disabled; serving memory lanes on demand");
        return;
      }
      primeStartupWarmCaches().catch(() => {});
      setInterval(() => {
        warmMemoryCaches().catch(() => {});
        if (startupWarmState.status !== "ready") {
          primeStartupWarmCaches().catch(() => {});
        }
      }, memoryWarmIntervalMs).unref();
    });
  job-presets.mjs: |
    // job-presets.mjs
    //
    // Named job templates so agents don't have to hand-assemble image + command +
    // mounts every time. `cockpit_submit_job` accepts a `preset` param; the
    // preset's fields are deep-merged under the caller's body (caller wins on
    // conflict). Each preset stamps `labels["sounio.dev/preset"]` so the
    // reconciler can render a clean kind label into cognitive state.

    // The active workspace PVC is RWO/RWOP (ceph-rbd-ssd-rwop), attached to
    // the sounio-workspace-habitat StatefulSet — it can't be mounted by a
    // second pod. Presets therefore clone the sounio repo from GitHub into an
    // emptyDir at runtime. The runner image ships git + bash; for presets that
    // need the `souc` compiler, bake it into a fatter image as a follow-up.

    const IMAGE = () =>
      process.env.PROJECT_COCKPIT_SOUNIO_RUNNER_IMAGE || "ttl.sh/beagle-sounio:latest";
    const REPO = process.env.PROJECT_COCKPIT_SOUNIO_REPO
      || "https://github.com/sounio-lang/sounio.git";
    const BRANCH = process.env.PROJECT_COCKPIT_SOUNIO_BRANCH
      || "integration/sounio-dev-ready-base";

    export const JOB_PRESETS = {
      // Smoke preset — actually exercises the baked-in souc compiler on a
      // bundled example. Closes the full agent → cockpit → K8s → beagle →
      // cognitive state loop with a real compiler invocation.
      "sounio-compile-example": {
        image: IMAGE(),
        command: [
          "bash",
          "-lc",
          `set -euo pipefail; souc info | head -3; souc check /opt/sounio/examples/hello.sio && echo "souc-check-ok"`
        ],
        resources: { cpu: "1", memory: "2Gi", gpu: 0 },
        data_mounts: ["work-tmp"],
        timeout_seconds: 180,
        campaign: "sounio-smoke"
      },

      // Full test suite — runs against the baked sounio tree at /opt/sounio.
      // Scripts are relative to that root, SOUC_BIN points at the wrapper.
      "sounio-test-suite": {
        image: IMAGE(),
        command: [
          "bash",
          "-lc",
          `set -euo pipefail; cd /opt/sounio && export SOUC_BIN=/opt/sounio/bin/souc && bash scripts/run_sio_test_suite.sh`
        ],
        resources: { cpu: "2", memory: "4Gi", gpu: 0 },
        data_mounts: ["work-tmp"],
        timeout_seconds: 900,
        campaign: "sounio-ci"
      },

      // Stdlib hyper-execution gate — same pattern, longer budget.
      "sounio-stdlib-gate": {
        image: IMAGE(),
        command: [
          "bash",
          "-lc",
          `set -euo pipefail; cd /opt/sounio && export SOUC_BIN=/opt/sounio/bin/souc && bash scripts/stdlib_hyper_execution_gate.sh`
        ],
        resources: { cpu: "4", memory: "8Gi", gpu: 0 },
        data_mounts: ["work-tmp"],
        timeout_seconds: 1800,
        campaign: "sounio-ci"
      }
    };

    export function applyPreset(presetName, body) {
      if (!presetName) return body;
      const preset = JOB_PRESETS[presetName];
      if (!preset) {
        const err = new Error(
          `unknown preset "${presetName}". Available: ${Object.keys(JOB_PRESETS).join(", ")}`
        );
        err.statusCode = 400;
        throw err;
      }
      // Caller body wins on conflict; preset provides defaults.
      const merged = { ...preset, ...body };
      merged.labels = { ...(preset.labels || {}), ...(body.labels || {}), "sounio.dev/preset": presetName };
      merged._preset = presetName;
      return merged;
    }

    export function listPresets() {
      return Object.keys(JOB_PRESETS).map((name) => ({
        name,
        image: JOB_PRESETS[name].image,
        campaign: JOB_PRESETS[name].campaign,
        timeout_seconds: JOB_PRESETS[name].timeout_seconds,
        resources: JOB_PRESETS[name].resources
      }));
    }
  job-reconciler.mjs: |
    // job-reconciler.mjs
    //
    // Periodic reconciler that bridges K8s Job lifecycle to beagle-server's
    // ScienceJobRegistry. Without this, cockpit-submitted jobs are invisible
    // to `/api/v1/cognitive/state` (iOS widget, dashboards) — they complete
    // silently. Every RECONCILE_INTERVAL_MS:
    //
    //   1. List all `app.kubernetes.io/managed-by=cockpit` Jobs in the namespace.
    //   2. Compute current phase (Running / Pending / Succeeded / Failed).
    //   3. Diff against lastKnownPhase Map — only POST on change.
    //   4. First sight OR phase change → POST /api/jobs/external/register.
    //   5. Terminal transition (Succeeded/Failed) → POST /api/jobs/external/complete
    //      with tailed pod logs as error context if Failed.
    //
    // Auth: reuses fetchOperatorToken() from auth-bridge.mjs (same path as the
    // /api/auth/beagle-token route). Cache TTL is 5min; we refresh implicitly.

    import { fetchOperatorToken } from "./auth-bridge.mjs";
    import { listAllCockpitJobs, phaseFromJobManifest, tailJobLogs } from "./job-routes.mjs";

    const INTERVAL_MS = Number(process.env.PROJECT_COCKPIT_RECONCILE_INTERVAL_MS || 15000);
    const BEAGLE_URL = process.env.PROJECT_COCKPIT_BEAGLE_URL
      || process.env.BEAGLE_URL
      || "http://beagle-core.beagle.svc.cluster.local:8080";
    const CONSUMER = process.env.PROJECT_COCKPIT_BEAGLE_CONSUMER || "beagle-operator";

    // jobId → { phase, registered, completed }
    const lastState = new Map();

    function kindLabelFromJob(job) {
      const labels = job.metadata?.labels || {};
      return labels["sounio.dev/preset"]
        || labels.campaign
        || labels.project
        || "cockpit-job";
    }

    function jobIdFromJob(job) {
      return job.metadata?.labels?.["cockpit.sounio.dev/job-id"] || job.metadata?.name;
    }

    async function postBeagle(path, body) {
      const tok = await fetchOperatorToken();
      if (tok.error) {
        throw new Error(`auth: ${tok.error}`);
      }
      const resp = await fetch(`${BEAGLE_URL}${path}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Beagle-Consumer": CONSUMER,
          "Authorization": `Bearer ${tok.token}`
        },
        body: JSON.stringify(body)
      });
      if (!resp.ok) {
        const text = await resp.text().catch(() => "");
        throw new Error(`${path} → ${resp.status}: ${text.slice(0, 200)}`);
      }
      return resp.json().catch(() => ({}));
    }

    function mapPhaseToStatus(phase) {
      switch (phase) {
        case "Pending": return "created";
        case "Running": return "running";
        case "Succeeded": return "done";
        case "Failed": return "error";
        default: return "running";
      }
    }

    async function reconcileOnce() {
      const jobs = await listAllCockpitJobs();
      const seen = new Set();

      for (const job of jobs) {
        const jobId = jobIdFromJob(job);
        if (!jobId) continue;
        seen.add(jobId);

        const phase = phaseFromJobManifest(job);
        const label = kindLabelFromJob(job);
        const prev = lastState.get(jobId) || {};
        const startedAt = job.status?.startTime || job.metadata?.creationTimestamp;

        // First sight → register.
        if (!prev.registered) {
          try {
            await postBeagle("/api/jobs/external/register", {
              job_id: jobId,
              kind: label,
              status: mapPhaseToStatus(phase),
              started_at: startedAt
            });
            console.log(`[reconciler] registered ${jobId} kind=${label} phase=${phase}`);
            prev.registered = true;
          } catch (e) {
            console.warn(`[reconciler] register failed for ${jobId}: ${e.message}`);
            continue;
          }
        }

        // Phase change — upsert current status (handles Pending→Running and
        // any terminal transition below).
        if (prev.phase !== phase) {
          try {
            await postBeagle("/api/jobs/external/register", {
              job_id: jobId,
              kind: label,
              status: mapPhaseToStatus(phase),
              started_at: startedAt
            });
          } catch (e) {
            console.warn(`[reconciler] update failed for ${jobId}: ${e.message}`);
          }
        }

        // Terminal transition → complete (once).
        const terminal = phase === "Succeeded" || phase === "Failed";
        if (terminal && !prev.completed) {
          let errorContext = null;
          let exitCode = null;
          if (phase === "Failed") {
            const logs = await tailJobLogs(jobId, 20);
            errorContext = logs ? logs.slice(-1500) : "job failed (no logs)";
            // Extract exit code if pod status carries it (best effort)
            const condFailed = (job.status?.conditions || []).find((c) => c.type === "Failed");
            if (condFailed?.reason) {
              errorContext = `${condFailed.reason}: ${condFailed.message || ""}\n${errorContext}`;
            }
          }
          try {
            await postBeagle("/api/jobs/external/complete", {
              job_id: jobId,
              kind: label,
              status: phase === "Succeeded" ? "done" : "error",
              error: errorContext,
              exit_code: exitCode
            });
            console.log(`[reconciler] completed ${jobId} phase=${phase}`);
            prev.completed = true;
          } catch (e) {
            console.warn(`[reconciler] complete failed for ${jobId}: ${e.message}`);
          }
        }

        prev.phase = phase;
        lastState.set(jobId, prev);
      }

      // Garbage-collect state for jobs that no longer exist in cluster (TTL
      // cleanup removed them). Keeps the map bounded over long uptimes.
      for (const jobId of lastState.keys()) {
        if (!seen.has(jobId)) lastState.delete(jobId);
      }
    }

    export function startJobReconciler() {
      if (process.env.PROJECT_COCKPIT_DISABLE_RECONCILER === "1") {
        console.log("[reconciler] disabled via PROJECT_COCKPIT_DISABLE_RECONCILER=1");
        return;
      }
      console.log(`[reconciler] starting, interval=${INTERVAL_MS}ms, beagle=${BEAGLE_URL}`);
      // Run immediately so first tick happens on boot, not after the interval.
      reconcileOnce().catch((e) => console.warn(`[reconciler] boot tick failed: ${e.message}`));
      setInterval(() => {
        reconcileOnce().catch((e) => console.warn(`[reconciler] tick failed: ${e.message}`));
      }, INTERVAL_MS);
    }
