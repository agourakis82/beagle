      if (!prPreview) {
        prPreview = {
          branch: git.branch || "",
          base: preferredBase,
          ahead: 0,
          behind: 0,
          branchCommits: [],
          existingPr: null
        };
      }
      return {
        preferredBase,
        git,
        prPreview,
        partial
      };
    }

