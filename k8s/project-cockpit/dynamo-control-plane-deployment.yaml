apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-control-plane
  namespace: beagle
  labels:
    app.kubernetes.io/name: dynamo-control-plane
    app.kubernetes.io/part-of: beagle
    sounio.dev/state: scaffold
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamo-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamo-control-plane
        app.kubernetes.io/part-of: beagle
        sounio.dev/state: scaffold
    spec:
      serviceAccountName: project-cockpit
      nodeSelector:
        kubernetes.io/hostname: r740-proxmox
        sounio.dev/inference-fabric: "true"
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
      containers:
        - name: dynamo
          image: 192.168.3.207:5003/sounio-sglang-dynamo-runtime:dynamo-1.0.1-sglang-lite-20260522T152939Z
          imagePullPolicy: IfNotPresent
          env:
            - name: DYNAMO_ROLE
              value: frontend
            - name: DYNAMO_NAMESPACE
              value: beagle
            - name: DYNAMO_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYNAMO_HTTP_HOST
              value: 0.0.0.0
            - name: DYNAMO_HTTP_PORT
              value: "8000"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            privileged: true
            seccompProfile:
              type: Unconfined
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).read()
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).read()
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).read()
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
