apiVersion: v1
kind: Secret
metadata:
  name: beagle-telegram-secrets
  namespace: beagle
  labels:
    app.kubernetes.io/name: project-cockpit
    app.kubernetes.io/part-of: beagle
type: Opaque
stringData:
  # Replace with the real bot token from @BotFather before enabling the webhook.
  TELEGRAM_BOT_TOKEN: "REPLACE_WITH_BOT_TOKEN"
  # High-entropy random string (NOT the bot token) — verified against the
  # X-Telegram-Bot-Api-Secret-Token header so the bot token never rides in the webhook URL.
  # Generate with: openssl rand -hex 32   (must match what register-telegram-webhook.sh sends)
  TELEGRAM_WEBHOOK_SECRET: "REPLACE_WITH_RANDOM_SECRET"
  # Optional comma-separated allowlist of Telegram chat IDs.
  TELEGRAM_ALLOWED_CHAT_IDS: ""
