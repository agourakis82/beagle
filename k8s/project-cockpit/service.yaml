apiVersion: v1
kind: Service
metadata:
  name: project-cockpit
  namespace: beagle
  labels:
    app.kubernetes.io/name: project-cockpit
    app.kubernetes.io/part-of: beagle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: project-cockpit
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: project-cockpit-tailnet-http
  namespace: beagle
  labels:
    app.kubernetes.io/name: project-cockpit
    app.kubernetes.io/part-of: beagle
  annotations:
    tailscale.com/hostname: sounio-cockpit
    tailscale.com/proxy-group: sounio-workspace-ingress
    tailscale.com/tags: tag:k8s,tag:sounio-workspace
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: project-cockpit
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
