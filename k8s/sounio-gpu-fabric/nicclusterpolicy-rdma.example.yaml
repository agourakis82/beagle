apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: sounio-rdma-fabric
spec:
  # This is an intentionally conservative skeleton.
  # Fill concrete image versions and per-host device settings from the
  # current Network Operator docs before applying live.
  secondaryNetwork:
    multus:
      image: ghcr.io/k8snetworkplumbingwg/multus-cni:snapshot-thick
  rdmaSharedDevicePlugin:
    image: ghcr.io/mellanox/k8s-rdma-shared-dev-plugin:latest
    config: |
      {
        "configList": [
          {
            "resourceName": "rdma_shared_device_a",
            "rdmaHcaMax": 63,
            "selectors": {
              "ifNames": [
                "nic7",
                "nic3",
                "nic4",
                "ens5f1np1"
              ]
            }
          }
        ]
      }
