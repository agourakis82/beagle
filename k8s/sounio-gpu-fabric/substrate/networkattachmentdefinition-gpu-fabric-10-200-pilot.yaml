apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: gpu-fabric-10-200-pilot
  namespace: beagle
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "gpu-fabric-10-200-pilot",
      "type": "macvlan",
      "master": "gpufabricbr0",
      "mode": "bridge",
      "mtu": 9000,
      "ipam": {
        "type": "whereabouts",
        "range": "10.200.0.128/25",
        "exclude": [
          "10.200.0.254/32"
        ]
      }
    }
