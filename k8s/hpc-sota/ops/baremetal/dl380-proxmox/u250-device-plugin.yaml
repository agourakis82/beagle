# U250 FPGA exposto ao Kubernetes via generic-device-plugin (squat)
# Owner-deployed 2026-08-01. Robusto/version-agnostic: expõe os devnodes do card
# (não depende do ABI do XRT, que no 2026.1 trocou xbutil->xrt-smi).
# Node é LABELADO (sounio.dev/fpga=u250) mas NÃO tainted — os 48 cores seguem
# usáveis pra carga geral; a U250 é 1 recurso a mais (sounio.dev/u250).
apiVersion: v1
kind: ConfigMap
metadata:
  name: u250-device-plugin-config
  namespace: kube-system
data:
  config.yaml: |
    devices:
      - name: u250
        groups:
          - count: 1
            paths:
              - path: /dev/xclmgmt*
              - path: /dev/dri/renderD128
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: u250-fpga-device-plugin
  namespace: kube-system
  labels:
    app: u250-fpga-device-plugin
spec:
  selector:
    matchLabels:
      app: u250-fpga-device-plugin
  template:
    metadata:
      labels:
        app: u250-fpga-device-plugin
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        sounio.dev/fpga: u250
      tolerations:
        - operator: Exists   # roda mesmo se o nó ganhar taint no futuro
      containers:
        - name: generic-device-plugin
          image: ghcr.io/squat/generic-device-plugin:latest
          args:
            - --domain=sounio.dev
            - --config=/config/config.yaml
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 10m, memory: 20Mi}
            limits: {cpu: 50m, memory: 64Mi}
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
            - name: config
              mountPath: /config
      volumes:
        - name: device-plugin
          hostPath: {path: /var/lib/kubelet/device-plugins}
        - name: dev
          hostPath: {path: /dev}
        - name: config
          configMap: {name: u250-device-plugin-config}
