spec:
  extraConf: Features=scratch,gpu,k8s Gres=gpu:1
  logfile:
    image: docker.io/library/alpine:latest
    imagePullPolicy: IfNotPresent
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - r740-proxmox
      nodeSelector:
        sounio.dev/slurm-worker-gpuorangefs: "true"
      volumes:
        - name: orangefs-training
          hostPath:
            path: /var/lib/cephfs-slurm/training
            type: Directory
        - name: host-nvidia-smi
          hostPath:
            path: /usr/bin/nvidia-smi
            type: File
        - name: host-libnvidia-ml
          hostPath:
            path: /lib/x86_64-linux-gnu/libnvidia-ml.so.1
            type: File
        - name: host-libcuda
          hostPath:
            path: /lib/x86_64-linux-gnu/libcuda.so.1
            type: File
        - name: host-libnvidia-ptxjitcompiler
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1
            type: File
  slurmd:
    image: 192.168.3.207:5003/slurmd-sounio:25.11-uid1000-git-20260720
    imagePullPolicy: IfNotPresent
    lifecycle:
      postStart:
        exec:
          command:
            - /bin/bash
            - -lc
            - ldconfig
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "120"
        memory: 64Gi
    volumeMounts:
      - name: orangefs-training
        mountPath: /orangefs/training
      - name: host-nvidia-smi
        mountPath: /host-nvidia/nvidia-smi
        readOnly: true
      - name: host-nvidia-smi
        mountPath: /usr/bin/nvidia-smi
        readOnly: true
      - name: host-libnvidia-ml
        mountPath: /host-nvidia/libnvidia-ml.so.1
        readOnly: true
      - name: host-libnvidia-ml
        mountPath: /lib/x86_64-linux-gnu/libnvidia-ml.so.1
        readOnly: true
      - name: host-libcuda
        mountPath: /host-nvidia/libcuda.so.1
        readOnly: true
      - name: host-libcuda
        mountPath: /lib/x86_64-linux-gnu/libcuda.so.1
        readOnly: true
      - name: host-libnvidia-ptxjitcompiler
        mountPath: /host-nvidia/libnvidia-ptxjitcompiler.so.1
        readOnly: true
      - name: host-libnvidia-ptxjitcompiler
        mountPath: /lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1
        readOnly: true
      - name: host-libnvidia-ptxjitcompiler
        mountPath: /usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1
        readOnly: true
