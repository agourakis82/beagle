# Ceph OSDs can intentionally exit with status 0 after exceeding
# osd_max_markdown_count during a transient network partition.  The vendor
# unit uses Restart=on-failure, so that clean self-shutdown leaves the OSD
# inactive indefinitely.  Explicit `systemctl stop` is still respected with
# Restart=always; only autonomous process exits are restarted.
[Service]
Restart=always
RestartSec=30s
