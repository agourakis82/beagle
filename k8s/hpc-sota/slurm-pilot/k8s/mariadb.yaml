apiVersion: v1
kind: Secret
metadata:
  name: mariadb-root-password
  namespace: slurm-pilot
type: Opaque
stringData:
  password: CHANGE_ME
---
apiVersion: v1
kind: Service
metadata:
  name: slurm-pilot-mariadb
  namespace: slurm-pilot
spec:
  selector:
    app: slurm-pilot-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slurm-pilot-mariadb-data
  namespace: slurm-pilot
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd-ssd
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slurm-pilot-mariadb
  namespace: slurm-pilot
spec:
  serviceName: slurm-pilot-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: slurm-pilot-mariadb
  template:
    metadata:
      labels:
        app: slurm-pilot-mariadb
    spec:
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: prepare-run-dir
          image: busybox:1.36
          command:
            - sh
            - -lc
            - mkdir -p /run/mysqld && chmod 0777 /run/mysqld
          volumeMounts:
            - name: run
              mountPath: /run/mysqld
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: slurm-pilot-mariadb-data
        - name: run
          emptyDir: {}
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          args:
            - --socket=/run/mysqld/mysqld.sock
          env:
            - name: MARIADB_DATABASE
              value: slurm_acct_db
            - name: MARIADB_USER
              value: slurm
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-password
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-root-password
                  key: password
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - mysqladmin ping -h 127.0.0.1 -uroot -p"${MARIADB_ROOT_PASSWORD}"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - mysqladmin ping -h 127.0.0.1 -uroot -p"${MARIADB_ROOT_PASSWORD}"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  ordinals:
    start: 0
