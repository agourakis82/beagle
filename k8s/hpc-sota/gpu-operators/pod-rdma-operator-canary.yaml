apiVersion: v1
kind: Pod
metadata:
  name: rdma-operator-canary
  namespace: beagle
spec:
  restartPolicy: Never
  tolerations:
    - key: sounio.dev/pool
      operator: Equal
      value: gpu-batch
      effect: NoSchedule
    - key: sounio.dev/compute
      operator: Equal
      value: heavy
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: sounio.dev/accelerator-class
                operator: In
                values:
                  - gpu
  containers:
    - name: canary
      image: ghcr.io/mellanox/k8s-rdma-shared-dev-plugin:v1.5.3
      command:
        - /bin/sh
        - -lc
        - |
          echo "hostname=$(hostname)"
          echo "rdma_devices:"
          ls -l /dev/infiniband || true
      resources:
        limits:
          rdma/sounio_gpu_fabric_operator_canary: "1"
