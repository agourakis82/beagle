apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagle-core
  namespace: beagle
spec:
  strategy:
    type: Recreate
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: beagle-data
          persistentVolumeClaim:
            claimName: beagle-core-local-data
