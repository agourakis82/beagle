apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-zfast-t560-sounio-workspace-pv
spec:
  capacity:
    storage: 80Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfast-t560
  local:
    path: /zfast/workspaces/live/sounio-workspace
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - t560-proxmox
