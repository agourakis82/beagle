apiVersion: batch/v1
kind: Job
metadata:
  name: local-ai-runtime-r770-canary
  namespace: beagle
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-ai-runtime-r770-canary
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: r770-proxmox
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
      containers:
        - name: canary
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              set -eu
              date -Iseconds > /cache/ready.txt
              dd if=/dev/zero of=/cache/runtime.bin bs=1M count=64 conv=fsync
              sha256sum /cache/runtime.bin > /cache/runtime.bin.sha256
              ls -lah /cache
              df -h /cache
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: local-ai-runtime-r770-cache
