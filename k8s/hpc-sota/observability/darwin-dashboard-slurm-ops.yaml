apiVersion: v1
kind: ConfigMap
metadata:
  name: darwin-dashboard-slurm-ops
  namespace: darwin-platform
  labels:
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: darwin-observability
    darwin.observability: slurm-ops
    darwin.phase: B8
    grafana_dashboard: "1"
data:
  slurm-ops.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "datasource", "uid": "grafana" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": { "limit": 100, "matchAny": false, "tags": [], "type": "dashboard" },
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red" }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "id": 1,
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "max(kube_statefulset_status_replicas_ready{namespace=\"slurm-pilot\",statefulset=\"slurm-pilot-controller\"})", "instant": true, "refId": "A" } ],
          "title": "Controller Ready",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
