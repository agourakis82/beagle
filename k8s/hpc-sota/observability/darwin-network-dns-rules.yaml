# CAPTURADO DO CLUSTER em 10-ago-2026 — esta regra existia SÓ no cluster.
#
# Descoberto ao consertar o caminho de entrega do alarme: seis PrometheusRules aplicadas à mão
# em algum momento e nunca versionadas. São justamente as que vigiam a plataforma embaixo de tudo
# (nó fora de Ready, Prometheus/Alertmanager/CoreDNS caídos, Cilium, Ceph). Perder o namespace
# perderia as regras, e ninguém saberia o que faltava.
#
# Capturado com `kubectl get -o json` + limpeza de campos de servidor, e conferido com
# `kubectl apply --dry-run=server`, que respondeu `unchanged` — o arquivo é fiel, não aproximado.
# Ao editar aqui, aplique; ao editar no cluster, recapture. Ver darwin-alert-routing.yaml para
# como estas regras chegam a alguém.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/part-of: darwin-observability
    darwin.phase: B7.3
    release: darwin-observability
  name: darwin-network-dns-rules
  namespace: darwin-platform
spec:
  groups:
  - name: darwin.network-dns
    rules:
    - alert: DarwinCoreDNSTargetDown
      annotations:
        description: CoreDNS currently has fewer healthy scrape targets than the B7 baseline expects.
        summary: CoreDNS scrape target count is below baseline
      expr: sum(up{job="coredns"}) < 2
      for: 10m
      labels:
        domain: dns
        severity: critical
    - alert: DarwinCiliumOperatorTargetDown
      annotations:
        description: The Cilium operator metrics endpoint has been unavailable for at least 5 minutes.
        summary: Cilium operator metrics target is down
      expr: sum(up{job="cilium-operator-metrics"}) < 1
      for: 5m
      labels:
        domain: network
        severity: critical
    - alert: DarwinCiliumEnvoyTargetDown
      annotations:
        description: Cilium envoy currently has fewer healthy scrape targets than the B7 baseline expects.
        summary: Cilium envoy scrape target count is below baseline
      expr: sum(up{job="cilium-envoy"}) < 3
      for: 10m
      labels:
        domain: network
        severity: critical
