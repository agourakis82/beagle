# CAPTURADO DO CLUSTER em 10-ago-2026 — esta regra existia SÓ no cluster.
#
# Descoberto ao consertar o caminho de entrega do alarme: seis PrometheusRules aplicadas à mão
# em algum momento e nunca versionadas. São justamente as que vigiam a plataforma embaixo de tudo
# (nó fora de Ready, Prometheus/Alertmanager/CoreDNS caídos, Cilium, Ceph). Perder o namespace
# perderia as regras, e ninguém saberia o que faltava.
#
# Capturado com `kubectl get -o json` + limpeza de campos de servidor, e conferido com
# `kubectl apply --dry-run=server`, que respondeu `unchanged` — o arquivo é fiel, não aproximado.
# Ao editar aqui, aplique; ao editar no cluster, recapture. Ver darwin-alert-routing.yaml para
# como estas regras chegam a alguém.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/part-of: darwin-observability
    darwin.phase: B7.3
    release: darwin-observability
  name: darwin-observability-stack-rules
  namespace: darwin-platform
spec:
  groups:
  - name: darwin.observability-stack
    rules:
    - alert: DarwinPrometheusDown
      annotations:
        description: Prometheus has not been scrapeable for at least 5 minutes.
        summary: Prometheus is down
      expr: sum(up{job="darwin-observability-prometheus"}) < 1
      for: 5m
      labels:
        domain: observability
        severity: critical
    - alert: DarwinGrafanaDown
      annotations:
        description: Grafana has not been scrapeable for at least 10 minutes.
        summary: Grafana is down
      expr: sum(up{job="darwin-observability-grafana"}) < 1
      for: 10m
      labels:
        domain: observability
        severity: warning
    - alert: DarwinAlertmanagerDown
      annotations:
        description: Alertmanager has not been scrapeable for at least 5 minutes.
        summary: Alertmanager is down
      expr: sum(up{job=~".*alertmanager.*",namespace="darwin-platform"}) < 1
      for: 5m
      labels:
        domain: observability
        severity: warning
