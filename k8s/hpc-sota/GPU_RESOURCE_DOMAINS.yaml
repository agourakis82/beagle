future_controller_contract:
  - A GPU domain has exactly one active owner: batch, serving, shared-inference, maintenance, or quarantine.
  - Kubernetes DRA and Kueue may describe and admit Kubernetes workloads for a domain.
  - Slurm remains the accounting and execution authority for Slurm jobs.
  - Cross-plane ownership changes must go through gpu-lease and then Action Ledger when exposed in Cockpit.
