# Outer guardian for the Sounio durable-obligation control service.
#
# This process lives outside sounio-workspace-control-0. It survives a workspace
# Pod restart and restores the inner OCaml supervisor by calling the immutable
# shared-runtime API directly. No tmux session, screen scraping, or workspace
# checkout mutation participates in this path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sounio-obligation-guardian
  namespace: beagle
  labels:
    app.kubernetes.io/name: sounio-obligation-guardian
    app.kubernetes.io/part-of: loom
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sounio-obligation-guardian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sounio-obligation-guardian
        app.kubernetes.io/part-of: loom
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: sounio-workspace-governance
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      containers:
        - name: guardian
          image: 192.168.3.207:5003/project-cockpit:lanekey-ea9ade01
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_NAMESPACE
              value: beagle
            - name: TARGET_POD
              value: sounio-workspace-control-0
            - name: TARGET_CONTAINER
              value: workspace-ssh
            - name: GUARD_INTERVAL_SECONDS
              value: "5"
            - name: INNER_INTERVAL_SECONDS
              value: "2"
            - name: NTFY_URL
              value: http://ntfy.beagle.svc.cluster.local
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: topic
                  optional: true
            - name: NTFY_USER
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: user
                  optional: true
            - name: NTFY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: password
                  optional: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u

              BASE_HOME=/workspace/.home/openvscode-server
              WORKTREE=/workspace/sounio
              RUNTIME=/workspace/sounio/.git/sounio-coord-runtime/current/bin/sounio-coord-runtime
              MANIFEST=/workspace/sounio/.git/sounio-coord-runtime/current/manifest
              LAST_STATE=/tmp/sounio-obligation-guardian.state
              LAST_SUCCESS=/tmp/sounio-obligation-guardian.last-success

              exec_ws() {
                kubectl -n "$TARGET_NAMESPACE" exec "$TARGET_POD" \
                  -c "$TARGET_CONTAINER" -- \
                  su -s /bin/bash openvscode-server -c "$1" 2>&1
              }

              notify() {
                title=$1
                priority=$2
                tags=$3
                body=$4
                [ -n "${NTFY_TOPIC:-}" ] || return 0
                if [ -n "${NTFY_USER:-}" ]; then
                  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                    -u "$NTFY_USER:${NTFY_PASSWORD:-}" \
                    -H "Title: $title" -H "Priority: $priority" -H "Tags: $tags" \
                    -d "$body" "$NTFY_URL/$NTFY_TOPIC")
                else
                  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                    -H "Title: $title" -H "Priority: $priority" -H "Tags: $tags" \
                    -d "$body" "$NTFY_URL/$NTFY_TOPIC")
                fi
                case "$code" in
                  2*) echo "notification delivered: HTTP $code" ;;
                  *) echo "notification failed: HTTP $code" >&2 ;;
                esac
              }

              previous=booting
              printf '%s\n' "$previous" > "$LAST_STATE"
              while :; do
                command="cd $WORKTREE && grep -qx capability=loom-recoverable-control-service-v1 $MANIFEST && exec $RUNTIME obligation-supervisor-ensure --interval-seconds $INNER_INTERVAL_SECONDS"
                if ensured=$(exec_ws "$command"); then
                  status_command="cd $WORKTREE && exec $RUNTIME obligation-supervisor-status"
                  if status=$(exec_ws "$status_command") && echo "$status" | grep -q 'state=live'; then
                    now=$(date +%s)
                    printf '%s\n' "$now" > "$LAST_SUCCESS.tmp"
                    mv "$LAST_SUCCESS.tmp" "$LAST_SUCCESS"
                    current=live
                    echo "$ensured"
                    echo "$status"
                    case "$ensured" in
                      *" state=started "*|*" state=restarted "*)
                        notify "Sounio control service recovered" default arrows_counterclockwise \
                          "The outer guardian restored the tmux-free obligation supervisor. $ensured"
                        ;;
                    esac
                  else
                    current=down
                    echo "supervisor status verification failed: ${status:-unavailable}" >&2
                  fi
                else
                  current=down
                  echo "supervisor ensure failed: $ensured" >&2
                fi

                if [ "$current" != "$previous" ]; then
                  if [ "$current" = down ]; then
                    notify "Sounio control service unavailable" high warning \
                      "The outer guardian could not verify the obligation supervisor in $TARGET_POD."
                  fi
                  printf '%s\n' "$current" > "$LAST_STATE.tmp"
                  mv "$LAST_STATE.tmp" "$LAST_STATE"
                  previous=$current
                fi
                sleep "$GUARD_INTERVAL_SECONDS"
              done
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'now=$(date +%s); last=$(cat /tmp/sounio-obligation-guardian.last-success 2>/dev/null || echo 0); [ $((now - last)) -le 20 ]'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
