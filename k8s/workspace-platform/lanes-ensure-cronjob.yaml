# sounio-lanes-ensure — as 11 lanes de trabalho voltam sozinhas, e a volta AVISA.
#
# POR QUE EXISTE, e a assimetria que ficou visível ao vivo em 09-ago-2026: o pod do workspace foi
# recriado às 19:48 UTC e as 11 lanes morreram junto. O `loomd` voltou sozinho — a CronJob irmã o
# religou — e **nada levantou as lanes**. O supervisor tinha rede de segurança; o trabalho dele
# não tinha. Ficaram mortas até alguém rodar o herd à mão.
#
# SEGURANÇA MEDIDA, não suposta: `sounio-herd-split` sem argumento é ADITIVO. Rodado com as 12
# sessões de pé, os PIDs de TODOS os panes ficaram idênticos antes e depois — ele cria só o que
# falta e não encosta em lane viva. Sem essa medição isto seria um cron que reinicia o trabalho
# dele a cada 5 minutos.
#
# ESCAPE HATCH: se ele quiser deliberadamente ficar sem lanes (manutenção, depuração), basta
# `touch /workspace/.home/openvscode-server/.sem-autoherd`. Um cron que ressuscita o que o
# operador matou de propósito é pior que nenhum — ele deixa de poder desligar a própria frota.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sounio-lanes-ensure
  namespace: beagle
  labels:
    app.kubernetes.io/name: sounio-lanes-ensure
    app.kubernetes.io/part-of: loom
spec:
  # Deslocado dos minutos do `sounio-loomd-ensure` (*/5 = 0,5,10…) para os dois jobs não
  # disputarem o mesmo servidor tmux no mesmo instante.
  schedule: "2-59/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 900
      template:
        spec:
          restartPolicy: Never
          # O nodeSelector para o t560 foi REMOVIDO: ele "consertava" por acidente, tratando
          # uma causa que não existia (rota ClusterIP do dl380) e concentrando carga no nó que
          # já é ponto único de falha. Com o AppArmor liberado, o job roda em qualquer nó —
          # verificado no dl380, que era exatamente o que falhava.
          serviceAccountName: sounio-workspace-governance
          securityContext:
            seccompProfile:
              type: Unconfined
            # 🚨 O CONSERTO DE VERDADE (10-ago-2026). O `ntfy 000` NÃO era rota do dl380 — era o
            # perfil AppArmor padrão do nó bloqueando `pthread_create`, e o curl morria em
            # `getaddrinfo() thread failed to start` ao resolver DNS. Medido no MESMO nó: sem
            # isto, 5 POSTs → 000 000 000 000 000; com isto, 200 200 200 200 200.
            # `seccompProfile: Unconfined` sozinho NÃO cobre — este repo já pagou por isso no
            # build-job do project-cockpit, com a mesma assinatura de EPERM.
            appArmorProfile:
              type: Unconfined
          containers:
            - name: ensure
              image: 192.168.3.207:5003/project-cockpit:frota-d5c575f7
              imagePullPolicy: IfNotPresent
              env:
                - name: NTFY_URL
                  value: http://ntfy.beagle.svc.cluster.local
                - name: NTFY_TOPIC
                  valueFrom: { secretKeyRef: { name: ntfy-auth, key: topic, optional: true } }
                - name: NTFY_USER
                  valueFrom: { secretKeyRef: { name: ntfy-auth, key: user, optional: true } }
                - name: NTFY_PASSWORD
                  valueFrom: { secretKeyRef: { name: ntfy-auth, key: password, optional: true } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  POD=sounio-workspace-control-0
                  NS=beagle
                  B=/workspace/.home/openvscode-server

                  exec_ws() {
                    kubectl -n "$NS" exec "$POD" -c workspace-ssh -- \
                      su -s /bin/bash openvscode-server -c \
                      "export HOME=$B; export TMUX_TMPDIR=\$HOME/.tmux; $1" 2>/dev/null
                  }

                  if exec_ws "test -f $B/.sem-autoherd && echo sim" | grep -q sim; then
                    echo "sentinela .sem-autoherd presente — o operador desligou a frota de propósito"
                    exit 0
                  fi

                  # UMA fonte de verdade para o roster: a lista que o próprio herd usa. Manter
                  # uma segunda cópia aqui garantiria divergência na primeira lane nova.
                  esperadas=$(exec_ws "grep -m1 '^LANES=' ~/bin/sounio-herd-split | cut -d'\"' -f2")
                  antes=$(exec_ws 'tmux ls -F "#{session_name}" 2>/dev/null | sort | tr "\n" " "')
                  echo "esperadas: $esperadas"
                  echo "antes:     $antes"

                  faltando=""
                  for l in $esperadas; do
                    case " $antes " in *" $l "*) ;; *) faltando="$faltando $l";; esac
                  done

                  if [ -z "$faltando" ]; then
                    echo "todas de pé — nada a fazer"
                    exit 0
                  fi
                  echo "faltando:$faltando"

                  # O herd é ADITIVO (medido: com tudo de pé, nenhum PID muda). Ele cria o que
                  # falta e não encosta em lane viva.
                  exec_ws '~/bin/sounio-herd-split' | tail -3
                  sleep 8
                  depois=$(exec_ws 'tmux ls -F "#{session_name}" 2>/dev/null | sort | tr "\n" " "')
                  echo "depois:    $depois"

                  ainda=""
                  for l in $faltando; do
                    case " $depois " in *" $l "*) ;; *) ainda="$ainda $l";; esac
                  done

                  avisa() {
                    if [ -z "${NTFY_TOPIC:-}" ]; then echo "(sem NTFY_TOPIC)"; return 0; fi
                    if [ -n "${NTFY_USER:-}" ]; then
                      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                        -u "$NTFY_USER:$NTFY_PASSWORD" -H "Title: $1" -H "Priority: $2" \
                        -H "Tags: $3" -d "$4" "$NTFY_URL/$NTFY_TOPIC")
                    else
                      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                        -H "Title: $1" -H "Priority: $2" -H "Tags: $3" \
                        -d "$4" "$NTFY_URL/$NTFY_TOPIC")
                    fi
                    # O veredito é o STATUS. `curl -s -o /dev/null` engole 401 e sai com 0 — um
                    # despertador que falha calado é pior que nenhum.
                    case "$code" in 2*) echo "aviso enviado (ntfy $code)";; *) echo "AVISO NÃO ENVIADO (ntfy $code)";; esac
                  }

                  if [ -z "$ainda" ]; then
                    # Recuperar em silêncio esconderia a FREQUÊNCIA — e a frequência é o dado que
                    # decide se o pod está sendo recriado por algo que precisa de conserto.
                    avisa "lanes religadas" "default" "arrows_counterclockwise" \
                      "O herd religou:$faltando. Elas sobem no estado inicial do agente — o contexto anterior NÃO volta."
                    exit 0
                  fi

                  avisa "lanes NÃO subiram" "high" "warning" \
                    "O herd rodou e ainda faltam:$ainda. Olhe o pane morto (remain-on-exit deixa visível) antes de rodar de novo."
                  exit 1
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 200m, memory: 256Mi }
