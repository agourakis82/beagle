# Beagle Physiome — sovereign body+environment ingestion (ns: beagle, next to beagle-pg/beagle-core).
#
# NOTE: the `physiome-secrets` Secret is managed OUT-OF-BAND (kubectl patch), NOT in this
# manifest — a placeholder Secret here would clobber the real values on every `kubectl apply`.
# Keys: PHYSIOME_INGEST_TOKEN (= the beagle operator token the iOS app presents on
# /api/physiome/ingest) and OWM_API_KEY (OpenWeatherMap fallback for the /weather proxy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: physiome-ingest
  namespace: beagle
spec:
  replicas: 1
  selector:
    matchLabels: { app: physiome-ingest }
  template:
    metadata:
      labels: { app: physiome-ingest }
    spec:
      tolerations:
        - { key: sounio.dev/compute, operator: Equal, value: heavy, effect: NoSchedule }
        - { key: sounio.dev/pool, operator: Equal, value: gpu-batch, effect: NoSchedule }
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: physiome-ingest
          image: 192.168.3.207:5003/physiome:0.17.0-65b00b6b
          command: ["node", "bin/serve.mjs"]
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: PHYSIOME_PG_DSN
              valueFrom: { secretKeyRef: { name: beagle-pg, key: DATABASE_URL } }
            - name: PHYSIOME_INGEST_TOKEN
              valueFrom: { secretKeyRef: { name: physiome-secrets, key: PHYSIOME_INGEST_TOKEN } }
            # OpenWeatherMap fallback key for the /weather proxy (primary is Open-Meteo, keyless).
            - name: OWM_API_KEY
              valueFrom: { secretKeyRef: { name: physiome-secrets, key: OWM_API_KEY, optional: true } }
            # Apple WeatherKit REST — first-party weather source, tried before Open-Meteo/OWM.
            # apple-auth-key is the SAME cluster Secret used for Sign in with Apple (ns beagle);
            # optional:true so the deployment still comes up (falling back to Open-Meteo/OWM) if
            # the key or WeatherKit capability is ever missing/rotated.
            - name: WEATHERKIT_P8
              valueFrom: { secretKeyRef: { name: apple-auth-key, key: AuthKey.p8, optional: true } }
            - name: WEATHERKIT_KEY_ID
              valueFrom: { secretKeyRef: { name: apple-auth-key, key: key_id, optional: true } }
            - name: WEATHERKIT_TEAM_ID
              valueFrom: { secretKeyRef: { name: apple-auth-key, key: team_id, optional: true } }
            # Services ID / App ID that actually has the WeatherKit capability enabled and is
            # associated with the apple-auth-key signing key. VERIFIED 2026-07-02: this must be
            # "dev.sounio.beagle" — the iOS bundle id "dev.sounio.cockpit" gets a hard 401
            # NOT_ENABLED. Overridable so it can be corrected without a rebuild if Apple's portal
            # config changes.
            - name: WEATHERKIT_SERVICE_ID
              value: "dev.sounio.beagle"
            # APNs — same apple-auth-key signing key, token-based (JWT/ES256). optional:true so
            # the pod stays healthy (push silently disabled) if the key/capability is missing.
            # PROVEN 2026-07-02: sandbox accepts the JWT+topic (400 BadDeviceToken, not 403).
            - name: APNS_P8
              valueFrom: { secretKeyRef: { name: apple-auth-key, key: AuthKey.p8, optional: true } }
            - name: APNS_KEY_ID
              valueFrom: { secretKeyRef: { name: apple-auth-key, key: key_id, optional: true } }
            - name: APNS_TEAM_ID
              valueFrom: { secretKeyRef: { name: apple-auth-key, key: team_id, optional: true } }
            - name: APNS_TOPIC
              value: "dev.sounio.cockpit"
            - name: APNS_ENV
              value: "sandbox"
            # EMA place-change trigger — OFF until the N-of-1 experiment protocol is pre-registered.
            # Flip EMA_TRIGGER_ENABLED to "true" (kubectl set env, no rebuild) once the protocol is
            # locked; bump EMA_PROTOCOL_VERSION at that moment so every prompt/response is stamped.
            - name: EMA_TRIGGER_ENABLED
              value: "false"
            - name: EMA_PROTOCOL_VERSION
              value: "v0-draft"
            - name: EMA_COOLDOWN_MIN
              value: "90"
            - name: EMA_ACTIVE_HOURS
              value: "8-22"
            - name: EMA_TZ
              value: "America/Sao_Paulo"
            - name: EMA_LABELED_ONLY
              value: "false"
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: physiome-ingest
  namespace: beagle
spec:
  selector: { app: physiome-ingest }
  ports:
    - port: 8080
      targetPort: 8090
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: physiome-space-weather
  namespace: beagle
spec:
  schedule: "*/30 * * * *" # every 30 min — solar wind (rtsw/summary) updates ~1-min; the
  # old every-2h left the current value up to 2h stale even when the feed worked. As of 0.17.0
  # the snapshot ts is the freshest metric stamp (not Kp's 3-hourly), so each poll is a distinct
  # row → 30-min granularity for the fast channels. (True 1-min realtime = a further step.)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          tolerations:
            - { key: sounio.dev/compute, operator: Equal, value: heavy, effect: NoSchedule }
            - { key: sounio.dev/pool, operator: Equal, value: gpu-batch, effect: NoSchedule }
          securityContext:
            seccompProfile: { type: Unconfined }
          containers:
            - name: poller
              image: 192.168.3.207:5003/physiome:0.17.0-65b00b6b
              command: ["node", "bin/run-poller.mjs"]
              env:
                - name: PHYSIOME_PG_DSN
                  valueFrom: { secretKeyRef: { name: beagle-pg, key: DATABASE_URL } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: physiome-digest
  namespace: beagle
spec:
  schedule: "40 23 * * *" # daily 23:40 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          tolerations:
            - { key: sounio.dev/compute, operator: Equal, value: heavy, effect: NoSchedule }
            - { key: sounio.dev/pool, operator: Equal, value: gpu-batch, effect: NoSchedule }
          securityContext:
            seccompProfile: { type: Unconfined }
          containers:
            - name: digest
              image: 192.168.3.207:5003/physiome:0.17.0-65b00b6b
              command: ["sh", "-c", "node bin/run-digest.mjs $(date -u +%F)"]
              env:
                - name: PHYSIOME_PG_DSN
                  valueFrom: { secretKeyRef: { name: beagle-pg, key: DATABASE_URL } }
                - name: BEAGLE_INTERNAL_URL
                  value: "http://beagle-core.beagle.svc.cluster.local:8080"
                - name: BEAGLE_OPERATOR_API_TOKEN
                  valueFrom: { secretKeyRef: { name: beagle-core-tokens, key: operator-token } }
