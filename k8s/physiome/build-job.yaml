# Kaniko build for the physiome image. Run with:
#   kubectl delete job physiome-build -n beagle --ignore-not-found
#   kubectl apply -f k8s/physiome/build-job.yaml
# Then poll the registry tag (NOT the Job — TTL deletes it): 192.168.3.207:5003/v2/physiome/tags/list
apiVersion: batch/v1
kind: Job
metadata: { name: physiome-build, namespace: beagle }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        sounio.dev/runtime-role: io-lab
      tolerations:
        - { key: sounio.dev/compute, operator: Equal, value: heavy, effect: NoSchedule }
        - { key: sounio.dev/pool, operator: Equal, value: gpu-batch, effect: NoSchedule }
      securityContext: { seccompProfile: { type: Unconfined }, appArmorProfile: { type: Unconfined } }
      initContainers:
        - name: clone
          image: alpine/git:latest
          # Pinned to an immutable commit SHA (not a mutable branch) for reproducible, tamper-resistant builds. Bump per release.
          command: ["/bin/sh","-lc","cd /workspace && git init -q && git remote add origin https://github.com/agourakis82/beagle.git && git fetch -q --depth=1 origin 34ee470cf1a60445031c6b6c1e69dd5d94881d31 && git checkout -q FETCH_HEAD"]
          volumeMounts: [{ name: workspace, mountPath: /workspace }]
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - "--dockerfile=/workspace/apps/physiome/Dockerfile"
            - "--context=dir:///workspace"
            - "--destination=192.168.3.207:5003/physiome:instr-34ee470c"
            - "--insecure-registry=192.168.3.207:5003"
            - "--cache=false"
            - "--snapshot-mode=redo"
          volumeMounts: [{ name: workspace, mountPath: /workspace }]
          resources: { requests: { cpu: "300m", memory: "2Gi" }, limits: { cpu: "4", memory: "6Gi" } }
          # A RESERVA era 1 CPU e o no io-lab (5860) esta com 93% da CPU RESERVADA
          # — 11255m de 12000m — enquanto usa 13% de verdade. O job ficava Pending
          # por reserva, nao por falta de maquina. O teto de 4 continua: ele ainda
          # constroi rapido, so nao bloqueia 1 CPU inteira enquanto espera I/O.
      volumes: [{ name: workspace, emptyDir: { sizeLimit: 3Gi } }]
