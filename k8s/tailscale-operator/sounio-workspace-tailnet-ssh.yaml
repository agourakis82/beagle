# Publica o SSH do workspace no tailnet como sounio-workspace-ssh.
#
# Este arquivo e referenciado por ops/repair-workspace-tailnet-services.sh
# (SSH_MANIFEST) mas nao existia no repo — o script de reparo falharia. Criado em
# 2026-08-06 a partir do servico VIVO, nao do last-applied-configuration.
#
# ATENCAO ao seletor: o last-applied gravado no cluster ainda dizia
# `sounio-workspace-habitat`, enquanto o servico vivo aponta para
# `sounio-workspace-control`. Aplicar o last-applied reverteria o seletor e
# derrubaria o SSH. O valor correto e o de baixo.
#
# SOMENTE TCP. Nao acrescente porta UDP aqui — ja foi tentado e nao funciona.
#
# Este Service usa `tailscale.com/proxy-group`, e nesse modo o proxy nao instala
# regra DNAT nenhuma: a tabela nat dos pods sounio-workspace-ingress-* esta
# vazia (4 linhas, so as politicas padrao). O TCP/2222 chega porque o proprio
# tailscaled aceita a conexao e reabre para o ClusterIP — um encaminhador que so
# trata TCP. UDP nao tem quem o pegue e some sem deixar rastro.
#
# Medido em 2026-08-06: com 60001/UDP declarado aqui, o Service reconciliava e o
# EndpointSlice listava a porta, mas rajadas de UDP do Mac para o VIP
# (100.124.91.219) nunca moviam a fila rx do socket no pod.
#
# Para mosh, veja sounio-workspace-tailnet-mosh.yaml: proxy standalone, sem
# proxy-group, que usa DNAT de verdade.
apiVersion: v1
kind: Service
metadata:
  name: sounio-workspace-tailnet-ssh
  namespace: beagle
  annotations:
    tailscale.com/hostname: sounio-workspace-ssh
    tailscale.com/proxy-group: sounio-workspace-ingress
    tailscale.com/tags: tag:k8s,tag:sounio-workspace
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  publishNotReadyAddresses: true
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 86400
  selector:
    app.kubernetes.io/name: sounio-workspace-control
  ports:
    - name: ssh
      port: 2222
      protocol: TCP
      targetPort: ssh
