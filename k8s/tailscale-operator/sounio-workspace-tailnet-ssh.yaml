apiVersion: v1
kind: Service
metadata:
  name: sounio-workspace-tailnet-ssh
  namespace: beagle
  annotations:
    tailscale.com/proxy-group: sounio-workspace-ingress
    tailscale.com/hostname: sounio-workspace-ssh
    tailscale.com/tags: tag:k8s,tag:sounio-workspace
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: sounio-workspace-habitat
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
      protocol: TCP
