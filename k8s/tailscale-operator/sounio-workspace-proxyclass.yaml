apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: sounio-workspace-proxy
  namespace: tailscale
spec:
  statefulSet:
    pod:
      tolerations:
        - key: sounio.dev/pool
          operator: Exists
          effect: NoSchedule
        - key: sounio.dev/compute
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
