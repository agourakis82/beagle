apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moshi-ingress
  namespace: moshi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: moshi-server
  policyTypes:
    - Ingress
  ingress:
    # Only the beagle namespace (beagle-core proxy) may reach port 8998.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beagle
      ports:
        - protocol: TCP
          port: 8998
