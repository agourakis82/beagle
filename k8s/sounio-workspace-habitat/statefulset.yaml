apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sounio-workspace-habitat
  namespace: beagle
spec:
  serviceName: sounio-workspace-habitat-internal
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: sounio-workspace-habitat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sounio-workspace-habitat
        app.kubernetes.io/part-of: beagle
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      affinity:
        nodeAffinity:
          # Prefer the validated workers for the habitat, but do not hard-pin
          # scheduling now that the workspace images are pullable from the lab
          # registry.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - r740-proxmox
                      - r770-proxmox
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - r740-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
      containers:
        - name: workspace-ide
          image: 192.168.3.207:5003/sounio-lab-sounio-workspace-ide-20260406213306-743727:stable
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - /opt/sounio-workspace/bootstrap-workspace.sh
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BEAGLE_WORKSPACE_ID
              value: sounio-cluster-pilot-habitat
            - name: BEAGLE_SESSION_ID
              value: ws-cluster-sounio-habitat-vnext
            - name: BEAGLE_WORKSPACE_BROWSER_URL
              value: http://sounio-workspace-habitat.beagle.svc.cluster.local:8080
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-config
              mountPath: /opt/sounio-workspace/bootstrap-workspace.sh
              subPath: bootstrap-workspace.sh
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
        - name: workspace-ssh
          image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260406213306-743727:stable
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - -lc
            - passwd -d openvscode-server >/dev/null 2>&1 || true; exec /usr/local/bin/ssh-entrypoint.sh
          env:
            - name: BEAGLE_WORKSPACE_ID
              value: sounio-cluster-pilot-habitat
            - name: BEAGLE_SESSION_ID
              value: ws-cluster-sounio-habitat-vnext
            - name: BEAGLE_WORKSPACE_BROWSER_URL
              value: http://sounio-workspace-habitat.beagle.svc.cluster.local:8080
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          ports:
            - name: ssh
              containerPort: 2222
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-ssh-authorized-keys
              mountPath: /var/run/beagle-workspace-ssh
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: workspace-config
          configMap:
            name: sounio-workspace-config
            defaultMode: 0755
        - name: workspace-ssh-authorized-keys
          secret:
            secretName: sounio-workspace-ssh-authorized-keys
            optional: true
            defaultMode: 0600
  volumeClaimTemplates:
    - metadata:
        name: workspace-data
      spec:
        # Single-writer semantics keep the workspace safe during cutover and
        # avoid multiple nodes racing the same persisted home/repo.
        accessModes:
          - ReadWriteOncePod
        storageClassName: ceph-rbd-ssd-rwop
        resources:
          requests:
            storage: 50Gi
        volumeMode: Filesystem
