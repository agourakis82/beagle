apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sounio-workspace-habitat
  namespace: beagle
spec:
  serviceName: sounio-workspace-habitat-internal
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: sounio-workspace-habitat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sounio-workspace-habitat
        app.kubernetes.io/part-of: beagle
    spec:
      serviceAccountName: sounio-workspace-admin
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: sounio.dev/runtime-role
                    operator: In
                    values:
                      - infra-control
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - t560-proxmox
            - weight: 90
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - r770-proxmox
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: sounio.dev/runtime-role
                    operator: In
                    values:
                      - infra-control
                      - cluster-core
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: normalize-permissions
          image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260424065320-slurmnative5:stable
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -lc
            - set -euo pipefail; mkdir -p /workspace/.beagle /workspace/.home/openvscode-server; chown -R 1000:1000 /workspace
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
      containers:
        - name: workspace-ide
          image: 192.168.3.207:5003/sounio-lab-sounio-workspace-ide-20260424070010-slurmnative6:stable
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - /opt/sounio-workspace/bootstrap-workspace.sh
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BEAGLE_WORKSPACE_ID
              value: sounio-cluster-pilot-habitat
            - name: BEAGLE_SESSION_ID
              value: ws-cluster-sounio-habitat-vnext
            - name: BEAGLE_WORKSPACE_BROWSER_URL
              value: http://sounio-workspace-habitat.beagle.svc.cluster.local:8080
            - name: HOME
              value: /workspace/.home/openvscode-server
            - name: USER
              value: openvscode-server
            - name: LOGNAME
              value: openvscode-server
            - name: SHELL
              value: /usr/bin/zsh
            - name: NODE_OPTIONS
              value: --max-old-space-size=49152
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: slurm-runtime
              mountPath: /run/slurm
            - name: workspace-slurm-auth
              mountPath: /etc/slurm
              readOnly: true
            - name: workspace-config
              mountPath: /opt/sounio-workspace
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "28"
              memory: 64Gi
            limits:
              cpu: "28"
              memory: 64Gi
        - name: workspace-ssh
          image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260424065320-slurmnative5:stable
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: true
            appArmorProfile:
              type: Unconfined
            privileged: true
          command:
            - /bin/bash
            - -lc
            - >
              passwd -d openvscode-server >/dev/null 2>&1 || true;
              install -d -m 0700 -o 1000 -g 1000 "${TMUX_TMPDIR:-/workspace/.home/openvscode-server/.tmux}";
              su -s /bin/sh openvscode-server -c '
                export TMUX_TMPDIR="${TMUX_TMPDIR:-/workspace/.home/openvscode-server/.tmux}";
                mkdir -p "${TMUX_TMPDIR}";
                chmod 700 "${TMUX_TMPDIR}";
                tmux has-session -t sounio-dev 2>/dev/null || tmux new-session -d -s sounio-dev
              ' >/dev/null 2>&1 || true;
              exec /usr/local/bin/ssh-entrypoint.sh
          env:
            - name: BEAGLE_WORKSPACE_ID
              value: sounio-cluster-pilot-habitat
            - name: BEAGLE_SESSION_ID
              value: ws-cluster-sounio-habitat-vnext
            - name: BEAGLE_WORKSPACE_BROWSER_URL
              value: http://sounio-workspace-habitat.beagle.svc.cluster.local:8080
            - name: HOME
              value: /workspace/.home/openvscode-server
            - name: USER
              value: openvscode-server
            - name: LOGNAME
              value: openvscode-server
            - name: SHELL
              value: /usr/bin/zsh
            - name: LANG
              value: C.UTF-8
            - name: LC_ALL
              value: C.UTF-8
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          ports:
            - name: ssh
              containerPort: 2222
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: slurm-runtime
              mountPath: /run/slurm
            - name: workspace-slurm-auth
              mountPath: /etc/slurm
              readOnly: true
            - name: workspace-ssh-authorized-keys
              mountPath: /var/run/beagle-workspace-ssh
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222 && test -S /run/slurm/sack.socket
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222 && test -S /run/slurm/sack.socket
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: workspace-config
          configMap:
            name: sounio-workspace-config
            defaultMode: 0755
        - name: slurm-runtime
          emptyDir:
            medium: Memory
        - name: workspace-slurm-auth
          secret:
            secretName: sounio-workspace-slurm-auth
            defaultMode: 0440
        - name: workspace-ssh-authorized-keys
          secret:
            secretName: sounio-workspace-ssh-authorized-keys
            optional: true
            defaultMode: 0600
  volumeClaimTemplates:
    - metadata:
        name: workspace-data
      spec:
        # Single-writer semantics keep the workspace safe during cutover and
        # avoid multiple nodes racing the same persisted home/repo.
        accessModes:
          - ReadWriteOncePod
        storageClassName: ceph-rbd-ssd-rwop
        resources:
          requests:
            storage: 500Gi
        volumeMode: Filesystem
