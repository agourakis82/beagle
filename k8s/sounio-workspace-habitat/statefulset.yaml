apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sounio-workspace-habitat
  namespace: beagle
spec:
  serviceName: sounio-workspace-habitat-internal
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: sounio-workspace-habitat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sounio-workspace-habitat
        app.kubernetes.io/part-of: beagle
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      affinity:
        nodeAffinity:
          # Keep the habitat off the GPU inference node. This is a long-lived
          # developer/compiler surface, so it belongs on infra-control or
          # cluster-core capacity where it won't compete with model serving.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: sounio.dev/runtime-role
                    operator: In
                    values:
                      - infra-control
                      - cluster-core
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: sounio.dev/runtime-role
                    operator: In
                    values:
                      - infra-control
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - t560-proxmox
            - weight: 90
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - r770-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: normalize-permissions
          image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260406213306-743727:stable
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -lc
            - set -euo pipefail; mkdir -p /workspace/.beagle /workspace/.home/openvscode-server; chown -R 1000:1000 /workspace
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
      containers:
        - name: workspace-ide
          image: 192.168.3.207:5003/sounio-lab-sounio-workspace-ide-20260406213306-743727:stable
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - /opt/sounio-workspace/bootstrap-workspace.sh
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BEAGLE_WORKSPACE_ID
              value: sounio-cluster-pilot-habitat
            - name: BEAGLE_SESSION_ID
              value: ws-cluster-sounio-habitat-vnext
            - name: BEAGLE_WORKSPACE_BROWSER_URL
              value: http://sounio-workspace-habitat.beagle.svc.cluster.local:8080
            - name: NODE_OPTIONS
              value: --max-old-space-size=8192
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-config
              mountPath: /opt/sounio-workspace/bootstrap-workspace.sh
              subPath: bootstrap-workspace.sh
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - curl -fsS http://127.0.0.1:8080/ >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 12Gi
        - name: workspace-ssh
          image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260406213306-743727:stable
          imagePullPolicy: Always
          securityContext:
            appArmorProfile:
              type: Unconfined
          command:
            - /bin/sh
            - -lc
            - passwd -d openvscode-server >/dev/null 2>&1 || true; exec /usr/local/bin/ssh-entrypoint.sh
          env:
            - name: BEAGLE_WORKSPACE_ID
              value: sounio-cluster-pilot-habitat
            - name: BEAGLE_SESSION_ID
              value: ws-cluster-sounio-habitat-vnext
            - name: BEAGLE_WORKSPACE_BROWSER_URL
              value: http://sounio-workspace-habitat.beagle.svc.cluster.local:8080
          envFrom:
            - configMapRef:
                name: sounio-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          ports:
            - name: ssh
              containerPort: 2222
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-ssh-authorized-keys
              mountPath: /var/run/beagle-workspace-ssh
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - sh
                - -lc
                - nc -z 127.0.0.1 2222
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: workspace-config
          configMap:
            name: sounio-workspace-config
            defaultMode: 0755
        - name: workspace-ssh-authorized-keys
          secret:
            secretName: sounio-workspace-ssh-authorized-keys
            optional: true
            defaultMode: 0600
  volumeClaimTemplates:
    - metadata:
        name: workspace-data
      spec:
        # Single-writer semantics keep the workspace safe during cutover and
        # avoid multiple nodes racing the same persisted home/repo.
        accessModes:
          - ReadWriteOncePod
        storageClassName: ceph-rbd-ssd-rwop
        resources:
          requests:
            storage: 50Gi
        volumeMode: Filesystem
