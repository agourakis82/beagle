apiVersion: v1
kind: Pod
metadata:
  name: sounio-zellij-recovery
  namespace: beagle
  labels:
    app.kubernetes.io/name: sounio-zellij-recovery
    app.kubernetes.io/part-of: beagle
spec:
  restartPolicy: Always
  tolerations:
    - operator: Exists
  securityContext:
    fsGroup: 1000
    seccompProfile:
      type: Unconfined
  containers:
    - name: workspace-ssh
      image: 192.168.3.207:5003/sounio-lab-beagle-workspace-ssh-20260425-zellij1:stable
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -lc
        - passwd -d openvscode-server >/dev/null 2>&1 || true; exec /usr/local/bin/ssh-entrypoint.sh
      env:
        - name: HOME
          value: /workspace/.home/openvscode-server
        - name: USER
          value: openvscode-server
        - name: LOGNAME
          value: openvscode-server
        - name: SHELL
          value: /usr/bin/zsh
        - name: BEAGLE_WORKSPACE_ID
          value: sounio-zellij-recovery
        - name: BEAGLE_SESSION_ID
          value: sounio-dev-recovery
      ports:
        - containerPort: 2222
          name: ssh
      volumeMounts:
        - name: workspace-data
          mountPath: /workspace
        - name: workspace-ssh-authorized-keys
          mountPath: /var/run/beagle-workspace-ssh
          readOnly: true
        - name: slurm-runtime
          mountPath: /run/slurm
        - name: workspace-slurm-auth
          mountPath: /etc/slurm
          readOnly: true
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 16Gi
      securityContext:
        appArmorProfile:
          type: Unconfined
  volumes:
    - name: workspace-data
      persistentVolumeClaim:
        claimName: workspace-data-sounio-workspace-habitat-0
    - name: workspace-ssh-authorized-keys
      secret:
        secretName: sounio-workspace-ssh-authorized-keys
        optional: true
        defaultMode: 384
    - name: slurm-runtime
      emptyDir:
        medium: Memory
    - name: workspace-slurm-auth
      secret:
        secretName: sounio-workspace-slurm-auth
        defaultMode: 288
