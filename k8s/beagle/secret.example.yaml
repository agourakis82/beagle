apiVersion: v1
kind: Secret
metadata:
  name: beagle-core-secrets
type: Opaque
stringData:
  # Replace values before applying to the cluster.
  BEAGLE_API_TOKEN: replace-me
  BEAGLE_OPERATOR_API_TOKEN: replace-me
  BEAGLE_RESEARCH_API_TOKEN: replace-me
  BEAGLE_DATACITE_TEST_USERNAME: ""
  BEAGLE_DATACITE_TEST_PASSWORD: ""
  BEAGLE_CROSSREF_TEST_USERNAME: ""
  BEAGLE_CROSSREF_TEST_PASSWORD: ""
  DEEPSEEK_API_KEY: ""
  ZAI_API_KEY: ""
  GROQ_API_KEY: ""
  XAI_API_KEY: ""
  MINIMAX_API_KEY: ""
  VOYAGE_API_KEY: ""
  DATABASE_URL: postgres://beagle:replace-me@postgresql.beagle.svc.cluster.local:5432/beagle
  REDIS_URL: redis://redis.beagle.svc.cluster.local:6379/0
  NEO4J_URI: neo4j://neo4j.beagle.svc.cluster.local:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: replace-me
  QDRANT_URL: http://qdrant.beagle.svc.cluster.local:6333
