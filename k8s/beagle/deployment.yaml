apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagle-core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beagle-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beagle-core
        app.kubernetes.io/part-of: beagle
    spec:
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
      containers:
        - name: core-server
          image: 192.168.3.207:5003/beagle-core-exocortex:sounio-workday-mvp-c63a309
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: beagle-core-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: beagle-data
              mountPath: /var/lib/beagle
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      volumes:
        - name: beagle-data
          persistentVolumeClaim:
            claimName: beagle-data
