apiVersion: batch/v1
kind: Job
metadata:
  name: beagle-core-build
  namespace: beagle
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        sounio.dev/runtime-role: cluster-core
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
      restartPolicy: Never
      initContainers:
        - name: clone
          image: alpine/git:latest
          env:
            - name: BEAGLE_GIT_BRANCH
              value: feat/exocortex-grounding
            - name: BEAGLE_GIT_REF
              value: 03e3095b
          command:
            - /bin/sh
            - -lc
            - git clone --depth=50 --branch="${BEAGLE_GIT_BRANCH:-main}" https://github.com/agourakis82/beagle.git /workspace && cd /workspace && git checkout "${BEAGLE_GIT_REF:-main}"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          env:
            - name: BEAGLE_IMAGE_TAG
              value: exocortex-reindex-03e3095b
          args:
            - "--dockerfile=/workspace/apps/beagle-monorepo/Dockerfile.core_server"
            - "--context=dir:///workspace"
            - "--destination=192.168.3.207:5003/beagle-core-exocortex:$(BEAGLE_IMAGE_TAG)"
            - "--insecure-registry=192.168.3.207:5003"
            - "--cache=false"
            - "--snapshot-mode=redo"
            - "--verbosity=info"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
              ephemeral-storage: 20Gi
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
