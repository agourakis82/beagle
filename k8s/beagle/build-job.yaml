apiVersion: batch/v1
kind: Job
metadata:
  name: beagle-core-build
  namespace: beagle
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        sounio.dev/runtime-role: cluster-core
      tolerations:
        - key: sounio.dev/compute
          operator: Equal
          value: heavy
          effect: NoSchedule
        - key: sounio.dev/pool
          operator: Equal
          value: gpu-batch
          effect: NoSchedule
      restartPolicy: Never
      initContainers:
        - name: clone
          image: alpine/git:latest
          command: ["git", "clone", "--depth=1", "--branch=feat/ios-terminal-quality-pass",
                    "https://github.com/agourakis82/beagle.git", "/workspace"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - "--dockerfile=/workspace/apps/beagle-monorepo/Dockerfile.core_server"
            - "--context=dir:///workspace"
            - "--destination=ttl.sh/beagle-core-roundtable:24h"
            - "--cache=false"
            - "--snapshot-mode=redo"
            - "--verbosity=info"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
