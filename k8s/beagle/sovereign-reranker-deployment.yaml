apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagle-sovereign-reranker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beagle-sovereign-reranker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beagle-sovereign-reranker
        app.kubernetes.io/part-of: beagle
    spec:
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: text-embeddings-inference
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - BAAI/bge-reranker-v2-m3
            - --port
            - "80"
            - --auto-truncate
          ports:
            - name: http
              containerPort: 80
          env:
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
            limits:
              cpu: "8"
              memory: 24Gi
          securityContext:
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
            seccompProfile:
              type: Unconfined
      volumes:
        - name: model-cache
          emptyDir: {}
