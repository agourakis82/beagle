apiVersion: apps/v1
kind: Deployment
metadata:
  name: sounio-runner
  namespace: beagle
  labels:
    app: sounio-runner
    component: temporal-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sounio-runner
  template:
    metadata:
      labels:
        app: sounio-runner
        component: temporal-worker
    spec:
      containers:
        - name: sounio-runner
          image: ghcr.io/agourakis82/beagle/sounio-runner:v2.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8095
          env:
            - name: PORT
              value: "8095"
            - name: BEAGLE_CORE_URL
              value: http://beagle-core.beagle.svc.cluster.local:8080
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: SOUNIO_TEMPORAL_NAMESPACE
              value: beagle
            - name: SOUNIO_TEMPORAL_TASK_QUEUE
              value: sounio-paperrun
            - name: SOUNIO_TEMPORAL_WORKER_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sounio-runner
  namespace: beagle
  labels:
    app: sounio-runner
spec:
  selector:
    app: sounio-runner
  ports:
    - name: http
      port: 8095
      targetPort: http
