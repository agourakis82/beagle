apiVersion: v1
kind: Secret
metadata:
  name: beagle-mcp-oauth
  namespace: beagle
type: Opaque
stringData:
  # Auth0/Stytch/OIDC authorization server base URL.
  authorization_server_url: "https://AUTH_DOMAIN"

  # Issuer expected in OAuth access tokens. Use the exact provider metadata value,
  # including a trailing slash when the provider uses one.
  issuer: "https://AUTH_DOMAIN"

  # JWKS endpoint used by beagle-mcp-server to verify JWT signatures.
  jwks_uri: "https://AUTH_DOMAIN/.well-known/jwks.json"

  # Audience/resource expected in access tokens.
  audience: "https://mcp.agourakis.com/mcp"
