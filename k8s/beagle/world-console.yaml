apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-console
  namespace: beagle
  labels:
    app: world-console
    component: spatial-worlds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: world-console
  template:
    metadata:
      labels:
        app: world-console
        component: spatial-worlds
    spec:
      containers:
        - name: world-console
          image: ghcr.io/agourakis82/beagle/world-console:v3.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: PORT
              value: "8096"
            - name: BEAGLE_SPATIAL_WORLD_DIR
              value: /orangefs/beagle-spatial-worlds
            - name: WORLDLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldlabs-marble
                  key: api_key
                  optional: true
            - name: WORLD_CONSOLE_MOCK
              value: "false"
          volumeMounts:
            - name: orangefs-spatial
              mountPath: /orangefs/beagle-spatial-worlds
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: orangefs-spatial
          persistentVolumeClaim:
            claimName: beagle-spatial-worlds
---
apiVersion: v1
kind: Service
metadata:
  name: world-console
  namespace: beagle
  labels:
    app: world-console
spec:
  selector:
    app: world-console
  ports:
    - name: http
      port: 8096
      targetPort: http
