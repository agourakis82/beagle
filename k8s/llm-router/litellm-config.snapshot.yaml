    litellm_params:
      model: openai/claude-opus-5
      api_base: http://10.100.100.2:9500/v1
      api_key: noauth
      timeout: 600
      rpm: 200

  - model_name: claude-opus-4-8
    litellm_params:
      model: openai/claude-opus-4-8
      api_base: http://10.100.100.2:9500/v1
      api_key: noauth
      timeout: 600
      rpm: 200

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/claude-sonnet-5
      api_base: http://10.100.100.2:9500/v1
      api_key: noauth
      timeout: 600

router_settings:
  routing_strategy: latency-based-routing
  retry_after: 5
  num_retries: 2
  timeout: 600
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: true

general_settings:
