      # REMOVER esta linha, ou trocar api_base para http:// se nao houver TLS real.
      ssl_verify: false
      timeout: 1200

  # === PaddleOCR-VL 1.6 multimodal: A5000, llama.cpp CUDA, NVMe local ===
  - model_name: paddleocr-vl-1.6
    litellm_params:
      model: openai/PaddleOCR-VL-1.6
      api_base: https://paddleocr-vl.paddleocr-vl.svc.cluster.local:8118/v1
      api_key: os.environ/PADDLEOCR_VL_API_KEY
      # ssl_verify: false — endpoint dormente (scale-to-0) em 02-ago-2026, nao deu
      # para checar se e self-signed. Ao reviver: montar a CA + SSL_CERT_FILE e
      # REMOVER esta linha, ou trocar api_base para http:// se nao houver TLS real.
      ssl_verify: false
      timeout: 600

  - model_name: ocr
