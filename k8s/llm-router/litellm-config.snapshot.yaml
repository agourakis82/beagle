# SOTA 2026 router — Darwin cluster (v3: + ensemble exotico chines)
model_list:
  # === 14B primario: llama.cpp na L4 do r770 (k8s/memory-pg/llamacpp-l4-r770.yaml) ===
  # Apontava para `vllm.vllm-r770-eagle3` — namespace VAZIO em 18-ago-2026. `qwen2.5-14b` e o
  # alias `chat-fast` roteavam para o nada; o `fallbacks` la embaixo mandava tudo para o Spark
  # e escondia isso. Destino de router nao se verifica por estar no arquivo, so por responder.
  # Medido no substituto: ~26 tok/s numa requisicao, ~65 tok/s agregados com 4 concorrentes.
  - model_name: qwen2.5-14b
    litellm_params:
      model: openai/qwen2.5-14b-l4
      api_base: http://llamacpp-l4.beagle.svc.cluster.local:8000/v1
      api_key: noauth
      rpm: 60          # a L4 entrega ~65 tok/s agregados; 600 era numero de backend fantasma

  # === SOTA coder: 32B AWQ RTX 8000 ===
  - model_name: qwen2.5-coder-32b
    litellm_params:
      model: openai/qwen2.5-coder-32b
      api_base: http://vllm.vllm-coder-rtx8000.svc.cluster.local:8000/v1
      api_key: noauth
      rpm: 400

  # === Aliases por GPU/use-case ===
  - model_name: chat-fast
    litellm_params:
      model: openai/qwen2.5-14b-l4
      api_base: http://llamacpp-l4.beagle.svc.cluster.local:8000/v1
      api_key: noauth

  - model_name: code
    litellm_params:
      model: openai/qwen2.5-coder-32b
      api_base: http://vllm.vllm-coder-rtx8000.svc.cluster.local:8000/v1
      api_key: noauth

  # === Qwen3.6 35B-A3B uncensored: RTX 8000, llama.cpp CUDA, NVMe local ===
  - model_name: qwen3.6-35b-a3b-uncensored
    litellm_params:
      model: openai/qwen3.6-35b-a3b-uncensored
      api_base: https://10.96.58.156:8000/v1
      api_key: os.environ/QWEN36_API_KEY
      # ssl_verify: false — endpoint dormente (scale-to-0) em 02-ago-2026, nao deu
      # para checar se e self-signed. Ao reviver: montar a CA + SSL_CERT_FILE e
      # REMOVER esta linha, ou trocar api_base para http:// se nao houver TLS real.
      ssl_verify: false
      timeout: 1200

  - model_name: uncensored
    litellm_params:
      model: openai/qwen3.6-35b-a3b-uncensored
      api_base: https://10.96.58.156:8000/v1
