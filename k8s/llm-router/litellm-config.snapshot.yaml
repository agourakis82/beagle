# SOTA 2026 router — Darwin cluster (v3: + ensemble exotico chines)
model_list:
  # === SOTA primary: 14B + EAGLE-3 speculative ===
  - model_name: qwen2.5-14b
    litellm_params:
      model: openai/qwen2.5-14b
      api_base: http://vllm.vllm-r770-eagle3.svc.cluster.local:8000/v1
      api_key: noauth
      rpm: 600

  # === SOTA coder: 32B AWQ RTX 8000 ===
  - model_name: qwen2.5-coder-32b
    litellm_params:
      model: openai/qwen2.5-coder-32b
      api_base: http://vllm.vllm-coder-rtx8000.svc.cluster.local:8000/v1
      api_key: noauth
      rpm: 400

  # === Aliases por GPU/use-case ===
  - model_name: chat-fast
    litellm_params:
      model: openai/qwen2.5-14b
      api_base: http://vllm.vllm-r770-eagle3.svc.cluster.local:8000/v1
      api_key: noauth

  - model_name: code
    litellm_params:
      model: openai/qwen2.5-coder-32b
      api_base: http://vllm.vllm-coder-rtx8000.svc.cluster.local:8000/v1
      api_key: noauth

  # === Qwen3.6 35B-A3B uncensored: RTX 8000, llama.cpp CUDA, NVMe local ===
  - model_name: qwen3.6-35b-a3b-uncensored
    litellm_params:
      model: openai/qwen3.6-35b-a3b-uncensored
      api_base: https://10.96.58.156:8000/v1
      api_key: os.environ/QWEN36_API_KEY
      # ssl_verify: false — endpoint dormente (scale-to-0) em 02-ago-2026, nao deu
      # para checar se e self-signed. Ao reviver: montar a CA + SSL_CERT_FILE e
      # REMOVER esta linha, ou trocar api_base para http:// se nao houver TLS real.
      ssl_verify: false
      timeout: 1200

  - model_name: uncensored
    litellm_params:
      model: openai/qwen3.6-35b-a3b-uncensored
      api_base: https://10.96.58.156:8000/v1
      api_key: os.environ/QWEN36_API_KEY
      # ssl_verify: false — endpoint dormente (scale-to-0) em 02-ago-2026, nao deu
      # para checar se e self-signed. Ao reviver: montar a CA + SSL_CERT_FILE e
      # REMOVER esta linha, ou trocar api_base para http:// se nao houver TLS real.
      ssl_verify: false
      timeout: 1200

  # === PaddleOCR-VL 1.6 multimodal: A5000, llama.cpp CUDA, NVMe local ===
  - model_name: paddleocr-vl-1.6
    litellm_params:
      model: openai/PaddleOCR-VL-1.6
      api_base: https://paddleocr-vl.paddleocr-vl.svc.cluster.local:8118/v1
      api_key: os.environ/PADDLEOCR_VL_API_KEY
      # ssl_verify: false — endpoint dormente (scale-to-0) em 02-ago-2026, nao deu
      # para checar se e self-signed. Ao reviver: montar a CA + SSL_CERT_FILE e
      # REMOVER esta linha, ou trocar api_base para http:// se nao houver TLS real.
      ssl_verify: false
      timeout: 600

  - model_name: ocr
    litellm_params:
      model: openai/PaddleOCR-VL-1.6
      api_base: https://paddleocr-vl.paddleocr-vl.svc.cluster.local:8118/v1
      api_key: os.environ/PADDLEOCR_VL_API_KEY
      # ssl_verify: false — endpoint dormente (scale-to-0) em 02-ago-2026, nao deu
      # para checar se e self-signed. Ao reviver: montar a CA + SSL_CERT_FILE e
      # REMOVER esta linha, ou trocar api_base para http:// se nao houver TLS real.
      ssl_verify: false
      timeout: 600

  # === CIENTÍFICOS (RTX 8000 scale-to-0; só 1 ativo por vez via rtx8000-switch.sh) ===
  - model_name: phi4-reasoning
    litellm_params: { model: openai/phi4-reasoning, api_base: http://vllm.vllm-phi4-rtx8000.svc.cluster.local:8000/v1, api_key: noauth }
  - model_name: science                       # alias -> Phi-4 (pick padrão)
    litellm_params: { model: openai/phi4-reasoning, api_base: http://vllm.vllm-phi4-rtx8000.svc.cluster.local:8000/v1, api_key: noauth }
  - model_name: r1-distill-70b
    litellm_params: { model: openai/r1-distill-70b, api_base: http://vllm.vllm-r1-rtx8000.svc.cluster.local:8000/v1, api_key: noauth }
  - model_name: olmo3-think
    litellm_params: { model: openai/olmo3-think, api_base: http://vllm.vllm-olmo3-rtx8000.svc.cluster.local:8000/v1, api_key: noauth }

  # === FILOSOFIA/MENTE: Hermes 4.3 36B (Nous, Seed-OSS) — low-sycophancy, RTX 8000 ===
  - model_name: hermes-4
    litellm_params:
      model: openai/hermes-4
      api_base: http://vllm.vllm-hermes-rtx8000.svc.cluster.local:8000/v1
      api_key: noauth
      rpm: 200

  - model_name: mind
    litellm_params:
      model: openai/hermes-4
      api_base: http://vllm.vllm-hermes-rtx8000.svc.cluster.local:8000/v1
      api_key: noauth

  # === EXOTICO #1: Hunyuan-7B (Tencent) — decorrelacao corpus/lab, A5000 ===
  - model_name: hunyuan-7b
    litellm_params:
      model: openai/hunyuan-7b
      api_base: http://vllm.vllm-hunyuan-a5000.svc.cluster.local:8000/v1
      api_key: noauth
      rpm: 300

  # === EXOTICO #2: Baichuan-M2-32B medico (RTX 8000, scale-to-0) ===
  - model_name: baichuan-m2-med
    litellm_params:
      model: openai/baichuan-m2-med
      api_base: http://vllm.vllm-baichuan-rtx8000.svc.cluster.local:8000/v1
      api_key: noauth
      rpm: 200

  - model_name: med
    litellm_params:
      model: openai/baichuan-m2-med
