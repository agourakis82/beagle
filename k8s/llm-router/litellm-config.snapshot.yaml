    litellm_params:
      model: openai/bge-m3
      api_base: http://tei.tei-embeddings.svc.cluster.local:8080
      api_key: noauth

  - model_name: embed
    litellm_params:
      model: openai/bge-m3
      api_base: http://tei.tei-embeddings.svc.cluster.local:8080
      api_key: noauth

  # === Claude via proxy OAuth (Max subscription, $0) — t560:9500 ===
