router_settings:
  fallbacks: [{"chat-fast": ["spark-qwen-14b"]}, {"code": ["spark-coder-32b"]}, {"qwen2.5-14b": ["spark-qwen-14b"]}, {"qwen2.5-coder-32b": ["spark-coder-32b"]}, {"science": ["spark-phi4-reasoning"]}, {"mind": ["spark-qwq-32b"]}]
  routing_strategy: latency-based-routing
  retry_after: 5
  num_retries: 2
  timeout: 600
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: true

general_settings:
