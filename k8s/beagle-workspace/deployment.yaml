apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagle-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beagle-workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beagle-workspace
        app.kubernetes.io/part-of: beagle
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: t560-proxmox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      containers:
        - name: workspace-ide
          image: docker.io/gitpod/openvscode-server@sha256:236821ee7c8f9284b7f94799d4b66bc465926f435ac323af03e50bfb503c1ca1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /opt/beagle-workspace/bootstrap-workspace.sh
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: beagle-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-config
              mountPath: /opt/beagle-workspace/bootstrap-workspace.sh
              subPath: bootstrap-workspace.sh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: workspace-ssh
          image: localhost/beagle-workspace-ssh:b204
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 2222
          envFrom:
            - configMapRef:
                name: beagle-workspace-config
            - secretRef:
                name: beagle-core-secrets
                optional: true
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: workspace-ssh-authorized-keys
              mountPath: /var/run/beagle-workspace-ssh
              readOnly: true
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: beagle-workspace-data
        - name: workspace-config
          configMap:
            name: beagle-workspace-config
            defaultMode: 0755
        - name: workspace-ssh-authorized-keys
          secret:
            secretName: beagle-workspace-ssh-authorized-keys
            optional: true
            defaultMode: 0600
