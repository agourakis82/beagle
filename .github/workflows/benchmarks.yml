name: Benchmarks

on:
  pull_request:
    paths-ignore:
      - 'beagle-ios/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/apple-ci.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'beagle-ios/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/apple-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Run benchmarks
        run: |
          if [ -d "crates/beagle-hypergraph" ] && [ -f "crates/beagle-hypergraph/benches/hypergraph_benchmarks.rs" ]; then
            cd crates/beagle-hypergraph
            cargo bench --bench hypergraph_benchmarks || echo "Benchmarks failed, continuing..."
          else
            echo "Benchmark suite not found, skipping..."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: crates/beagle-hypergraph/target/criterion/
        continue-on-error: true
